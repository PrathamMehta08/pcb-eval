<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Break a real circuit board on purpose and see whether a language model notices.">
<meta name="theme-color" content="#08090c">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #08090c; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head><body>
<title>PCB Eval</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;450;500&display=swap">
<style>
/* --------------------------------------------------------------- tokens ---
   Dark first: this is an instrument, and copper only reads on a dark ground.
   The chrome follows the viewer's theme; the board well does not, the same way
   a photograph or a map does not invert. Every colour is declared here before
   any media query or [data-theme] block redefines it. */
:root {
  --ground: #08090c;
  --panel: #0d0f14;
  --raised: #12151c;
  --line: #1d212b;
  --line-soft: #14171f;
  --ink: #e6eae7;
  --ink-mid: #9aa3a9;
  --ink-dim: #6d757d;
  --mint: #4fd39a;
  --mint-ink: #08090c;
  --crit: #ff7061;
  --warn: #e9b657;
  --focus: #4fd39a;

  /* The board well and everything drawn in it. Theme-independent. */
  --well: #06090b;
  --substrate: #0a1310;
  --edge: #cbb98a;
  --f-cu: #c8564a;
  --b-cu: #4f83c6;
  --pad: #dcae52;
  --hole: #06090b;
  --via: #97a3ae;
  --silk: #b3bfb8;
  --label: #7f9089;

  --radius: 3px;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f2f3f1;
    --panel: #ffffff;
    --raised: #f7f8f6;
    --line: #dfe3df;
    --line-soft: #ebeeea;
    --ink: #14171a;
    --ink-mid: #4e565c;
    --ink-dim: #767e85;
    --mint: #0d8f63;
    --mint-ink: #ffffff;
    --crit: #c0392b;
    --warn: #a2740f;
    --focus: #0d8f63;
  }
}
:root[data-theme="light"] {
  --ground: #f2f3f1;
  --panel: #ffffff;
  --raised: #f7f8f6;
  --line: #dfe3df;
  --line-soft: #ebeeea;
  --ink: #14171a;
  --ink-mid: #4e565c;
  --ink-dim: #767e85;
  --mint: #0d8f63;
  --mint-ink: #ffffff;
  --crit: #c0392b;
  --warn: #a2740f;
  --focus: #0d8f63;
}

* { box-sizing: border-box; }
/* The artifact wrapper's reset carries this; repeating it keeps the file
   self-sufficient, and `display: flex` on a floating overlay beats the user
   agent's [hidden] rule without it. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
/* Form controls do not inherit type. Without this the layer chips and every
   field render in the user agent's own font while the page around them is in
   Inter, which is the sort of difference you see before you can name it. */
button, input, select, textarea { font-family: inherit; font-size: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ----------------------------------------------------------------- shell --- */
.app { display: flex; flex-direction: column; height: 100vh; min-height: 560px; }

header {
  display: flex; align-items: baseline; gap: 20px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex: none;
}
.brand {
  font-family: var(--mono); font-weight: 600; font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase;
}
.brand em { color: var(--mint); font-style: normal; }
.board-id {
  font-family: var(--mono); color: var(--ink-dim); font-size: 11px;
  letter-spacing: .04em;
}
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; padding: 5px 12px; cursor: pointer;
  background: none; border: 1px solid transparent; color: var(--ink-dim);
  border-radius: var(--radius);
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--mint); border-color: var(--line); background: var(--raised); }
.stats {
  font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
  font-variant-numeric: tabular-nums; margin-left: 20px;
}

main { display: flex; flex: 1; min-height: 0; }

/* -------------------------------------------------------------- viewport --- */
.viewport { position: relative; flex: 1; min-width: 0; background: var(--well); }
#stage { position: absolute; inset: 0; }
.board-svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.board-svg.panning { cursor: grabbing; }

.overlay-tl, .overlay-br {
  position: absolute; display: flex; gap: 6px; align-items: center;
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
}
.overlay-tl { left: 12px; bottom: 12px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.overlay-br { right: 12px; bottom: 12px; color: #56626a; }
/* Below about 560px the two rows of chips would sit on top of each other. */
@media (max-width: 560px) {
  .overlay-tl { bottom: 44px; }
  .overlay-br span { display: none; }
}
.chip {
  padding: 3px 8px; cursor: pointer; text-transform: uppercase;
  background: rgba(10, 14, 18, .82); color: #c3ccd2;
  border: 1px solid #232a31; border-radius: var(--radius);
}
.chip::before {
  content: ""; display: inline-block; width: 7px; height: 7px;
  margin-right: 6px; vertical-align: 0; border-radius: 50%;
  background: var(--dot, #97a3ae);
}
.chip[data-layer="f-cu"] { --dot: var(--f-cu); }
.chip[data-layer="b-cu"] { --dot: var(--b-cu); }
.chip[data-layer="silk"] { --dot: var(--silk); }
.chip[data-layer="labels"] { --dot: var(--label); }
.chip.off { color: #5c666d; }
.chip.off::before { background: #333b42; }

/* ------------------------------------------------------------ review view ---
   The review used to happen entirely in a panel at the bottom of the rail, so
   pressing the button changed nothing where anyone was looking. It gets the
   stage now: the board stays underneath, in whichever view the finding belongs
   in, and the report sits over it. */
.tab-review[data-state="none"] { opacity: .55; }
.tab-review[data-state="running"] { color: var(--warn); border-color: var(--line); }
.tab-review[data-state="done"]::after {
  content: attr(data-count); margin-left: 6px; font-size: 9px;
  padding: 0 5px; border-radius: 8px; vertical-align: 1px;
  background: var(--crit); color: #120706;
}

/* The well behind it is dark in both themes, so this panel does not follow the
   page palette — it is furniture on the board, like the layer chips. */
#review-overlay {
  position: absolute; right: 12px; top: 12px; bottom: 12px;
  width: clamp(340px, 34vw, 560px);
  max-width: calc(100% - 24px); display: flex; flex-direction: column;
  background: rgba(10, 12, 16, .93); border: 1px solid var(--line);
  border-radius: 5px; overflow: hidden;
  backdrop-filter: blur(3px);
}
.ro-head {
  padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none;
}
.ro-head h3 {
  margin: 0 0 8px; font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: #c3ccd2;
}
.ro-score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ro-score div {
  padding: 6px 8px; border-radius: var(--radius); background: rgba(255,255,255,.04);
  border: 1px solid var(--line);
}
.ro-score b {
  display: block; font-family: var(--mono); font-size: 17px; line-height: 1.1;
  color: #9aa3a9; font-variant-numeric: tabular-nums;
}
.ro-score span {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: #79828b;
}
.ro-score .good { border-color: var(--mint); } .ro-score .good b { color: var(--mint); }
.ro-score .bad { border-color: var(--crit); } .ro-score .bad b { color: var(--crit); }
.ro-score .warn { border-color: var(--warn); } .ro-score .warn b { color: var(--warn); }

.ro-list { overflow-y: auto; flex: 1; }
.ro-item .bullet { max-width: 68ch; }
.ro-said, .ro-role { max-width: 72ch; }
.ro-item {
  display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
  padding: 10px 14px; background: none; border: 0;
  border-bottom: 1px solid var(--line-soft); border-left: 2px solid transparent;
  font: inherit;
}
.ro-item:hover { background: rgba(255,255,255,.03); }
.ro-item.on { background: rgba(255,255,255,.06); border-left-color: var(--mint); }
.ro-item.sev-critical { border-left-color: var(--crit); }
.ro-item.sev-major { border-left-color: var(--warn); }
.ro-item.on.sev-critical, .ro-item.on.sev-major { border-left-color: var(--mint); }
.ro-item .bullet {
  display: block; font-size: 12.5px; color: #9aa3a9; margin-bottom: 4px;
  padding-left: 58px; text-indent: -58px;
}
.ro-item .bullet:first-child { color: #e6eae7; }
.ro-item .bullet em {
  display: inline-block; width: 54px; margin-right: 4px; text-indent: 0;
  font-family: var(--mono); font-size: 9px; font-style: normal;
  letter-spacing: .1em; text-transform: uppercase; color: #6d757d;
  vertical-align: 1px;
}
.ro-item .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ro-item code {
  font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 2px;
  background: rgba(255,255,255,.06); color: #b6bfc5;
}
.ro-item .where {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--mint); margin-top: 6px; display: block;
}
.ro-foot {
  padding: 10px 14px; border-top: 1px solid var(--line); flex: none;
  font-size: 11.5px; color: #79828b;
}
/* The graph, running. `measured` steps ask no model anything, and that is the
   distinction the whole page is about, so it is the one thing coloured. */
.ro-step {
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  border-left: 2px solid var(--line);
}
.ro-step.measured { border-left-color: var(--mint); background: rgba(79, 211, 154, .04); }
.ro-step.looping { border-left-color: var(--warn); }
.ro-step.running { background: rgba(233, 182, 87, .06); }
.ro-step-head {
  display: flex; align-items: center; gap: 7px; font-family: var(--mono);
  font-size: 12px; color: #e6eae7;
}
.ro-step.measured .ro-step-head b { color: var(--mint); }
.ro-step.looping .ro-step-head b { color: var(--warn); }
.ro-pass, .ro-tag {
  font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
  color: #6d757d; border: 1px solid var(--line); padding: 0 5px; border-radius: 8px;
}
.ro-tag { color: var(--mint); border-color: rgba(79, 211, 154, .35); }
.ro-role { display: block; margin-top: 3px; font-size: 11.5px; color: #79828b; }
.ro-said { display: block; margin-top: 5px; font-size: 12px; color: #b6bfc5; }
.ro-said code { font-family: var(--mono); color: var(--mint); }
.ro-step.looping .ro-said code { color: var(--warn); }
.ro-rule {
  display: block; margin-top: 4px; padding-left: 9px; font-size: 11.5px;
  color: #9aa3a9; border-left: 1px solid var(--line);
}
.ro-rule.dropped { color: var(--warn); }

/* No scroller of its own. It sits inside the panel's one scroll region now, and
   a second one nested in the first is most of why the panel was hard to read:
   expanding it gave you two bars, neither of which moved the whole thing. */
.ro-graph { border-top: 1px solid var(--line-soft); }
.ro-graph summary {
  padding: 9px 14px; cursor: pointer; font-family: var(--mono); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: #79828b;
}
.ro-graph summary:hover { color: #e6eae7; }

.ro-empty { padding: 22px 16px; text-align: center; }
.ro-empty p { color: #9aa3a9; font-size: 12.5px; margin: 0 0 14px; }
.ro-running { display: flex; align-items: center; gap: 9px; color: var(--warn); font-family: var(--mono); font-size: 12px; }
.ro-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warn);
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .ro-dot { animation: none; opacity: .8 } }
.ro-stream {
  margin: 10px 0 0; font-family: var(--mono); font-size: 10px; line-height: 1.5;
  color: #6d757d; max-height: 160px; overflow: hidden; white-space: pre-wrap;
}

@media (max-width: 760px) {
  #review-overlay { left: 12px; width: auto; }
}

#flash {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  padding: 7px 14px; border-radius: var(--radius); font-family: var(--mono);
  font-size: 11px; background: var(--crit); color: #120706;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
#flash.on { opacity: 1; }

/* ------------------------------------------------------------ board paint --- */
.substrate { fill: var(--substrate); }
.edge { fill: none; stroke: var(--edge); stroke-width: .16; opacity: .8; }

.zone { stroke: none; }
.zone.f-cu { fill: var(--f-cu); opacity: .17; }
.zone.b-cu { fill: var(--b-cu); opacity: .15; }
.track { stroke-linecap: round; }
.track.f-cu { stroke: var(--f-cu); }
.track.b-cu { stroke: var(--b-cu); }
.pad { fill: var(--pad); stroke: none; }
.pad-hole { fill: #2c3238; }
.drill, .via-drill { fill: var(--hole); }
.via { fill: var(--via); }
/* Round caps so a zero-length silkscreen line — four of them on this board,
   which is how KiCad draws a dot — is a dot rather than nothing. */
.fp-silk { fill: none; stroke: var(--silk); stroke-width: .1; opacity: .5; stroke-linecap: round; }
/* Transparent, but it takes the pointer: the whole part is a grab target. */
.fp-body { fill: transparent; stroke: none; }
.ref-label {
  fill: var(--label); font-family: var(--mono); font-size: .95px;
  letter-spacing: .02px; pointer-events: none; user-select: none;
}

.hide-f-cu .f-cu, .hide-b-cu .b-cu { display: none; }
.hide-silk .fp-silk { display: none; }
.hide-labels .ref-label { display: none; }

/* Selection and net highlighting. Dimming the rest reads better than lighting
   one thing up, because a net is a shape spread across the whole board. */
.footprint.selected .pad { stroke: var(--mint); stroke-width: .09; }
.pad.selected, .via.selected { stroke: var(--mint); stroke-width: .12; }
.track.selected { stroke: var(--mint); }
.zone.selected { stroke: var(--mint); stroke-width: .12; opacity: .3; }
.board-svg:has(.net-lit) .track:not(.net-lit),
.board-svg:has(.net-lit) .zone:not(.net-lit),
.board-svg:has(.net-lit) .via:not(.net-lit) { opacity: .12; }
.board-svg:has(.net-lit) .pad:not(.net-lit) { opacity: .3; }

.mark { fill: none; stroke: var(--crit); stroke-width: .25; }
.mark-edit { stroke: var(--mint); stroke-dasharray: .9 .6; }

/* Where the board stops agreeing with itself. A schematic edit changes the net
   list and nothing else, so this is the only place it becomes visible. */
.stale-pad { fill: none; stroke: var(--warn); stroke-width: .16; }
.ratsnest {
  stroke: var(--warn); stroke-width: .12; stroke-dasharray: .6 .4;
  fill: none; opacity: .95;
}
.stranded { fill: none; stroke: var(--crit); stroke-width: .16; opacity: .9; }
.footprint { cursor: move; }

/* ------------------------------------------------------- footprint detail ---
   The board view answers "where is this part". At board scale a 0402 is four
   pixels, so it cannot answer "what does this pad look like". This does. */
.fp-view {
  display: flex; align-items: center; justify-content: center;
  margin: 10px 0 12px; padding: 10px; min-height: 84px;
  background: var(--well); border: 1px solid var(--line);
  border-radius: var(--radius);
}
.fp-svg { max-width: 100%; height: auto; }
.fp-fab { fill: none; stroke: #4a5560; stroke-width: .05; }
.fp-silk { fill: none; stroke: var(--silk); stroke-width: .06; opacity: .55; }
.fp-copper { fill: var(--pad); }
.fp-np_thru_hole .fp-copper { fill: #55606a; }
.fp-drill { fill: var(--hole); }
.fp-num {
  fill: #17202a; font-family: var(--mono); font-weight: 600;
  text-anchor: middle; dominant-baseline: central; pointer-events: none;
}
.fp-np_thru_hole + .fp-num { fill: #aab4bd; }

/* ------------------------------------------------------------- inspector --- */
.facts dt { color: var(--ink-dim); }
.eyebrow .count {
  margin-left: 6px; padding: 0 5px; border-radius: 7px; font-size: 9px;
  color: var(--ink-dim); background: var(--raised); border: 1px solid var(--line);
}
.field-pair { display: flex; gap: 10px; }
.field-pair .field { flex: 1; min-width: 0; margin: 6px 0; }
/* A 78px label is right when the fields are stacked and every label lines up.
   Inside a pair it is half the space, and the value ends up jammed against the
   next label, so here the label takes only the room its own words need. */
.field-pair .field span { width: auto; }
.pin-filter {
  width: 100%; margin: 0 0 6px; padding: 5px 8px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.pins .fn {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
  width: 58px; flex: none; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
kbd {
  font-family: var(--mono); font-size: 10px; padding: 0 4px;
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 3px; background: var(--raised); color: var(--ink-mid);
}

/* --------------------------------------------------------- finding groups ---
   The tallies at the top counted three things and the list below was one run
   of twelve, so nothing on screen said which finding was which. */
.ro-group {
  position: sticky; top: 0; z-index: 1;
  margin: 0; padding: 9px 14px 7px;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  background: rgba(10, 12, 16, .97); border-bottom: 1px solid var(--line);
  color: var(--ink-dim);
}
.ro-group span {
  margin-left: 6px; font-size: 9px; padding: 0 5px; border-radius: 7px;
  background: var(--raised); border: 1px solid var(--line);
}
.ro-group.good { color: var(--mint); }
.ro-group.bad { color: var(--crit); }
.ro-group.warn { color: var(--warn); }
.ro-note { margin: 8px 14px 2px; font-size: 11px; color: #5d666e; max-width: 56ch; }
.ro-matched {
  margin: 8px 14px -2px; font-family: var(--mono); font-size: 10px;
  color: var(--mint); letter-spacing: .04em;
}
.ro-missed {
  margin: 0; padding: 8px 14px; font-size: 12.5px; color: #b6bfc5;
  border-bottom: 1px solid var(--line-soft);
}
/* Severity as a word. It was a coloured stripe down the left of every finding
   with nothing anywhere saying what the colours meant. */
.ro-sev {
  display: block; margin-bottom: 4px; font-family: var(--mono); font-size: 9px;
  letter-spacing: .1em; text-transform: uppercase; color: #5d666e;
}
.ro-item.on .ro-sev { color: var(--mint); }

/* ------------------------------------------------------------- graph rail ---
   The review used to be a list of steps, which showed what happened without
   showing that anything moved. Five nodes, two of which ask a model. */
.gr-rail { list-style: none; margin: 0 0 14px; padding: 0; }
.ro-graph-done { padding: 12px 14px 2px; border-top: 1px solid var(--line-soft); }
.ro-graph-done h4 {
  margin: 0 0 8px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: #5d666e;
}
.gr-node {
  position: relative; display: flex; align-items: baseline; gap: 9px;
  padding: 3px 0;
}
.gr-edge {
  position: absolute; left: 6px; top: -4px; height: 8px; width: 1px;
  background: var(--line);
}
.gr-dot {
  grid-column: 1; width: 9px; height: 9px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--ground); justify-self: center;
}
.gr-name {
  font-family: var(--mono); font-size: 12px; color: #79828b; flex: none;
}
.gr-count {
  flex: 1; min-width: 0; font-size: 11px; color: #5d666e;
  font-variant-numeric: tabular-nums; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.gr-kind {
  flex: none; font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--mint);
}
.gr-node.done .gr-dot { background: var(--ink-dim); border-color: var(--ink-dim); }
.gr-node.done .gr-name { color: #b6bfc5; }
.gr-node.on .gr-dot { background: var(--mint); border-color: var(--mint); }
.gr-node.on .gr-name { color: #e6eae7; }
.gr-node.on .gr-count { color: var(--mint); }
@media (prefers-reduced-motion: no-preference) {
  .gr-node.on .gr-dot { animation: gr-pulse 1.1s ease-in-out infinite; }
}
@keyframes gr-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(79, 211, 154, .45); }
  50% { box-shadow: 0 0 0 4px rgba(79, 211, 154, 0); }
}

/* ------------------------------------------------------- documentation view --
   The board used to carry a mark per part. It was a second object over the
   copper that could only say yes or no about one part at a time, and the real
   question is what the whole board still needs. */
.tab-docs[data-state="none"] { opacity: .55; }
.tab-docs[data-state="missing"]::after {
  content: attr(data-count); margin-left: 6px; font-size: 9px;
  padding: 0 5px; border-radius: 8px; vertical-align: 1px;
  background: var(--warn); color: #1d1403;
}
.tab-docs[data-state="done"]::after {
  content: "✓"; margin-left: 6px; font-size: 9px; color: var(--mint);
}
#docs-overlay {
  position: absolute; right: 12px; top: 12px; bottom: 12px;
  width: clamp(340px, 34vw, 560px); max-width: calc(100% - 24px);
  display: flex; flex-direction: column; overflow: hidden;
  background: rgba(10, 12, 16, .93); border: 1px solid var(--line);
  border-radius: 5px; backdrop-filter: blur(3px);
}
.dv-row {
  padding: 11px 14px; border-bottom: 1px solid var(--line-soft);
  border-left: 2px solid transparent;
}
.dv-row.missing { border-left-color: var(--warn); }
.dv-row.have { border-left-color: var(--mint); }
.dv-head { display: flex; align-items: baseline; gap: 10px; }
.dv-head b { font-family: var(--mono); font-size: 13px; color: #e6eae7; }
.dv-value { font-family: var(--mono); font-size: 11px; color: var(--mint); flex: 1; }
.dv-head .btn { flex: none; }
.dv-why { margin: 5px 0 0; font-size: 11.5px; color: #79828b; max-width: 60ch; }
.dv-facts { list-style: none; margin: 8px 0 0; padding: 0; }
.dv-facts li {
  display: flex; align-items: baseline; gap: 8px; padding: 2px 0; font-size: 11.5px;
}
.dv-facts li span { color: #79828b; flex: 1; }
.dv-facts li b {
  font-family: var(--mono); color: #b6bfc5; font-variant-numeric: tabular-nums;
}
.dv-facts li em {
  font-style: normal; font-family: var(--mono); font-size: 9.5px; color: #5d666e;
}
.dv-facts li { cursor: help; }
.dv-none { margin: 8px 0 0; font-size: 11.5px; color: #5d666e; max-width: 58ch; }

/* ---------------------------------------------------------------- dialog ---
   Attaching a document means reading what came back out of it, and the rail is
   300px of a column that already holds four panels. */
.modal-back {
  position: fixed; inset: 0; z-index: 40; display: flex;
  align-items: center; justify-content: center; padding: 24px;
  background: rgba(4, 6, 9, .72);
}
.modal {
  width: min(680px, 100%); max-height: min(760px, 100%);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
}
.modal-head {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.modal-head h3 {
  margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
}
.modal-head h3 em { font-style: normal; color: var(--mint); margin-left: 8px; }
.icon {
  margin-left: auto; width: 26px; height: 26px; line-height: 1; font-size: 18px;
  cursor: pointer; color: var(--ink-dim); background: none;
  border: 1px solid transparent; border-radius: var(--radius);
}
.icon:hover { color: var(--ink); border-color: var(--line); }
.modal-body { padding: 16px 18px 18px; overflow-y: auto; }
.modal-body h4 {
  margin: 20px 0 8px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
}
.modal-body h4:first-child { margin-top: 0; }
.dm-why { margin: 0 0 4px; font-size: 12px; color: var(--ink-mid); }
.dm-note { margin: 0 0 10px; font-size: 11.5px; color: var(--ink-dim); max-width: 62ch; }
.dm-or { margin: 12px 0 6px; font-size: 11px; color: var(--ink-dim); }

.dm-drop {
  display: flex; flex-direction: column; gap: 4px; cursor: pointer;
  padding: 22px 18px; text-align: center; border-radius: var(--radius);
  border: 1px dashed var(--line); background: var(--raised);
}
.dm-drop.over { border-color: var(--mint); background: rgba(79, 211, 154, .07); }
.dm-drop b { font-size: 12.5px; font-weight: 500; }
.dm-drop span { font-size: 11.5px; color: var(--ink-dim); }
.dm-drop input { display: none; }

.dm-file {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: var(--radius); background: var(--raised);
  border-left: 2px solid var(--mint);
}
.dm-name { font-size: 12.5px; }
.dm-meta {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-dim); font-variant-numeric: tabular-nums;
}

.dm-facts { list-style: none; margin: 14px 0 0; padding: 0; }
.dm-facts li {
  display: grid; grid-template-columns: 1fr auto; gap: 1px 10px;
  padding: 8px 0; border-top: 1px solid var(--line-soft);
}
.dm-label { font-size: 12px; color: var(--ink-mid); }
.dm-value {
  grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: 12px;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.dm-page {
  grid-column: 2; font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-dim); text-align: right;
}
.dm-quote {
  grid-column: 1 / -1; font-size: 11px; color: var(--ink-dim);
  line-height: 1.5; margin-top: 3px;
}
.dm-facts li.unsure .dm-value { color: var(--warn); }
.dm-none { margin: 14px 0 0; font-size: 12px; color: var(--ink-dim); }

.dm-hit {
  display: block; margin: 0 0 8px; padding: 9px 11px;
  border-radius: var(--radius); background: var(--raised);
  border-left: 2px solid var(--line);
}
.dm-cite {
  display: block; font-family: var(--mono); font-size: 10px;
  letter-spacing: .06em; color: var(--mint); margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.dm-text { display: block; font-size: 12px; color: var(--ink-mid); line-height: 1.55; }

.modal-body textarea {
  width: 100%; resize: vertical; font-family: var(--mono); font-size: 11.5px;
  padding: 8px 10px; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.btn.primary-ghost { color: var(--mint); border-color: rgba(79, 211, 154, .4); }

/* ------------------------------------------------------- datasheet badges ---
   Only on parts a review would research. A tick over every resistor would be
   forty ticks saying nothing. */

/* ------------------------------------------------------ datasheet, inspector */
.ds-panel { margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius);
  background: var(--raised); border-left: 2px solid var(--line); }
.ds-panel.have { border-left-color: var(--mint); }
.ds-panel.missing { border-left-color: var(--warn); }
.ds-panel h4 { margin: 0 0 4px; font-family: var(--mono); font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.ds-why { margin: 0 0 8px; font-size: 11.5px; color: var(--ink-dim); }
.ds-field { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.ds-field span { font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-dim); width: 92px; flex: none; }
.ds-field input { flex: 1; }

/* ------------------------------------------------------------------ rail --- */
.rail {
  width: clamp(424px, 28vw, 510px); flex: none; overflow-y: auto;
  background: var(--panel);
  border-left: 1px solid var(--line);
}
.panel { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
.panel > h3 {
  margin: 0 0 10px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
  display: flex; justify-content: space-between; align-items: baseline;
}
.panel > h3 span { color: var(--mint); letter-spacing: .06em; }
.lede { margin: 0; color: var(--ink-mid); max-width: 60ch; }
.lede b { color: var(--ink); font-weight: 500; }
.lede-link { color: var(--mint); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.muted { color: var(--ink-dim); margin: 0; }
.hint { color: var(--ink-dim); font-size: 12px; margin: 10px 0 0; }
.eyebrow {
  margin: 12px 0 5px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
}

.btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  padding: 6px 11px; cursor: pointer; border-radius: var(--radius);
  background: var(--raised); color: var(--ink); border: 1px solid var(--line);
}
.btn:hover:not(:disabled) { border-color: var(--ink-dim); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger:hover:not(:disabled) { border-color: var(--crit); color: var(--crit); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.primary {
  width: 100%; font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  padding: 9px; cursor: pointer; border-radius: var(--radius);
  background: var(--mint); color: var(--mint-ink); border: 1px solid var(--mint);
  font-weight: 600;
}
.primary:disabled { opacity: .45; cursor: default; }

/* --------------------------------------------------------- inspector bits --- */
.ins-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.ins-head .ref {
  font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--ink);
}
.ins-head .val { font-family: var(--mono); font-size: 12px; color: var(--mint); }
.desc { margin: 0 0 10px; color: var(--ink-mid); font-size: 12px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 12px; }
.facts dt {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim); align-self: center;
}
.facts dd {
  margin: 0; font-family: var(--mono); font-size: 11.5px;
  font-variant-numeric: tabular-nums; color: var(--ink);
}

.field { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.field span {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim); width: 78px; flex: none;
}
input, select {
  font-family: var(--mono); font-size: 11.5px; padding: 5px 7px; width: 100%;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
}

/* One line per pin, in a rail wide enough for one. Three table columns in a
   374px rail gave the net 180px, so every name past "unconnected-(U2-P" was
   cut - and the clipped half is the half that tells one from another. The
   answer was a wider rail, not a second line. */
.pins { list-style: none; margin: 0; padding: 0; }
.pins li {
  display: flex; align-items: center; gap: 7px;
  padding: 3px 0; border-bottom: 1px solid var(--line-soft);
}
.pins li:last-child { border-bottom: 0; }
.pins li > b {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--ink-mid); min-width: 18px; text-align: right; flex: none;
}
.pins .net-pick { flex: 1; min-width: 0; }

.swap {
  font-family: var(--mono); font-size: 12px; line-height: 1; cursor: pointer;
  padding: 4px 6px; margin-left: 4px; border-radius: var(--radius);
  background: var(--raised); color: var(--ink-dim); border: 1px solid var(--line);
}
.swap:hover { color: var(--ink); }
.swap.armed { color: var(--mint-ink); background: var(--mint); border-color: var(--mint); }
.armed-hint { color: var(--mint); }

.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.loaded { margin: 0 0 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-mid); }
.loaded b { color: var(--mint); display: block; font-size: 12.5px; margin-bottom: 2px; }
.load-error {
  margin: 0 0 6px; padding: 8px 10px; border-radius: var(--radius);
  background: var(--raised); border-left: 2px solid var(--crit);
  color: var(--ink-mid); font-size: 12.5px;
}
#stage.loading { opacity: .5; }
#stage.dropping::after {
  content: "Drop the KiCad project"; position: absolute; inset: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
  color: var(--mint); border: 2px dashed var(--mint); border-radius: 6px;
  background: rgba(8, 9, 12, .72); pointer-events: none;
}

.preset {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 8px 10px; margin-bottom: 4px; border-radius: var(--radius);
  background: var(--raised); border: 1px solid var(--line-soft); color: inherit;
}
.preset:hover { border-color: var(--line); }
.preset.on { border-color: var(--mint); }
.preset-title {
  display: block; font-family: var(--mono); font-size: 11.5px; color: var(--ink);
}
.preset-why {
  display: block; margin-top: 3px; font-size: 11.5px; color: var(--ink-dim);
  line-height: 1.45;
}

.divergence-note {
  margin: 0 0 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
  color: var(--ink-mid); background: var(--raised);
  border-left: 2px solid var(--warn); border-radius: var(--radius);
}
.divergence-note b { color: var(--warn); font-family: var(--mono); }

#log { list-style: none; margin: 0; padding: 0; }
#log li {
  font-family: var(--mono); font-size: 11px; color: var(--ink-mid);
  padding: 3px 0 3px 10px; border-left: 2px solid var(--line);
}
#log li.muted { border-left-color: transparent; padding-left: 0; }

/* ---------------------------------------------------------------- review --- */
#review-stream {
  margin: 10px 0 0; padding: 8px; max-height: 120px; overflow: hidden;
  font-family: var(--mono); font-size: 10px; line-height: 1.4; color: var(--ink-dim);
  background: var(--raised); border-radius: var(--radius); white-space: pre-wrap;
  word-break: break-word;
}
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; }
.score-cell {
  padding: 8px 10px; border-radius: var(--radius); background: var(--raised);
  border: 1px solid var(--line-soft);
}
.score-cell b {
  display: block; font-family: var(--mono); font-size: 20px; font-weight: 600;
  line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink-dim);
}
.score-cell span {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim);
}
.score-cell.good { border-color: var(--mint); }
.score-cell.good b { color: var(--mint); }
.score-cell.bad { border-color: var(--crit); }
.score-cell.bad b { color: var(--crit); }
.score-cell.warn { border-color: var(--warn); }
.score-cell.warn b { color: var(--warn); }
.cached { margin: 6px 0 0; font-size: 11.5px; color: var(--ink-dim); }

.review-error {
  margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius);
  background: var(--raised); border-left: 2px solid var(--crit);
}
.review-error-code {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--crit);
}
.review-error p { margin: 4px 0 0; color: var(--ink-mid); font-size: 12.5px; }

.findings { list-style: none; margin: 0; padding: 0; }
.findings li {
  padding: 7px 0 7px 10px; border-left: 2px solid var(--line);
  border-bottom: 1px solid var(--line-soft);
}
.findings li:last-child { border-bottom: none; }
.findings li.sev-critical { border-left-color: var(--crit); }
.findings li.sev-major { border-left-color: var(--warn); }
.findings li.missed { border-left-color: var(--crit); }
.finding {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; padding: 0; color: inherit; font: inherit;
}
.finding:hover .bullet:first-child { color: var(--mint); }
.findings li.focused { background: var(--raised); }
.findings li.focused .bullet:first-child { color: var(--mint); }
.findings .bullet {
  display: block; font-size: 12.5px; color: var(--ink-mid); margin-bottom: 3px;
  padding-left: 58px; text-indent: -58px;
}
.findings .bullet:first-child { color: var(--ink); }
.findings .bullet em {
  display: inline-block; width: 54px; margin-right: 4px; text-indent: 0;
  font-family: var(--mono); font-size: 9px; font-style: normal;

  vertical-align: 1px;
}
.findings .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.findings code {

}
#budget {
  margin: 10px 0 0; font-family: var(--mono); font-size: 10px;

@media (max-width: 900px) {
  .app { height: auto; }
  main { flex-direction: column; }
  .viewport { height: 62vh; min-height: 340px; }

  header { flex-wrap: wrap; gap: 10px 14px; }
  .stats { margin-left: 0; width: 100%; }
}
</style>

<script type="module">
// ===== site/copper.js =================================================

// Copper connectivity in the browser. The mirror of the geometry half of
// harness/checks.py.
//
// This exists because the page has to describe the board as it is *now* — after
// whatever the visitor deleted — and only the browser holds that state. The
// island count is the one number that makes the ground defect legible: the
// netlist says GND is one net either way, and only the copper disagrees.
//
// Cost is a pair-wise walk per net, which is about 15,000 distance tests for
// this board and runs in a few milliseconds. Nets are small; GND is the only
// large one.

const TOL = 0.02; // mm; KiCad quantises to a nanometre, so this is generous

/** KiCad's RotatePoint. The same transform as extract/layout.py `place()`. */
function place(x, y, deg) {
  if (!deg) return [x, y];
  const a = (deg * Math.PI) / 180;
  const ca = Math.cos(a);
  const sa = Math.sin(a);
  return [x * ca + y * sa, y * ca - x * sa];
}

function padLayers(pad) {
  const out = new Set();
  for (const layer of pad.layers || []) {
    if (layer === "*.Cu" || layer === "*") {
      out.add("F.Cu");
      out.add("B.Cu");
    } else if (layer.endsWith(".Cu")) {
      out.add(layer);
    }
  }
  return out;
}

function copperItems(board) {
  const items = [];
  for (const fp of board.layout.footprints) {
    for (const pad of fp.pads) {
      const layers = padLayers(pad);
      if (!layers.size || !pad.net) continue;
      const [dx, dy] = place(pad.x, pad.y, fp.rot);
      items.push({
        kind: "pad",
        id: `${fp.ref}.${pad.num}`,
        net: pad.net,
        layers,
        x: fp.x + dx,
        y: fp.y + dy,
        r: Math.max(pad.w, pad.h) / 2,
      });
    }
  }
  for (const track of board.layout.tracks) {
    if (!track.layer.endsWith(".Cu")) continue;
    items.push({
      kind: "track",
      id: track.id,
      net: track.net,
      layers: new Set([track.layer]),
      seg: [track.x1, track.y1, track.x2, track.y2],
      r: track.width / 2,
    });
  }
  for (const via of board.layout.vias) {
    const layers = new Set((via.layers || []).filter((l) => l.endsWith(".Cu")));
    items.push({
      kind: "via",
      id: via.id,
      net: via.net,
      layers: layers.size ? layers : new Set(["F.Cu", "B.Cu"]),
      x: via.x,
      y: via.y,
      r: via.size / 2,
    });
  }
  for (const zone of board.layout.zones) {
    if (zone.disabled) continue;
    zone.filled.forEach((fill, i) => {
      if (!fill.layer.endsWith(".Cu") || fill.pts.length < 3) return;
      const xs = fill.pts.map((p) => p[0]);
      const ys = fill.pts.map((p) => p[1]);
      items.push({
        kind: "zone",
        id: `${zone.id}.${i}`,
        net: zone.net,
        layers: new Set([fill.layer]),
        poly: fill.pts,
        bbox: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)],
      });
    });
  }
  return items;
}

function pointToSegment(px, py, seg) {
  const [x1, y1, x2, y2] = seg;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const length2 = dx * dx + dy * dy;
  if (length2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / length2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function segmentsClose(a, b, gap) {
  return (
    Math.min(
      pointToSegment(a[0], a[1], b),
      pointToSegment(a[2], a[3], b),
      pointToSegment(b[0], b[1], a),
      pointToSegment(b[2], b[3], a)
    ) <= gap
  );
}

function inPolygon(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i];
    const [xj, yj] = poly[j];
    if (yi > py !== yj > py && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

function touchesZone(item, zone) {
  const [bx0, by0, bx1, by1] = zone.bbox;
  const points =
    item.kind === "track"
      ? [
          [item.seg[0], item.seg[1]],
          [item.seg[2], item.seg[3]],
          [(item.seg[0] + item.seg[2]) / 2, (item.seg[1] + item.seg[3]) / 2],
        ]
      : [[item.x, item.y]];
  const pad = (item.r || 0) + TOL;
  for (const [px, py] of points) {
    if (px < bx0 - pad || px > bx1 + pad || py < by0 - pad || py > by1 + pad) continue;
    if (inPolygon(px, py, zone.poly)) return true;
    // A pad just outside the fill still connects through its thermal spoke;
    // the fill itself is drawn back by the clearance.
    for (let i = 0; i < zone.poly.length; i++) {
      const a = zone.poly[i === 0 ? zone.poly.length - 1 : i - 1];
      const b = zone.poly[i];
      if (pointToSegment(px, py, [a[0], a[1], b[0], b[1]]) <= pad) return true;
    }
  }
  return false;
}

function shareLayer(a, b) {
  for (const layer of a) if (b.has(layer)) return true;
  return false;
}

function connected(a, b) {
  if (!shareLayer(a.layers, b.layers)) return false;
  if (a.kind === "zone" || b.kind === "zone") {
    const zone = a.kind === "zone" ? a : b;
    const other = a.kind === "zone" ? b : a;
    if (other.kind === "zone") return false; // two fills of one pour are one pour
    return touchesZone(other, zone);
  }
  const gap = (a.r || 0) + (b.r || 0) + TOL;
  if (a.kind === "track" && b.kind === "track") return segmentsClose(a.seg, b.seg, gap);
  if (a.kind === "track") return pointToSegment(b.x, b.y, a.seg) <= gap;
  if (b.kind === "track") return pointToSegment(a.x, a.y, b.seg) <= gap;
  return Math.hypot(a.x - b.x, a.y - b.y) <= gap;
}

/** Copper connectivity per net, as a map of net name to a list of groups. */
function islands(board) {
  const byNet = new Map();
  for (const item of copperItems(board)) {
    if (!item.net) continue;
    if (!byNet.has(item.net)) byNet.set(item.net, []);
    byNet.get(item.net).push(item);
  }

  const out = new Map();
  for (const [net, items] of byNet) {
    const parent = items.map((_, i) => i);
    const find = (i) => {
      while (parent[i] !== i) {
        parent[i] = parent[parent[i]];
        i = parent[i];
      }
      return i;
    };
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        if (find(i) !== find(j) && connected(items[i], items[j])) parent[find(i)] = find(j);
      }
    }
    const groups = new Map();
    items.forEach((item, i) => {
      const root = find(i);
      if (!groups.has(root)) groups.set(root, []);
      groups.get(root).push(item);
    });
    out.set(net, [...groups.values()]);
  }
  return out;
}

/** How many separate pieces of copper a net's pads sit on. One is healthy. */
function islandCounts(board) {
  const counts = new Map();
  for (const [net, groups] of islands(board)) {
    counts.set(net, groups.filter((g) => g.some((i) => i.kind === "pad")).length);
  }
  return counts;
}

// ===== site/checks.js =================================================

// The deterministic rules, in the browser. The mirror of harness/checks.py.
//
// Seven rules and one contract that matters more than any of them: every seeded
// defect trips its own rule, and the board as manufactured trips none. A
// detector that fires on a clean board is worth nothing.
//
// These run before any model is asked anything, and again afterwards to refute
// what a model said. That is the whole shape of the review: the model proposes,
// the measurements dispose, and the referee is the board.
//
// tests/checks_parity.mjs holds this to the Python, rule for rule, on the clean
// board and on all seven seeded ones.


const GROUND = /^\/?((A|D|P|E|SG|PG|GND)?GND[A-Z0-9_]*|GND|VSS[A-Z0-9_]*)$/i;
const RAIL = /^\/?(VBUS|VCC|VDD|VEE|VIN|VOUT|[+-]?\d+V\d*|[+-]\d+(\.\d+)?V)[A-Z0-9]*$/i;
const DRIVERS = new Set(["output", "power_out", "open_collector", "tri_state"]);
const SERVO_NET = /SERVO|\bPWM\b|ESC/i;
const DRIVER_PART = /darlington|transistor array|\bdriver\b|h-?bridge|mosfet|\bgate\b|relay/i;
const PASSIVE_PREFIX = /^[RCL]/;

const isGround = (name) => GROUND.test(name || "");
const isRail = (name) => RAIL.test(name || "") || isGround(name);
const baseType = (t) => String(t || "").split("+")[0];

function finding(rule, title, why, { refs = [], nets = [], severity = "major", fix = "" } = {}) {
  return {
    rule,
    severity,
    refs: [...new Set(refs)].sort(),
    nets: [...new Set(nets)].sort(),
    title,
    why,
    fix,
  };
}

/** ref -> [{net, node}], every pin of every part. */
function pinsByRef(board) {
  const out = new Map();
  for (const net of board.nets) {
    for (const node of net.nodes) {
      if (!out.has(node.ref)) out.set(node.ref, []);
      out.get(node.ref).push({ net: net.name, node });
    }
  }
  return out;
}

// ----------------------------------------------------------------- schematic

/** A pin whose datasheet name is also a net name must be on that net. */
function powerPinMiswired(board) {
  const names = new Map(board.nets.map((n) => [n.name.replace(/^\//, "").toUpperCase(), n.name]));
  const out = [];
  for (const net of board.nets) {
    for (const node of net.nodes) {
      const fn = node.function || "";
      if (!fn) continue;
      const declared = fn.replace(new RegExp(`_${node.pin}$`), "").toUpperCase();
      if (declared.length < 2 || !names.has(declared)) continue;
      const expected = names.get(declared);
      if (expected === net.name) continue;
      // Splitting the return around a switcher is what you are supposed to do.
      if (isGround(expected) && isGround(net.name)) continue;
      out.push(
        finding(
          "power-pin-miswired",
          `${node.ref} pin ${node.pin} (${fn}) is on ${net.name}, not ${expected}`,
          `The part names this pin ${declared}, and the board has a net called ${expected}. ` +
            `Wiring it to ${net.name} means the pin is doing a different job than the symbol says.`,
          {
            refs: [node.ref],
            nets: [net.name, expected],
            severity: "critical",
            fix: `Move ${node.ref} pin ${node.pin} back to ${expected}.`,
          }
        )
      );
    }
  }
  return out;
}

/** A connector with three or more pins must carry a ground or a supply. */
function connectorNoReference(board) {
  const out = [];
  for (const [ref, pins] of pinsByRef(board)) {
    if (!ref.startsWith("J") || pins.length < 3) continue;
    const names = pins.map((p) => p.net);
    if (names.some(isRail)) continue;
    if (names.every((n) => n.startsWith("unconnected-"))) continue;
    out.push(
      finding(
        "connector-no-reference",
        `${ref} has ${pins.length} pins and no ground or supply among them`,
        "Every pin on this header is a signal, so whatever plugs in has no return " +
          "path and no rail.",
        {
          refs: [ref],
          nets: names,
          severity: "critical",
          fix: `Give ${ref} a ground pin, a supply pin, or both.`,
        }
      )
    );
  }
  return out;
}

/** On a three-pin servo header the supply belongs on the middle pin. */
function connectorPowerOrder(board) {
  const out = [];
  for (const [ref, pins] of pinsByRef(board)) {
    if (!ref.startsWith("J") || pins.length !== 3) continue;
    const byPin = new Map(pins.map((p) => [p.node.pin, p.net]));
    if (["1", "2", "3"].some((k) => !byPin.has(k)) || byPin.size !== 3) continue;
    const supplies = [...byPin].filter(([, n]) => isRail(n) && !isGround(n)).map(([p]) => p);
    const grounds = [...byPin].filter(([, n]) => isGround(n)).map(([p]) => p);
    const signals = [...byPin].filter(([, n]) => !isRail(n)).map(([p]) => p);
    if (supplies.length !== 1 || grounds.length !== 1 || signals.length !== 1) continue;
    // Only a servo lead has this convention; a three-pin sensor header is
    // supply, output, ground and correct that way.
    if (!SERVO_NET.test(byPin.get(signals[0]))) continue;
    if (supplies[0] === "2") continue;
    out.push(
      finding(
        "connector-power-order",
        `${ref}: ${byPin.get(supplies[0])} is on end pin ${supplies[0]}, not the middle pin`,
        "A three-wire servo lead is signal, power, ground in that order and the " +
          "header is not keyed, so a lead plugged in the normal way puts the supply " +
          "on the servo's ground.",
        {
          refs: [ref],
          nets: [...byPin.values()],
          severity: "critical",
          fix: `Swap ${ref} pins ${supplies[0]} and 2, so the supply is in the middle.`,
        }
      )
    );
  }
  return out;
}

/** A four-pin sensor header is supply, signal, signal, ground, in that order. */
function sensorPinoutOrder(board) {
  const out = [];
  for (const [ref, pins] of pinsByRef(board)) {
    if (!ref.startsWith("J") || pins.length !== 4) continue;
    const byPin = new Map(pins.map((p) => [p.node.pin, p.net]));
    if (["1", "2", "3", "4"].some((k) => !byPin.has(k)) || byPin.size !== 4) continue;
    const supplies = [...byPin].filter(([, n]) => isRail(n) && !isGround(n)).map(([p]) => p);
    const grounds = [...byPin].filter(([, n]) => isGround(n)).map(([p]) => p);
    const signals = [...byPin].filter(([, n]) => !isRail(n)).map(([p]) => p);
    if (supplies.length !== 1 || grounds.length !== 1 || signals.length !== 2) continue;

    const problems = [];
    if (supplies[0] !== "1") {
      problems.push(`the supply ${byPin.get(supplies[0])} is on pin ${supplies[0]}, not pin 1`);
    }
    if (grounds[0] !== "4") problems.push(`ground is on pin ${grounds[0]}, not pin 4`);
    const trig = signals.filter((p) => byPin.get(p).toUpperCase().includes("TRIG"));
    const echo = signals.filter((p) => byPin.get(p).toUpperCase().includes("ECHO"));
    if (trig.length === 1 && echo.length === 1 && Number(trig[0]) > Number(echo[0])) {
      problems.push(`trigger is on pin ${trig[0]} and echo on pin ${echo[0]}, the wrong way round`);
    }
    if (!problems.length) continue;
    out.push(
      finding(
        "sensor-pinout-order",
        `${ref} does not match a four-wire sensor pinout: ${problems.join("; ")}`,
        "A four-wire module's cable is supply, signal, signal, ground, and the " +
          "header is not keyed, so this connects the wrong wire to the wrong pin.",
        {
          refs: [ref],
          nets: [...byPin.values()],
          severity: "critical",
          fix: `Rewire ${ref} as supply, signal, signal, ground on pins 1 to 4.`,
        }
      )
    );
  }
  return out;
}

/** Does this passive pin's part have another pin sitting on a rail? */
function reachesRail(board, node, fromNet) {
  if (!/^(R|L|FB)/.test(node.ref)) return false;
  for (const other of board.nets) {
    if (other.name === fromNet) continue;
    if (other.nodes.some((n) => n.ref === node.ref) && isRail(other.name)) return true;
  }
  return false;
}

/** A power driver's input needs something holding it while the MCU resets. */
function floatingDriverInput(board) {
  const drivers = new Set(
    board.components
      .filter((c) => DRIVER_PART.test(`${c.description || ""} ${c.value || ""}`))
      .map((c) => c.ref)
  );
  const out = [];
  for (const net of board.nets) {
    if (isRail(net.name) || net.name.startsWith("unconnected-")) continue;
    const inputs = net.nodes.filter((n) => baseType(n.type) === "input" && drivers.has(n.ref));
    if (!inputs.length) continue;
    if (net.nodes.some((n) => DRIVERS.has(baseType(n.type)))) continue;
    // A capacitor is not a pull: what defines a level is a part whose other end
    // lands on a rail.
    if (net.nodes.some((n) => baseType(n.type) === "passive" && reachesRail(board, n, net.name))) {
      continue;
    }
    out.push(
      finding(
        "floating-driver-input",
        `${net.name} drives ${inputs[0].ref} with nothing holding it at reset`,
        "The only other pin on this net is a port that sits high impedance until " +
          "firmware configures it, so the driver input floats from power-up and what " +
          "it drives can energise.",
        {
          refs: net.nodes.map((n) => n.ref),
          nets: [net.name],
          fix: `Add a pull resistor from ${net.name} to a rail.`,
        }
      )
    );
  }
  return out;
}

/** A resistor, capacitor or inductor needs a magnitude to be orderable. */
function unbuildableValue(board) {
  const out = [];
  for (const comp of board.components) {
    if (!PASSIVE_PREFIX.test(comp.ref)) continue;
    const value = (comp.value || "").trim();
    if (/\d/.test(value)) continue;
    out.push(
      finding(
        "value-not-orderable",
        `${comp.ref} has value ${JSON.stringify(value)}, which is not a quantity`,
        "There is no magnitude here, so the line cannot be ordered and nobody " +
          "assembling the board knows what to fit.",
        { refs: [comp.ref], fix: `Give ${comp.ref} a value that can be ordered.` }
      )
    );
  }
  return out;
}

// -------------------------------------------------------------------- copper

/** A net's pads must all reach each other through copper. */
function netIsland(board) {
  const out = [];
  for (const [net, groups] of islands(board)) {
    const withPads = groups.filter((g) => g.some((i) => i.kind === "pad"));
    if (withPads.length < 2) continue;
    const size = (g) => g.filter((i) => i.kind === "pad").length;
    const main = withPads.reduce((a, b) => (size(b) > size(a) ? b : a));
    const rest = withPads.filter((g) => g !== main);
    const stranded = rest.reduce((n, g) => n + size(g), 0);
    const refs = new Set();
    for (const group of rest) {
      for (const item of group) if (item.kind === "pad") refs.add(item.id.split(".")[0]);
    }
    out.push(
      finding(
        "net-island",
        `${net} is not one piece of copper: ${withPads.length} separate islands, ${stranded} pads stranded`,
        "The net list says these pads are one net and the copper says otherwise. " +
          "Nothing in ERC or DRC reads the copper, so both pass a board that cannot work.",
        {
          refs: [...refs],
          nets: [net],
          severity: "critical",
          fix: `Stitch the ${net} islands together: vias between the layers where the pads are, and a pour on both.`,
        }
      )
    );
  }
  return out;
}

/**
 * A supply pin must not share a net with an MCU port.
 *
 * `powerPinMiswired` only fires when the designer named a net after the pin, so
 * it is blind whenever they did not: this board's buck takes its input on a pin
 * the library calls `VIN_3`, and the net is called `/IN`. Move that pin onto a
 * servo signal and every rule stayed silent, the gate saw nothing to chase, and
 * the review stopped after one pass.
 *
 * Electrical type is the signal it uses instead, and the netlist always carries
 * it: a `power_in` pin sharing copper with a `bidirectional` MCU port is not a
 * choice anyone makes. Quiet on the board as manufactured, where none of the
 * six nets carrying a supply pin also carries a GPIO.
 */
function powerPinOnSignalNet(board) {
  const out = [];
  for (const net of board.nets) {
    const supplies = net.nodes.filter((n) => baseType(n.type) === "power_in");
    const ports = net.nodes.filter((n) => baseType(n.type) === "bidirectional");
    if (!supplies.length || !ports.length) continue;
    const supply = supplies[0];
    const port = ports[0];
    out.push(
      finding(
        "power-pin-on-signal-net",
        `${supply.ref} pin ${supply.pin} is a supply pin sharing ${net.name} ` +
          `with the MCU port ${port.ref}.${port.pin}`,
        `${net.name} carries both a power input and a general-purpose pin. ` +
          "Either the port is being asked to source a rail, or the rail is " +
          "backfeeding the port through its protection diode. Neither part " +
          "survives that for long.",
        {
          refs: [...new Set([supply.ref, port.ref])].sort(),
          nets: [net.name],
          severity: "critical",
          fix:
            `Return ${supply.ref} pin ${supply.pin} to its supply net and leave ` +
            `${net.name} to the signal.`,
        }
      )
    );
  }
  return out;
}

const RULES = [
  powerPinMiswired,
  connectorNoReference,
  connectorPowerOrder,
  sensorPinoutOrder,
  floatingDriverInput,
  powerPinOnSignalNet,
  unbuildableValue,
  netIsland,
];

function runChecks(board) {
  // The schematic rules, then the fab limits. The page ran only the first group
  // for a long time, so narrowing a track past what a process can etch produced
  // no finding here while the harness measured one.
  return RULES.flatMap((rule) => rule(board)).concat(runDfm(board));
}

// ------------------------------------------------------- refuting a claim

const SPLIT_CLAIM =
  /\b(strand|island|isolat|not connected|unconnected|disconnect|floating copper|no return|open circuit|separate piece)/i;
const NO_VALUE_CLAIM = /\b(no value|missing value|unspecified value|value is missing)/i;

/** The measurements a finding can be checked against. */
function boardFacts(board) {
  const counts = new Map();
  const pads = new Map();
  for (const [net, groups] of islands(board)) {
    const key = net.replace(/^\//, "").toUpperCase();
    counts.set(key, groups.filter((g) => g.some((i) => i.kind === "pad")).length);
    pads.set(key, groups.reduce((n, g) => n + g.filter((i) => i.kind === "pad").length, 0));
  }
  // Which nets something holds at a level, for the floating check. Held-ness
  // belongs to the net, not the part.
  const held = new Set();
  for (const net of board.nets) {
    const key = net.name.replace(/^\//, "").toUpperCase();
    if (isRail(net.name) || isGround(net.name)) {
      held.add(key);
      continue;
    }
    if (net.nodes.some((n) => reachesRail(board, n, net.name))) held.add(key);
  }

  return {
    refs: new Set(board.components.map((c) => c.ref.toUpperCase())),
    nets: new Set(board.nets.map((n) => n.name.replace(/^\//, "").toUpperCase())),
    islands: counts,
    pads,
    values: new Map(board.components.map((c) => [c.ref.toUpperCase(), c.value || ""])),
    held,
  };
}

/**
 * Why the board says this finding is wrong, or "" if it does not.
 *
 * Identity is judged on the whole finding: a reviewer that names S1 correctly
 * and gets a net name slightly wrong has still found something. Only a finding
 * where nothing it names exists is talking about a different board.
 */
function contradiction(item, facts) {
  const named = [...(item.refs || []), ...(item.nets || [])];
  if (named.length) {
    const known = [
      ...(item.refs || []).filter((r) => facts.refs.has(r.toUpperCase())),
      ...(item.nets || []).filter((n) => facts.nets.has(n.replace(/^\//, "").toUpperCase())),
    ];
    if (!known.length) return `nothing it names is on this board: ${named.join(", ")}`;
  }

  const text = `${item.title || ""} ${item.why || ""}`;
  if (SPLIT_CLAIM.test(text)) {
    for (const net of item.nets || []) {
      const key = net.replace(/^\//, "").toUpperCase();
      if (facts.islands.get(key) === 1 && (facts.pads.get(key) || 0) >= 2) {
        return `${net} is one connected piece of copper across all ${facts.pads.get(key)} of its pads`;
      }
    }
  }
  if (NO_VALUE_CLAIM.test(text)) {
    for (const ref of item.refs || []) {
      const value = facts.values.get(ref.toUpperCase()) || "";
      if (/\d/.test(value)) return `${ref} has the value ${value}`;
    }
  }
  return "";
}

/**
 * The critic: deterministic, and typed by the finding's own `claim`.
 *
 * The mirror of graph/verify.py. It is deliberately not the same function as
 * `contradiction` above — that one is the grader, frozen so the sweep compares
 * architectures on a ruler neither of them can move. This one does the work.
 *
 * Kinds nothing can settle from a netlist and copper are passed through rather
 * than guessed at: `pin_floating` needs to know what firmware configures a pin
 * as, and `trace_undersized` needs a current the extraction does not carry.
 */
const CHECKABLE = new Set([
  "net_split",
  "value_unbuildable",
  "missing_component",
  "decoupling_distance",
  // Held-ness is a property of the net, never of the part: a part is not
  // floating as a whole, only one of its pins is. Judging it on the part marks
  // every powered IC as held and deletes the real floating-input defect.
  "pin_floating",
]);

const squeeze = (s) => s.split(/\s+/).join(" ").toUpperCase();
const normNet = (s) => String(s ?? "").trim().toUpperCase().replace(/^\//, "");

function verify(item, facts, distilled) {
  const claim = String(item.claim || "").trim();
  const subject = String(item.subject || "").trim();

  // A subject that is not on this board: the finding is about a different one.
  if (subject) {
    const s = normNet(subject);
    if (!facts.refs.has(s) && !facts.nets.has(s)) {
      return `its subject ${subject} is not on this board`;
    }
  }

  // Evidence that is not in the board data. A reviewer that cannot copy a line
  // supporting its claim did not read one.
  const evidence = String(item.evidence || "").trim();
  if (evidence && evidence.length > 12 && !squeeze(distilled).includes(squeeze(evidence))) {
    return `its evidence is not a line in the board data: "${evidence.slice(0, 60)}"`;
  }

  if (CHECKABLE.has(claim)) {
    const s = normNet(subject);
    if (claim === "net_split") {
      for (const name of [s, ...(item.nets || []).map(normNet)]) {
        if (facts.islands.get(name) === 1 && (facts.pads.get(name) || 0) >= 2) {
          return `${name} is one connected piece of copper across all ${facts.pads.get(name)} of its pads`;
        }
      }
    } else if (claim === "value_unbuildable") {
      for (const ref of [s, ...(item.refs || []).map(normNet)]) {
        const value = facts.values.get(ref) || "";
        if (/\d/.test(value)) return `${ref} has the value ${value}, which can be ordered`;
      }
    } else if (claim === "missing_component") {
      if (facts.refs.has(s)) return `${s} is on this board`;
    } else if (claim === "pin_floating") {
      for (const name of [s, ...(item.nets || []).map(normNet)]) {
        if (facts.held.has(name)) {
          return `${name} is held at a level by a resistor or inductor to a rail`;
        }
      }
    }
  }

  // The frozen floor, so an untyped finding is still held to the old checks.
  return contradiction(item, facts);
}

// --------------------------------------------------- fab limits and current

/**
 * Manufacturability and ampacity, against fab limits. Mirrors harness/dfm.py.
 *
 * These were in the harness and not here, so the page ran eight deterministic
 * rules where a sweep ran eleven. Narrowing a track to 0.1 mm on the page
 * produced nothing at all, and the reviewer was left to notice it in prose.
 *
 * The parity test never caught the gap because it holds `harness/checks.py`
 * against this file, and these rules lived in `harness/dfm.py`, which had no
 * counterpart here to compare against. A file with no mirror cannot drift; it
 * can only be missing, which is quieter and worse.
 */
const MIN_ANNULAR_RING_MM = 0.13;
const MIN_PLATED_DRILL_MM = 0.3;
const MIN_TRACK_WIDTH_MM = 0.127;

/**
 * Holes with no plating: mounting holes, alignment pegs, tooling.
 *
 * The pad is the same size as the drill by design, because there is no copper
 * to ring it. The Python's first version flagged six of them - four mounting
 * holes and two switch pegs - which is the trap this constant exists to avoid.
 */
const UNPLATED = "np_thru_hole";

function dfmFinding(rule, title, why, fix, refs = [], nets = [], severity = "major") {
  return {
    rule,
    source: "dfm",
    severity,
    refs: [...refs],
    nets: [...nets],
    title,
    why,
    fix,
    claim: "manufacturability",
    subject: refs[0] || nets[0] || "",
    evidence: "",
  };
}

/** A plated hole needs copper left around it after the drill wanders. */
function annularRing(board) {
  const out = [];
  for (const fp of board.layout.footprints) {
    for (const pad of fp.pads) {
      const drill = pad.drill || 0;
      if (!drill || pad.kind === UNPLATED) continue;
      const ring = (Math.min(pad.w, pad.h) - drill) / 2;
      if (ring < MIN_ANNULAR_RING_MM) {
        out.push(
          dfmFinding(
            "dfm-annular-ring",
            `${fp.ref} pad ${pad.num} has a ${ring.toFixed(3)} mm annular ring`,
            `Below the ${MIN_ANNULAR_RING_MM} mm a low-cost two-layer process holds, so ` +
              "drill wander can break the pad away from its barrel.",
            `Grow the pad to at least ${(drill + 2 * MIN_ANNULAR_RING_MM).toFixed(2)} mm across.`,
            [fp.ref],
            pad.net ? [pad.net] : []
          )
        );
      }
    }
  }
  return out;
}

/** Plated holes below the fab's smallest drill. */
function drillSize(board) {
  const out = [];
  for (const fp of board.layout.footprints) {
    for (const pad of fp.pads) {
      const drill = pad.drill || 0;
      if (!drill || pad.kind === UNPLATED) continue;
      if (drill < MIN_PLATED_DRILL_MM) {
        out.push(
          dfmFinding(
            "dfm-drill-size",
            `${fp.ref} pad ${pad.num} drills ${drill.toFixed(2)} mm`,
            `Smaller than the ${MIN_PLATED_DRILL_MM} mm minimum plated drill.`,
            `Open the hole to ${MIN_PLATED_DRILL_MM} mm.`,
            [fp.ref]
          )
        );
      }
    }
  }
  for (const via of board.layout.vias) {
    if (via.drill < MIN_PLATED_DRILL_MM) {
      out.push(
        dfmFinding(
          "dfm-drill-size",
          `A via on ${via.net} drills ${via.drill.toFixed(2)} mm`,
          `Smaller than the ${MIN_PLATED_DRILL_MM} mm minimum plated drill.`,
          `Open the via drill to ${MIN_PLATED_DRILL_MM} mm.`,
          [],
          via.net ? [via.net] : [],
          "minor"
        )
      );
    }
  }
  return out;
}

/** Tracks below what the process can etch reliably. */
function trackWidth(board) {
  const thin = board.layout.tracks.filter((t) => t.width < MIN_TRACK_WIDTH_MM);
  if (!thin.length) return [];
  const nets = [...new Set(thin.map((t) => t.net).filter(Boolean))].sort();
  return [
    dfmFinding(
      "dfm-track-width",
      `${thin.length} track segments are narrower than ${MIN_TRACK_WIDTH_MM} mm`,
      "Below the minimum trace width the process can etch, so the copper may " +
        "come out thin or open.",
      `Widen them to at least ${MIN_TRACK_WIDTH_MM} mm.`,
      [],
      nets.slice(0, 4)
    ),
  ];
}

/**
 * How much current a track can carry, by IPC-2221.
 *
 *   I = k * dT^0.44 * A^0.725      A in square mils, dT in degrees C
 *
 * `k` is 0.048 for an outer layer and 0.024 for an inner one, and the
 * difference is the whole reason a number is quoted with its assumptions
 * beside it: the same 0.1 mm track carries 0.45 A on the outside of a board
 * and 0.22 A buried in it. Assumed 1 oz copper and a 10 degree rise, which is
 * the ordinary case and is stated wherever the number is shown.
 */
const OUNCE_MILS = 1.378;
const RISE_C = 10;

function ampacity(widthMm, { outer = true, ounces = 1 } = {}) {
  const mils = (widthMm / 0.0254) * ounces * OUNCE_MILS;
  const k = outer ? 0.048 : 0.024;
  return k * Math.pow(RISE_C, 0.44) * Math.pow(mils, 0.725);
}

/**
 * The narrowest track on each supply rail, and what it can carry.
 *
 * A measurement, not a verdict, and it is here because the verdict needs a
 * number nobody has supplied: how much current the rail actually draws. What
 * can be said without that is what the copper can take, and a 5 V rail whose
 * narrowest segment carries 0.45 A is a fact worth a reviewer's attention even
 * though it is not yet a defect.
 */
function railCapacity(board) {
  const out = [];
  const narrowest = new Map();
  for (const track of board.layout.tracks) {
    const net = track.net;
    if (!net || !isRail(net) || isGround(net)) continue;
    if (!narrowest.has(net) || track.width < narrowest.get(net)) {
      narrowest.set(net, track.width);
    }
  }
  for (const [net, width] of [...narrowest].sort()) {
    out.push({
      rule: "rail-ampacity",
      source: "measured",
      net,
      width_mm: width,
      amps: Number(ampacity(width).toFixed(2)),
      note:
        `${net} narrows to ${width} mm, which carries about ` +
        `${ampacity(width).toFixed(2)} A on an outer layer at 1 oz copper and a ` +
        "10 C rise.",
    });
  }
  return out;
}

const DFM_RULES = [annularRing, drillSize, trackWidth];

function runDfm(board) {
  return DFM_RULES.flatMap((rule) => rule(board));
}

/**
 * A rail that cannot carry what its regulator is rated to deliver.
 *
 * This is the check the fab-limit rule is not. A 0.1 mm track on a 5 V rail is
 * two separate problems: the process may not etch it, which `dfm-track-width`
 * says, and it carries about a quarter of an amp, which is an electrical fact
 * and the one that actually burns. The first is about the board being made; the
 * second is about it working.
 *
 * It needs a current, and it refuses to guess one. `rated` maps a part to the
 * output current its datasheet states - which the datasheet agent extracts and
 * verifies against a quote - and the rail is whatever that part's power-output
 * pins sit on. No datasheet, no rated current, no finding: the rail's capacity
 * is still reported as a measurement, and the check reports as unassessed
 * rather than as passed.
 */
function railAmpacityFindings(board, rated) {
  if (!rated || !Object.keys(rated).length) return [];
  const narrowest = new Map();
  for (const track of board.layout.tracks) {
    const net = track.net;
    if (!net || !isRail(net) || isGround(net)) continue;
    if (!narrowest.has(net) || track.width < narrowest.get(net)) {
      narrowest.set(net, track.width);
    }
  }

  const out = [];
  for (const net of board.nets) {
    for (const node of net.nodes) {
      const amps = rated[node.ref];
      if (!amps || baseType(node.type) !== "power_out") continue;
      const width = narrowest.get(net.name);
      if (width === undefined) continue;
      const carries = ampacity(width);
      if (carries >= amps) continue;
      out.push(
        dfmFinding(
          "rail-ampacity",
          `${net.name} narrows to ${width} mm, below what ${node.ref} can deliver`,
          `${node.ref} is rated for ${amps} A and the narrowest segment on this ` +
            `rail carries about ${carries.toFixed(2)} A at 1 oz copper on an outer ` +
            "layer, so the copper is the limit rather than the regulator.",
          `Widen ${net.name} to at least ${widthFor(amps).toFixed(2)} mm, or pour it.`,
          [node.ref],
          [net.name],
          "critical"
        )
      );
    }
  }
  return out;
}

/** The width IPC-2221 wants for a current, inverting `ampacity`. */
function widthFor(amps, { outer = true, ounces = 1 } = {}) {
  const k = outer ? 0.048 : 0.024;
  const mils = Math.pow(amps / (k * Math.pow(RISE_C, 0.44)), 1 / 0.725);
  return (mils / (ounces * OUNCE_MILS)) * 0.0254;
}

// ===== site/ops.js ====================================================

// The edit operations, in the browser. The mirror of harness/ops.py.
//
// Same nine operations, same log entries, same canonical text, same hash.
// tests/fixtures/ops.json is the shared fixture that keeps the two honest:
// tests/run.py applies it here through node and there through Python and
// requires identical hashes out of both.
//
// Schematic edits change the netlist only. The copper keeps the routing it was
// extracted with — see the note at the top of harness/ops.py for why.

class OpError extends Error {}

// --------------------------------------------------------------------- lookup

function findComponent(board, ref) {
  const comp = board.components.find((c) => c.ref === ref);
  if (!comp) throw new OpError(`no component ${ref}`);
  return comp;
}

function findNet(board, name) {
  return board.nets.find((n) => n.name === name) || null;
}

function findNode(board, ref, pin) {
  for (const net of board.nets) {
    const node = net.nodes.find((n) => n.ref === ref && n.pin === pin);
    if (node) return [net, node];
  }
  throw new OpError(`no pin ${ref}.${pin} on any net`);
}

function findFootprint(board, ref) {
  const fp = board.layout.footprints.find((f) => f.ref === ref);
  if (!fp) throw new OpError(`no footprint ${ref}`);
  return fp;
}

function byId(items, id, what) {
  const index = items.findIndex((item) => item.id === id);
  if (index < 0) throw new OpError(`no ${what} ${id}`);
  return [index, items[index]];
}

// ------------------------------------------------------------------ operations

const OPS = {
  move_pin(board, { ref, pin, to_net }) {
    pin = String(pin);
    const [net, node] = findNode(board, ref, pin);
    if (net.name === to_net) throw new OpError(`${ref}.${pin} is already on ${to_net}`);

    let target = findNet(board, to_net);
    const created = target === null;
    if (created) {
      const code = board.nets.reduce((max, n) => Math.max(max, n.code || 0), 0) + 1;
      target = { name: to_net, code, nodes: [] };
      board.nets.push(target);
    }
    const index = net.nodes.indexOf(node);
    net.nodes.splice(index, 1);
    target.nodes.push(node);

    return {
      op: "move_pin",
      args: { ref, pin, to_net },
      from_net: net.name,
      from_index: index,
      created_net: created,
      label: `${ref}.${pin}: ${net.name} → ${to_net}`,
    };
  },

  swap_pins(board, { ref, pin_a, pin_b }) {
    pin_a = String(pin_a);
    pin_b = String(pin_b);
    const [netA, nodeA] = findNode(board, ref, pin_a);
    const [netB, nodeB] = findNode(board, ref, pin_b);
    if (netA === netB) throw new OpError(`${ref}.${pin_a} and ${ref}.${pin_b} are the same net`);

    const nameA = netA.name;
    const nameB = netB.name;
    // Each node goes back where the other one was, so a swap is exactly its own
    // inverse — position included, not just membership.
    const indexA = netA.nodes.indexOf(nodeA);
    const indexB = netB.nodes.indexOf(nodeB);
    netA.nodes.splice(indexA, 1, nodeB);
    netB.nodes.splice(indexB, 1, nodeA);

    return {
      op: "swap_pins",
      args: { ref, pin_a, pin_b },
      label: `${ref}: pin ${pin_a} ↔ pin ${pin_b} (${nameA} ↔ ${nameB})`,
    };
  },

  set_value(board, { ref, value }) {
    const comp = findComponent(board, ref);
    const before = comp.value;
    if (before === value) throw new OpError(`${ref} is already ${value}`);
    comp.value = value;
    return {
      op: "set_value",
      args: { ref, value },
      from_value: before,
      label: `${ref}: value '${before}' → '${value}'`,
    };
  },

  move_footprint(board, { ref, x, y }) {
    const fp = findFootprint(board, ref);
    const before = [fp.x, fp.y];
    fp.x = round4(x);
    fp.y = round4(y);
    return {
      op: "move_footprint",
      args: { ref, x: fp.x, y: fp.y },
      from_xy: before,
      label: `${ref}: moved to (${fp.x.toFixed(2)}, ${fp.y.toFixed(2)}) mm`,
    };
  },

  rotate_footprint(board, { ref, deg }) {
    const fp = findFootprint(board, ref);
    const before = fp.rot;
    const after = round4(mod360(deg));
    if (after === mod360(before)) throw new OpError(`${ref} is already at ${deg} degrees`);
    fp.rot = after;
    return {
      op: "rotate_footprint",
      args: { ref, deg: after },
      from_rot: before,
      label: `${ref}: rotated to ${trim(after)}°`,
    };
  },

  delete_track(board, { track_id }) {
    const tracks = board.layout.tracks;
    const [index, track] = byId(tracks, track_id, "track");
    tracks.splice(index, 1);
    return {
      op: "delete_track",
      args: { track_id },
      index,
      track,
      label: `deleted ${trim(track.width)} mm ${track.net || "unnamed"} track on ${track.layer}`,
    };
  },

  set_track_width(board, { track_id, mm }) {
    const [, track] = byId(board.layout.tracks, track_id, "track");
    const before = track.width;
    track.width = round4(mm);
    return {
      op: "set_track_width",
      args: { track_id, mm: track.width },
      from_width: before,
      label: `${track.net || "unnamed"} track: ${trim(before)} → ${trim(track.width)} mm`,
    };
  },

  delete_via(board, { via_id }) {
    const vias = board.layout.vias;
    const [index, via] = byId(vias, via_id, "via");
    vias.splice(index, 1);
    return {
      op: "delete_via",
      args: { via_id },
      index,
      via,
      label: `deleted ${via.net || "unnamed"} via at (${via.x.toFixed(1)}, ${via.y.toFixed(1)})`,
    };
  },

  toggle_zone(board, { zone_id }) {
