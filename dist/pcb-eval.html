 * designator the schematic gave it, a pin that supplies or drives rather than
 * merely conducts, a description of an active device, or a part sitting across
 * more than one supply rail.
 *
 * There used to be a fifth clause, six or more pins, and it was a number
 * somebody picked. It caught exactly one part, a bare 1x06 header, which is the
 * case where a datasheet buys least: there is no document for a row of holes,
 * and what matters about a connector is the pinout of whatever mates with it.
 *
 * The reason is a predicate, not a noun: it is read back as "researched because
 * it <why>", and a phrase that does not finish that sentence is a phrase nobody
 * wrote for a reader.
 */
function needsDatasheet(board) {
  const pins = pinsByRef(board);
  const out = new Map();
  for (const comp of board.components) {
    const mine = pins.get(comp.ref) || [];
    const rails = new Set(
      mine.map((p) => p.net).filter((n) => /^\/?(VBUS|VCC|VDD|VEE|VIN|VOUT|[+-]?\d+V\d*|[+-]\d+(\.\d+)?V)[A-Z0-9]*$/i.test(n))
    );
    let why = null;
    if (/^(U|S|IC|Q)\d/.test(comp.ref)) {
      why = `carries a ${comp.ref[0]} designator, which marks an integrated circuit`;
    } else if (mine.some((p) => POWER_TYPES.has(baseType(p.node.type)))) {
      why = "has a pin that supplies or drives, so it holds circuitry of its own";
    } else if (SIGNIFICANT.test(`${comp.description || ""} ${comp.value || ""}`)) {
      why = "is described as an active device";
    } else if (rails.size > 1) {
      why = `bridges ${rails.size} supply rails`;
    }
    if (!why) continue;
    if (NEVER_RESEARCHED.test(comp.ref) && mine.length <= 2) continue;
    out.set(comp.ref, why);
  }
  return out;
}

/**
 * How each part stands: "have", "missing", or absent when it needs nothing.
 *
 * A document is the only answer that counts, because it is the only one that
 * can be quoted. Retrieval hands a reviewer a passage with a page number on it,
 * and a finding resting on that can be checked against the document. A number
 * somebody typed into a box cannot be, which is why the box is gone.
 */
function coverage(board) {
  const out = new Map();
  for (const [ref, why] of needsDatasheet(board)) {
    const doc = docFor(board.meta.name, ref);
    out.set(ref, { status: doc ? "have" : "missing", why, doc: doc || null });
  }
  return out;
}

// ===== site/render.js =================================================

// The three views, drawn from the Board object rather than from KiCad's plots.
//
// The schematic is KiCad's own SVG export nested inside ours, so it pans and
// zooms with everything else — but it is a picture, and edits cannot change it.
// Markers are drawn over it instead, at component level, from the symbol
// positions in the .kicad_sch.
//
// Layout and routing are drawn element by element out of Board.layout, because
// every track, pad, via and pour has to be individually selectable and mutable.
// That is about 700 nodes for this board, which needs no virtualisation.
//
// Coordinates are board-relative millimetres throughout, so the viewBox is
// "0 0 width height" and one user unit is one millimetre. `place()` is the same
// transform as extract/layout.py `place()`: KiCad's RotatePoint, y down,
// positive angles counter-clockwise. Pad angles are stored absolute — they
// already include the footprint's own rotation — so a pad inside a rotated
// footprint group needs the difference, not the sum.

// `place` is KiCad's RotatePoint and lives in copper.js, which needs it to put
// pads in board coordinates. One definition, used by both.

const SVG_NS = "http://www.w3.org/2000/svg";

function el(name, attrs = {}, children = []) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    node.setAttribute(key, String(value));
  }
  for (const child of [].concat(children)) {
    if (child) node.appendChild(child);
  }
  return node;
}

const f = (n) => Number(n).toFixed(3);

//: How far a pointer may travel and still count as a tap rather than a pan.
const TAP_SLOP = 3;

// ------------------------------------------------------------------- outline

function arcPath(x1, y1, mx, my, x2, y2) {
  // Three points on a circle; SVG wants a radius, a sweep and a large-arc flag.
  const d =
    2 * (x1 * (my - y2) + mx * (y2 - y1) + x2 * (y1 - my));
  if (Math.abs(d) < 1e-9) return `L ${f(x2)} ${f(y2)}`; // collinear: a line
  const s1 = x1 * x1 + y1 * y1;
  const s2 = mx * mx + my * my;
  const s3 = x2 * x2 + y2 * y2;
  const ux = (s1 * (my - y2) + s2 * (y2 - y1) + s3 * (y1 - my)) / d;
  const uy = (s1 * (x2 - mx) + s2 * (x1 - x2) + s3 * (mx - x1)) / d;
  const r = Math.hypot(x1 - ux, y1 - uy);

  const angle = (px, py) => Math.atan2(py - uy, px - ux);
  const span = (a, b) => {
    let delta = b - a;
    while (delta < 0) delta += 2 * Math.PI;
    return delta;
  };
  const a1 = angle(x1, y1);
  const toMid = span(a1, angle(mx, my));
  const toEnd = span(a1, angle(x2, y2));
  const sweep = toMid <= toEnd ? 1 : 0;
  const arc = sweep ? toEnd : 2 * Math.PI - toEnd;
  return `A ${f(r)} ${f(r)} 0 ${arc > Math.PI ? 1 : 0} ${sweep} ${f(x2)} ${f(y2)}`;
}

function outlinePath(outline) {
  // Edge.Cuts is a bag of unordered segments; chain them so the result is one
  // closed path that can be filled as the board substrate.
  const items = outline.filter((i) => i.kind !== "circle");
  const circles = outline.filter((i) => i.kind === "circle");
  const used = new Array(items.length).fill(false);
  const near = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by) < 0.01;
  let path = "";

  for (let start = 0; start < items.length; start++) {
    if (used[start]) continue;
    used[start] = true;
    let head = items[start];
    let [cx, cy] = [head.x2, head.y2];
    path += ` M ${f(head.x1)} ${f(head.y1)} ${segmentTo(head, false)}`;

    let extended = true;
    while (extended) {
      extended = false;
      for (let i = 0; i < items.length; i++) {
        if (used[i]) continue;
        const item = items[i];
        if (near(cx, cy, item.x1, item.y1)) {
          path += " " + segmentTo(item, false);
          [cx, cy] = [item.x2, item.y2];
        } else if (near(cx, cy, item.x2, item.y2)) {
          path += " " + segmentTo(item, true);
          [cx, cy] = [item.x1, item.y1];
        } else {
          continue;
        }
        used[i] = true;
        extended = true;
        break;
      }
    }
    if (near(cx, cy, head.x1, head.y1)) path += " Z";
  }

  for (const c of circles) {
    path += ` M ${f(c.x - c.r)} ${f(c.y)} a ${f(c.r)} ${f(c.r)} 0 1 0 ${f(2 * c.r)} 0 a ${f(c.r)} ${f(c.r)} 0 1 0 ${f(-2 * c.r)} 0 Z`;
  }
  return path.trim();
}

function segmentTo(item, reversed) {
  const [x1, y1, x2, y2] = reversed
    ? [item.x2, item.y2, item.x1, item.y1]
    : [item.x1, item.y1, item.x2, item.y2];
  if (item.kind === "arc") return arcPath(x1, y1, item.mx, item.my, x2, y2);
  if (item.kind === "rect") {
    return `L ${f(x2)} ${f(y1)} L ${f(x2)} ${f(y2)} L ${f(x1)} ${f(y2)} Z`;
  }
  return `L ${f(x2)} ${f(y2)}`;
}

// ----------------------------------------------------------------- footprints

function padNode(pad, fpRot) {
  const w = pad.w || 0.2;
  const h = pad.h || 0.2;
  // Pad angles are absolute; the group has already applied the footprint's.
  const local = (pad.rot || 0) - (fpRot || 0);
  const transform = `translate(${f(pad.x)} ${f(pad.y)})` + (local ? ` rotate(${f(-local)})` : "");
  const attrs = {
    class: "pad" + (pad.kind === "np_thru_hole" ? " pad-hole" : ""),
    transform,
  };
  let shape;
  if (pad.shape === "circle" || (pad.shape === "oval" && Math.abs(w - h) < 1e-6)) {
    shape = el("circle", { ...attrs, r: f(w / 2) });
  } else {
    const rx = pad.shape === "roundrect" ? Math.min(w, h) * 0.25 : pad.shape === "oval" ? Math.min(w, h) / 2 : 0;
    shape = el("rect", {
      ...attrs,
      x: f(-w / 2),
      y: f(-h / 2),
      width: f(w),
      height: f(h),
      rx: rx ? f(rx) : null,
    });
  }
  if (!pad.drill) return [shape];
  return [shape, el("circle", { class: "drill", transform, r: f(pad.drill / 2) })];
}

function graphicNode(item) {
  if (item.kind === "poly") {
    return el("polygon", {
      class: `fp-${item.layer.includes("SilkS") ? "silk" : "fab"}`,
      points: item.pts.map(([x, y]) => `${f(x)},${f(y)}`).join(" "),
    });
  }
  const cls = `fp-${item.layer.includes("SilkS") ? "silk" : "fab"}`;
  if (item.kind === "rect") {
    return el("rect", {
      class: cls,
      x: f(Math.min(item.x1, item.x2)),
      y: f(Math.min(item.y1, item.y2)),
      width: f(Math.abs(item.x2 - item.x1)),
      height: f(Math.abs(item.y2 - item.y1)),
    });
  }
  if (item.kind === "circle") {
    return el("circle", { class: cls, cx: f(item.x1), cy: f(item.y1), r: f(item.r || 0.1) });
  }
  if (item.kind === "arc") {
    return el("path", {
      class: cls,
      d: `M ${f(item.x1)} ${f(item.y1)} ${arcPath(item.x1, item.y1, item.mx, item.my, item.x2, item.y2)}`,
    });
  }
  return el("line", { class: cls, x1: f(item.x1), y1: f(item.y1), x2: f(item.x2), y2: f(item.y2) });
}

/** The footprint's own extent, in its local frame: pads and silkscreen. */
function footprintBox(fp) {
  const xs = [];
  const ys = [];
  for (const pad of fp.pads) {
    const half = Math.max(pad.w, pad.h) / 2;
    xs.push(pad.x - half, pad.x + half);
    ys.push(pad.y - half, pad.y + half);
  }
  for (const item of fp.graphics) {
    if (item.kind === "poly") {
      for (const [x, y] of item.pts) {
        xs.push(x);
        ys.push(y);
      }
    } else {
      xs.push(item.x1, item.x2);
      ys.push(item.y1, item.y2);
    }
  }
  if (!xs.length) return null;
  return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) };
}


function footprintNode(fp, { showSilk = true, showRefs = true } = {}) {
  // A back-layer footprint is mirrored in Y and turns the other way. This board
  // is single-sided so the branch is untested; it is here so the renderer does
  // not silently draw a back part in the wrong place if one ever appears.
  const flip = fp.layer === "B";
  const rot = flip ? fp.rot : -fp.rot;
  const transform =
    `translate(${f(fp.x)} ${f(fp.y)})` +
    (fp.rot ? ` rotate(${f(rot)})` : "") +
    (flip ? " scale(1 -1)" : "");

  const children = [];

  // A transparent body, so the part can be grabbed anywhere and not only on a
  // pad or a silkscreen line. Without it, pressing the middle of a two-pad part
  // hits nothing and pans the view instead of dragging the part.
  const body = footprintBox(fp);
  if (body) {
    const hit = el("rect", {
      class: "fp-body",
      x: f(body.x0),
      y: f(body.y0),
      width: f(body.x1 - body.x0),
      height: f(body.y1 - body.y0),
    });
    hit.dataset.kind = "footprint";
    hit.dataset.ref = fp.ref;
    children.push(hit);
  }

  if (showSilk) {
    for (const item of fp.graphics) {
      if (item.layer.includes("SilkS")) children.push(graphicNode(item));
    }
  }
  for (const pad of fp.pads) {
    for (const node of padNode(pad, fp.rot)) {
      node.dataset.kind = "pad";
      node.dataset.ref = fp.ref;
      node.dataset.pad = pad.num;
      node.dataset.net = pad.net || "";
      children.push(node);
    }
  }
  if (showRefs && fp.ref) {
    children.push(
      el(
        "text",
        {
          class: "ref-label",
          x: 0,
          y: 0,
          "text-anchor": "middle",
          "dominant-baseline": "middle",
          transform: flip ? "scale(1 -1)" : null,
        },
        [document.createTextNode(fp.ref)]
      )
    );
  }
  const group = el("g", { class: `footprint layer-${fp.layer}`, transform }, children);
  group.dataset.kind = "footprint";
  group.dataset.ref = fp.ref;
  return group;
}

// ------------------------------------------------------------------ the board

const LAYER_CLASS = { "F.Cu": "f-cu", "B.Cu": "b-cu" };

/**
 * Draw the layout or routing view.
 *
 * `copper` false gives the layout view: outline, footprints, pads, silkscreen.
 * `copper` true adds tracks, vias and pours, which is the routing view.
 */
function renderBoard(board, { copper = true, showSilk = true, showRefs = true } = {}) {
  const layout = board.layout;
  const svg = el("svg", {
    class: "board-svg",
    viewBox: `0 0 ${f(layout.size.w)} ${f(layout.size.h)}`,
    preserveAspectRatio: "xMidYMid meet",
  });

  svg.appendChild(el("path", { class: "substrate", d: outlinePath(layout.outline) }));

  if (copper) {
    const zones = el("g", { class: "zones" });
    for (const zone of layout.zones) {
      if (zone.disabled) continue;
      for (const fill of zone.filled) {
        if (!fill.pts.length) continue;
        const node = el("polygon", {
          class: `zone ${LAYER_CLASS[fill.layer] || ""}`,
          points: fill.pts.map(([x, y]) => `${f(x)},${f(y)}`).join(" "),
        });
        node.dataset.kind = "zone";
        node.dataset.id = zone.id;
        node.dataset.net = zone.net;
        zones.appendChild(node);
      }
    }
    svg.appendChild(zones);

    const tracks = el("g", { class: "tracks" });
    for (const track of layout.tracks) {
      const node = el("line", {
        class: `track ${LAYER_CLASS[track.layer] || ""}`,
        x1: f(track.x1),
        y1: f(track.y1),
        x2: f(track.x2),
        y2: f(track.y2),
        "stroke-width": f(track.width),
      });
      node.dataset.kind = "track";
      node.dataset.id = track.id;
      node.dataset.net = track.net;
      tracks.appendChild(node);
    }
    svg.appendChild(tracks);
  }

  const footprints = el("g", { class: "footprints" });
  for (const fp of layout.footprints) {
    footprints.appendChild(footprintNode(fp, { showSilk, showRefs }));
  }
  svg.appendChild(footprints);

  if (copper) {
    const vias = el("g", { class: "vias" });
    for (const via of layout.vias) {
      const node = el("circle", {
        class: "via",
        cx: f(via.x),
        cy: f(via.y),
        r: f(via.size / 2),
      });
      node.dataset.kind = "via";
      node.dataset.id = via.id;
      node.dataset.net = via.net;
      vias.appendChild(node);
      vias.appendChild(
        el("circle", { class: "via-drill", cx: f(via.x), cy: f(via.y), r: f(via.drill / 2) })
      );
    }
    svg.appendChild(vias);
  }

  svg.appendChild(el("path", { class: "edge", d: outlinePath(layout.outline) }));
  svg.appendChild(el("g", { class: "divergence" }));
  svg.appendChild(el("g", { class: "marks" }));
  return svg;
}

// ------------------------------------------------------------------ schematic

/** Every pad's world position, keyed "REF.PIN". */
function padIndex(board) {
  const index = new Map();
  for (const fp of board.layout.footprints) {
    for (const pad of fp.pads) {
      const [dx, dy] = place(pad.x, pad.y, fp.rot);
      index.set(`${fp.ref}.${pad.num}`, {
        ref: fp.ref,
        pin: pad.num,
        x: fp.x + dx,
        y: fp.y + dy,
        copper: pad.net,
      });
    }
  }
  return index;
}

/**
 * Where the board no longer agrees with itself.
 *
 * Two kinds, and between them they are what makes an edit visible:
 *
 * - **stale** — a pad whose netlist net is not the net its copper belongs to.
 *   That is what a schematic edit leaves behind: the design says this pin is on
 *   VBST now, and the track it sits on was laid for /FB. Nothing in the board
 *   data is changed to produce this; it is read off the two halves.
 * - **stranded** — a pad on a net whose copper is in more than one piece, and
 *   not on the largest piece. That is the ground defect, and it is invisible in
 *   the net list by construction.
 */
function divergence(board) {
  const pads = padIndex(board);
  const stale = [];
  const byNet = new Map();

  for (const net of board.nets) {
    for (const node of net.nodes) {
      const pad = pads.get(`${node.ref}.${node.pin}`);
      if (!pad) continue;
      if (!byNet.has(net.name)) byNet.set(net.name, []);
      byNet.get(net.name).push(pad);
      if (pad.copper && pad.copper !== net.name) {
        stale.push({ ...pad, wants: net.name });
      }
    }
  }

  // For each stale pad, the nearest pin the schematic now says it joins. This
  // is the connection the copper does not provide — a ratsnest line, the same
  // thing a layout tool draws for an unrouted net.
  for (const item of stale) {
    let best = null;
    for (const other of byNet.get(item.wants) || []) {
      // By name, not by identity: `item` is a copy of the pad, so `other`
      // being the same pin is exactly the case that must be skipped.
      if (other.ref === item.ref && other.pin === item.pin) continue;
      const distance = Math.hypot(other.x - item.x, other.y - item.y);
      if (!best || distance < best.distance) best = { distance, to: other };
    }
    item.to = best ? best.to : null;
  }

  const stranded = [];
  for (const [net, groups] of islands(board)) {
    const withPads = groups.filter((g) => g.some((i) => i.kind === "pad"));
    if (withPads.length < 2) continue;
    const size = (g) => g.filter((i) => i.kind === "pad").length;
    const main = withPads.reduce((a, b) => (size(b) > size(a) ? b : a));
    for (const group of withPads) {
      if (group === main) continue;
      for (const item of group) {
        if (item.kind === "pad") stranded.push({ id: item.id, net, x: item.x, y: item.y });
      }
    }
  }
  return { stale, stranded };
}

/** Draw the divergence into a board view. Returns what it drew. */
function markDivergence(svg, board) {
  const layer = svg.querySelector(".divergence");
  if (!layer) return { stale: [], stranded: [] };
  layer.textContent = "";
  const found = divergence(board);

  for (const item of found.stranded) {
    layer.appendChild(
      el("circle", { class: "stranded", cx: f(item.x), cy: f(item.y), r: 0.85 })
    );
  }
  for (const item of found.stale) {
    if (item.to) {
      layer.appendChild(
        el("line", {
          class: "ratsnest",
          x1: f(item.x),
          y1: f(item.y),
          x2: f(item.to.x),
          y2: f(item.to.y),
        })
      );
    }
    layer.appendChild(
      el("circle", { class: "stale-pad", cx: f(item.x), cy: f(item.y), r: 0.85 })
    );
  }
  return found;
}

/** Drop every marker. Findings and edits share the layer, so this comes first. */
function clearMarks(svg) {
  const marks = svg.querySelector(".marks");
  if (marks) marks.textContent = "";
}

/**
 * Ring the components a set of findings or edits point at.
 *
 * Marking is at part level, not pin level: a ring around the footprint. A pad
 * ring would need the pin the finding names, and a reviewer naming pins is a
 * habit rather than a promise — `S1.4`, `S1 pin 4`, `FB`. The part is the thing
 * both ends agree on.
 */
function markRefs(svg, board, refs, kind = "flag") {
  const marks = svg.querySelector(".marks");
  if (!marks) return;
  const wanted = new Set(refs);
  if (!wanted.size) return;

  for (const fp of board.layout.footprints) {
    if (!wanted.has(fp.ref)) continue;
    const extent = fp.pads.reduce((max, pad) => {
      const [px, py] = place(pad.x, pad.y, fp.rot);
      return Math.max(max, Math.hypot(px, py) + Math.max(pad.w, pad.h) / 2);
    }, 1.2);
    marks.appendChild(
      el("circle", { class: `mark mark-${kind}`, cx: f(fp.x), cy: f(fp.y), r: f(extent + 0.4) })
    );
  }
}

/** Highlight every piece of copper on a net. */
function highlightNets(svg, nets) {
  const wanted = new Set(nets.filter(Boolean));
  for (const node of svg.querySelectorAll("[data-net]")) {
    node.classList.toggle("net-lit", wanted.has(node.dataset.net));
  }
}

// ----------------------------------------------------------------- pan & zoom

/**
 * Wheel to zoom about the cursor, drag empty space to pan.
 *
 * A 0.3 mm track on a 61 mm board is a third of a percent of the width, so the
 * views are unreadable without this.
 *
 * Selection is reported through `onTap` on pointerup, not through a `click`
 * listener. Panning takes pointer capture on the root, and capture retargets
 * the click that follows to the root — so a `click` handler looking for the
 * element under the cursor finds the SVG and nothing else. That made every
 * board view read-only: the track, via and pour editors had no way in.
 */
function attachPanZoom(svg, { onPointerDown, onTap } = {}) {
  const [, , w0, h0] = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  const home = { x: 0, y: 0, w: w0, h: h0 };
  let view = { ...home };
  let dragging = null;

  const apply = () => {
    svg.setAttribute("viewBox", `${f(view.x)} ${f(view.y)} ${f(view.w)} ${f(view.h)}`);
    // Keep hairlines hairline-thin as the view zooms in.
    svg.style.setProperty("--zoom", String(w0 / view.w));
  };

  const toBoard = (event) => {
    const rect = svg.getBoundingClientRect();
    const scale = Math.min(rect.width / view.w, rect.height / view.h);
    const insetX = (rect.width - view.w * scale) / 2;
    const insetY = (rect.height - view.h * scale) / 2;
    return {
      x: view.x + (event.clientX - rect.left - insetX) / scale,
      y: view.y + (event.clientY - rect.top - insetY) / scale,
    };
  };

  svg.addEventListener(
    "wheel",
    (event) => {
      event.preventDefault();
      const at = toBoard(event);
      const factor = Math.exp(event.deltaY * 0.0015);
      const next = Math.min(Math.max(view.w * factor, w0 / 60), w0 * 3);
      const ratio = next / view.w;
      view = {
        x: at.x - (at.x - view.x) * ratio,
        y: at.y - (at.y - view.y) * ratio,
        w: next,
        h: view.h * ratio,
      };
      apply();
    },
    { passive: false }
  );

  svg.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    const target = event.target.closest("[data-kind]");
    if (target && onPointerDown && onPointerDown(event, target, toBoard(event))) return;
    // Panning holds the view size fixed, so the millimetres-per-pixel scale is
    // constant for the whole drag and a screen delta converts straight across.
    const rect = svg.getBoundingClientRect();
    dragging = {
      clientX: event.clientX,
      clientY: event.clientY,
      vx: view.x,
      vy: view.y,
      scale: Math.min(rect.width / view.w, rect.height / view.h),
      target,
      moved: false,
    };
    svg.setPointerCapture(event.pointerId);
    svg.classList.add("panning");
  });

  svg.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    if (Math.hypot(event.clientX - dragging.clientX, event.clientY - dragging.clientY) > TAP_SLOP) {
      dragging.moved = true;
    }
    view.x = dragging.vx - (event.clientX - dragging.clientX) / dragging.scale;
    view.y = dragging.vy - (event.clientY - dragging.clientY) / dragging.scale;
    apply();
  });

  const stop = (event) => {
    if (!dragging) return;
    // A press that went nowhere is a tap on whatever was under it — including
    // nothing, which is how you clear the selection.
    if (!dragging.moved && onTap) onTap(dragging.target);
    dragging = null;
    svg.classList.remove("panning");
    if (event.pointerId !== undefined && svg.hasPointerCapture(event.pointerId)) {
      svg.releasePointerCapture(event.pointerId);
    }
  };
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);

  return {
    reset() {
      view = { ...home };
      apply();
    },
    toBoard,
    get view() {
      return { ...view };
    },
  };
}

/**
 * One footprint, drawn on its own, at its own scale.
 *
 * The board view answers "where is this part". It cannot answer "what does this
 * pad look like", because at board scale a 0402 is four pixels. This draws the
 * part alone: the fabrication outline that says where the body sits, the
 * silkscreen, and every pad at its real size and shape, numbered.
 *
 * Drawn unrotated. The footprint's placement angle belongs to the board, and a
 * part inspected at 270 degrees should not be read upside down - the rotation is
 * stated in the facts beside it instead.
 */
function renderFootprint(fp, { width = 200, height = 150 } = {}) {
  const box = footprintBounds(fp);
  const w = box.x2 - box.x1;
  const h = box.y2 - box.y1;
  // Fit the box, rather than fixing the width: a six-pin header is three times
  // taller than it is wide, and fixing the width made it 500 pixels of rail.
  const scale = Math.min(width / w, height / h);
  const svg = el("svg", {
    class: "fp-svg",
    viewBox: `${f(box.x1)} ${f(box.y1)} ${f(w)} ${f(h)}`,
    width: Math.round(w * scale),
    height: Math.round(h * scale),
    role: "img",
    "aria-label": `Footprint of ${fp.ref}: ${fp.pads.length} pads`,
  });

  // Fabrication and silkscreen first, so a pad is never hidden behind a line.
  for (const g of fp.graphics || []) {
    const fab = /Fab$/.test(g.layer || "");
    const cls = fab ? "fp-fab" : "fp-silk";
    if (g.kind === "line") {
      svg.appendChild(el("line", { class: cls, x1: f(g.x1), y1: f(g.y1), x2: f(g.x2), y2: f(g.y2) }));
    } else if (g.kind === "rect") {
      svg.appendChild(
        el("rect", {
          class: cls, x: f(Math.min(g.x1, g.x2)), y: f(Math.min(g.y1, g.y2)),
          width: f(Math.abs(g.x2 - g.x1)), height: f(Math.abs(g.y2 - g.y1)),
        })
      );
    } else if (g.kind === "circle") {
      svg.appendChild(el("circle", { class: cls, cx: f(g.x), cy: f(g.y), r: f(g.r) }));
    } else if (g.kind === "poly" && (g.points || []).length > 1) {
      svg.appendChild(
        el("polyline", { class: cls, points: g.points.map((p) => `${f(p.x)},${f(p.y)}`).join(" ") })
      );
    }
  }

  for (const pad of fp.pads) {
    const group = el("g", {
      class: `fp-pad fp-${pad.kind}`,
      transform: `translate(${f(pad.x)} ${f(pad.y)})${pad.rot ? ` rotate(${f(-pad.rot)})` : ""}`,
    });
    if (pad.shape === "circle") {
      group.appendChild(el("circle", { class: "fp-copper", cx: 0, cy: 0, r: f(pad.w / 2) }));
    } else {
      group.appendChild(
        el("rect", {
          class: "fp-copper", x: f(-pad.w / 2), y: f(-pad.h / 2),
          width: f(pad.w), height: f(pad.h),
          rx: pad.shape === "roundrect" ? f(Math.min(pad.w, pad.h) * 0.25) : 0,
        })
      );
    }
    if (pad.drill > 0) {
      group.appendChild(el("circle", { class: "fp-drill", cx: 0, cy: 0, r: f(pad.drill / 2) }));
    }
    svg.appendChild(group);
    // The number goes on unrotated, or a pad turned 270 degrees carries a
    // sideways label.
    // A number is only worth drawing where it can be read. On a 48-pin QFP
    // the pads are 0.3 mm across and forty-eight numbers became a smear, which
    // is worse than no numbers: it hides the pad shapes underneath them.
    if (Math.min(pad.w, pad.h) * scale >= 9) {
      const label = el("text", {
        class: "fp-num", x: f(pad.x), y: f(pad.y), "font-size": f(padFont(fp)),
      });
      label.textContent = pad.num;
      svg.appendChild(label);
    }
  }
  return svg;
}

/** Every pad and every graphic, plus a margin, so nothing touches the edge. */
function footprintBounds(fp) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const grow = (x, y) => {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    x1 = Math.min(x1, x); y1 = Math.min(y1, y);
    x2 = Math.max(x2, x); y2 = Math.max(y2, y);
  };
  for (const pad of fp.pads || []) {
    const reach = Math.max(pad.w, pad.h) / 2;
    grow(pad.x - reach, pad.y - reach);
    grow(pad.x + reach, pad.y + reach);
  }
  for (const g of fp.graphics || []) {
    if (g.kind === "line" || g.kind === "rect") {
      grow(g.x1, g.y1); grow(g.x2, g.y2);
    } else if (g.kind === "circle") {
      grow(g.x - g.r, g.y - g.r); grow(g.x + g.r, g.y + g.r);
    } else if (g.kind === "poly") {
      for (const p of g.points || []) grow(p.x, p.y);
    }
  }
  if (!Number.isFinite(x1)) return { x1: -1, y1: -1, x2: 1, y2: 1 };
  const pad = Math.max(0.2, (x2 - x1 + y2 - y1) * 0.06);
  return { x1: x1 - pad, y1: y1 - pad, x2: x2 + pad, y2: y2 + pad };
}

/** Pad numbers sized to the part, so a 0402 is not labelled in 3 mm type. */
function padFont(fp) {
  const smallest = Math.min(...(fp.pads || []).map((p) => Math.max(p.w, p.h)), 2);
  return Math.max(0.22, Math.min(0.8, smallest * 0.55));
}

/**
 * The physical facts of a package, measured rather than looked up.
 *
 * The body size is the fabrication outline's extent, which is what KiCad draws
 * the part's real body as. There is no 3D model in the extracted board, so
 * nothing here is a height or a rendering: it is the footprint's own geometry,
 * which is the part of "what is this package" the board file actually knows.
 */
function packageFacts(fp) {
  const pads = fp.pads || [];
  const fab = (fp.graphics || []).filter((g) => /Fab$/.test(g.layer || ""));
  let body = null;
  if (fab.length) {
    const xs = [], ys = [];
    for (const g of fab) {
      if (g.kind === "circle") { xs.push(g.x - g.r, g.x + g.r); ys.push(g.y - g.r, g.y + g.r); }
      else if (g.kind === "poly") { for (const p of g.points || []) { xs.push(p.x); ys.push(p.y); } }
      else { xs.push(g.x1, g.x2); ys.push(g.y1, g.y2); }
    }
    // An arc contributes no endpoints here, so a shape list can come back
    // holding undefined. Taking a max over that yields NaN and a body of
    // "NaN x NaN mm", which reads as a measurement and is not one.
    const wide = xs.filter(Number.isFinite);
    const tall = ys.filter(Number.isFinite);
    if (wide.length && tall.length) {
      body = {
        w: Math.max(...wide) - Math.min(...wide),
        h: Math.max(...tall) - Math.min(...tall),
      };
    }
  }
  const kinds = new Set(pads.map((p) => p.kind));
  const mount = kinds.has("smd")
    ? kinds.size > 1 ? "SMD, with through-hole" : "SMD"
    : kinds.has("thru_hole") ? "Through-hole" : "Mechanical";
  return { body, mount, pads: pads.length, pitch: pitchOf(pads), drills: drillsOf(pads) };
}

/**
 * The smallest gap between neighbouring pad centres, which is the pitch for
 * anything laid out on a row. Null when there are fewer than two pads to
 * measure between - a single-pad footprint has no pitch, and saying 0 would
 * read as one.
 */
function pitchOf(pads) {
  if (pads.length < 2) return null;
  let best = Infinity;
  for (let i = 0; i < pads.length; i += 1) {
    for (let j = i + 1; j < pads.length; j += 1) {
      const d = Math.hypot(pads[i].x - pads[j].x, pads[i].y - pads[j].y);
      if (d > 0.01) best = Math.min(best, d);
    }
  }
  return Number.isFinite(best) ? best : null;
}

/** The distinct drill sizes, which is what a fab house asks about first. */
function drillsOf(pads) {
  return [...new Set(pads.filter((p) => p.drill > 0).map((p) => Number(p.drill.toFixed(4))))].sort(
    (a, b) => a - b
  );
}

// ===== site/graph.js ==================================================

// V8 in the browser. The mirror of graph/v7.py.
//
//   analyse       deterministic: distil the board, run the rule checks.
//     |           No model is asked anything.
//   review        one call, the whole distilled board, findings out
//     |
//   second look   one call: the board again, plus the first pass's own list,
//     |           asked what that list is missing
//   validate      deterministic: is the subject on this board, does the board
//     |           refute it, is it a repeat of one already kept
//   aggregate     deterministic: merge with what the rules measured, rank, score
//
// WHY THIS AND NOT THE SPECIALISTS
//
// The page used to run the shape the harness ran before V7: an ingest, a
// circuit reviewer, a physical reviewer, an adjudicator and a gate that could
// send the reviewers round again. Five sweeps said that arrangement was worse
// than one reviewer holding the whole board. Splitting a board between
// reviewers loses recall, because a reviewer holding half of one speculates
// about the other half.
//
// There is no LLM critic either, and its absence is a measurement rather than
// an omission. Written strictly it rejected every finding it was given; written
// leniently it rejected almost none and still cost two defects across five
// trials. What it was meant to do is done by `validate`, which is string
// comparison against the board rather than a second opinion about it.
//
// THE LEAK, WHICH IS THE POINT OF THE SHAPE
//
// The reviewer is given the distilled board and nothing appended. The second
// look is given the board and the first pass's own findings - never the rule
// findings, never a defect list. A second pass told where the deterministic
// layer already looked is a second pass being handed the answer.






/** One pass. The loop went with the gate that drove it. */
const MAX_PASSES = 1;

/** The nodes, in the order they run, and what each is for. */
const NODES = ["analyse", "review", "second_look", "validate", "aggregate"];

/** Which nodes ask a model something. The rest are arithmetic. */
const ASKS_MODEL = new Set(["review", "second_look"]);

const ROLES = {
  analyse:
    "Distil the board and run the deterministic checks. No model is asked " +
    "anything, and whatever the rules find is already a finding.",
  review:
    "One reviewer, the whole board. The same prompt the flat-prompt baseline " +
    "is given, so the difference between them is everything around this call.",
  second_look:
    "The same reviewer, shown its own list and asked what it missed. Two draws " +
    "of one reviewer covered more than either alone - that is why this exists.",
  validate:
    "Refuse a finding whose part or net is not on this board, that repeats one " +
    "already kept, or that the copper itself contradicts. No model involved.",
  aggregate:
    "Merge what the reviewer said with what the rules measured, rank, score. " +
    "A measured finding wins a tie: a number beats a sentence about the number.",
};

/** Coerce whatever came back into the finding shape, dropping junk. */
function normalise(items, source) {
  const out = [];
  for (const item of items || []) {
    if (!item || typeof item !== "object") continue;
    const title = String(item.problem || item.title || "").trim();
    if (!title) continue;
    out.push({
      source,
      severity: ["critical", "major", "minor"].includes(item.severity) ? item.severity : "major",
      ...tidy(item.refs, item.nets),
      title,
      why: String(item.why || "").trim(),
      fix: String(item.fix || "").trim(),
      claim: String(item.claim || "").trim(),
      subject: normaliseSubject(item.subject),
      evidence: String(item.evidence || "").trim(),
    });
  }
  return out;
}

const DESIGNATOR = /^[A-Za-z]{1,3}\d+$/;
const NODE_REF = /^([A-Za-z]{1,3}\d+)\.[A-Za-z0-9_]+/;

/**
 * `S1.4` and `S1.6(VBST)` mean pin 4 and pin 6 of S1. The subject is S1.
 *
 * Left literal, a subject of `S1.4` is a part that is not on the board, and the
 * validator throws the finding out for a formatting convention.
 */
function normaliseSubject(value) {
  const text = String(value ?? "").trim();
  const node = NODE_REF.exec(text);
  if (node) return node[1];
  const head = text.split("(")[0].trim();
  // Never inside a net name like `unconnected-(J12-Pad3)`, which is real.
  if (DESIGNATOR.test(head)) return head;
  return text.replace(/,$/, "");
}

/**
 * Sort the model's refs and nets into refs and nets.
 *
 * Reviewers write `D2.2` when they mean pin 2 of D2, and put whole node strings
 * in the nets list. Taken literally both look like something that does not
 * exist, which is what the refutation check is for - so without this it throws
 * out correct findings for a formatting habit.
 */
function tidy(rawRefs, rawNets) {
  const refs = [];
  const nets = [];
  const addRef = (value) => {
    let v = String(value).trim();
    const node = NODE_REF.exec(v);
    if (node) v = node[1];
    v = v.split("(")[0].trim();
    if (DESIGNATOR.test(v) && !refs.includes(v)) refs.push(v);
  };
  for (const raw of rawRefs || []) addRef(raw);
  for (const raw of rawNets || []) {
    const value = String(raw).trim().replace(/,$/, "");
    // A net name can contain brackets - `unconnected-(J12-Pad3)` is one - so
    // nothing is stripped here beyond whitespace.
    if (NODE_REF.test(value) || DESIGNATOR.test(value)) {
      addRef(value);
    } else if (value && !nets.includes(value)) {
      nets.push(value);
    }
  }
  return { refs, nets };
}

/** What two findings must share to be the same finding. */
function key(item) {
  return new Set([
    ...(item.refs || []).map((r) => `r:${r.toUpperCase()}`),
    ...(item.nets || []).map((n) => `n:${n.replace(/^\//, "").toUpperCase()}`),
  ]);
}

const overlaps = (a, b) => [...a].some((v) => b.has(v));

/**
 * Is this finding one already kept, in other words?
 *
 * V8 unions two passes, and the second is asked not to repeat the first. Asked
 * is not the same as does: with the same board in front of it, the same
 * observation comes back worded differently often enough that the union has to
 * settle it rather than the instruction. Two findings are the same when they
 * make the same typed claim about the same subject, or when their titles are
 * the same words - which is the case the model produces when it restates
 * itself verbatim.
 */
function repeats(item, kept) {
  const claim = String(item.claim || "").trim().toLowerCase();
  const subject = String(item.subject || "").trim().toUpperCase().replace(/^\//, "");
  const title = squeezeTitle(item.title);
  for (const other of kept) {
    if (squeezeTitle(other.title) === title) return `already reported: "${other.title}"`;
    if (!claim || !subject || claim === "other") continue;
    const theirs = String(other.subject || "").trim().toUpperCase().replace(/^\//, "");
    if (claim === String(other.claim || "").trim().toLowerCase() && subject === theirs) {
      return `the same claim about ${subject} was already reported`;
    }
  }
  return "";
}

const squeezeTitle = (text) =>
  String(text || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

/** The first pass's findings, as the second look is shown them. */
function alreadyReported(items) {
  if (!items.length) return "Nothing was reported.";
  return items
    .map(
      (item) =>
        `- ${item.title} (refs ${item.refs.join(", ") || "-"};` +
        ` nets ${item.nets.join(", ") || "-"})`
    )
    .join("\n");
}

/**
 * Run the graph.
 *
 * `onStep(step, steps)` is called as each node starts and again when it
 * finishes, so the page can draw the traversal rather than a spinner.
 * `ask(prompt, {onText, signal})` is the one thing this needs from outside.
 */
async function runGraph(board, ask, { onStep, signal } = {}) {
  // The board, plus whatever any attached datasheet was read to say. The
  // harness runs offline and its pack is the board alone; the page can do
  // better, and that is the point of attaching a document to a part.
  const distilled = reviewerPack(board);
  // Everything measured, including the current a rail can carry. The ampacity
  // check only fires where a datasheet stated a rated output current, so on a
  // board with nothing attached it contributes nothing and says so by absence.
  const rules = runChecks(board).concat(railAmpacityFindings(board, ratedCurrents(board)));
  const facts = boardFacts(board);
  const steps = [];

  const emit = (step) => {
    steps.push(step);
    onStep?.(step, steps);
    return step;
  };
  const update = (step, patch) => {
    Object.assign(step, patch, { running: false });
    onStep?.(step, steps);
  };
  const stop = () => {
    if (signal?.aborted) throw Object.assign(new Error("cancelled"), { code: "cancelled" });
  };

  emit({
    node: "analyse",
    measured: true,
    running: false,
    summary:
      `Distilled the board to about ${approxTokens(distilled)} tokens. ` +
      (rules.length
        ? `${rules.length} deterministic check${rules.length === 1 ? "" : "s"} fired.`
        : "No deterministic check fired, which is not the same as the board being correct."),
    rules,
  });

  // --- review -------------------------------------------------------------
  stop();
  const first = emit({ node: "review", measured: false, running: true, stream: "" });
  const firstAnswer = await ask(buildPrompt(distilled), {
    system: SYSTEM_PROMPT,
    signal,
    onText: ({ text }) => {
      first.stream = text.slice(-600);
      onStep?.(first, steps);
    },
  });
  const proposed = normalise(firstAnswer?.findings, "review");
  update(first, { found: proposed, stream: "" });

  // --- second look --------------------------------------------------------
  stop();
  const again = emit({ node: "second_look", measured: false, running: true, stream: "" });
  const moreAnswer = await ask(secondLookPrompt(distilled, alreadyReported(proposed)), {
    system: SYSTEM_PROMPT,
    signal,
    onText: ({ text }) => {
      again.stream = text.slice(-600);
      onStep?.(again, steps);
    },
  });
  const more = normalise(moreAnswer?.findings, "second-look");
  update(again, { found: more, stream: "" });

  // --- validate -----------------------------------------------------------
  const all = proposed.concat(more);
  const confirmed = [];
  const dropped = [];
  for (const item of all) {
    const why = repeats(item, confirmed) || verify(item, facts, distilled);
    if (why) dropped.push({ ...item, dropped: why });
    else confirmed.push(item);
  }
  emit({
    node: "validate",
    measured: true,
    running: false,
    confirmed,
    dropped,
    merged: all.length,
  });

  // --- aggregate ----------------------------------------------------------
  // Measured findings go in first, so where a rule and the reviewer describe
  // one defect the merge keeps the measured one.
  const covered = new Set();
  for (const rule of rules) for (const k of key(rule)) covered.add(k);
  const survivors = confirmed.filter((item) => !overlaps(key(item), covered));
  const findings = rules.concat(survivors);

  emit({
    node: "aggregate",
    measured: true,
    running: false,
    reported: findings.length,
    fromRules: rules.length,
    fromReviewer: survivors.length,
    summary:
      `${findings.length} reported: ${rules.length} measured, ` +
      `${survivors.length} from the reviewer.`,
  });

  return {
    steps,
    rules,
    findings,
    dropped,
    proposed: all,
    passes: 1,
    stopped: "stop:one-pass",
  };
}

// ===== site/review.js =================================================

// The review: run the graph over the board as it stands, then grade the answer.
//
// The page calls the model through `/api/review`, a serverless function that
// holds the key, so no key is embedded and no visitor needs an account. One
// review is four calls — or eight when the gate sends it round again — which is
// why the limits below exist:
//
//   1. a cache on the board hash, which removes most repeat spending because
//      visitors re-review the same edit;
//   2. one review per ten seconds;
//   3. five per browser, in localStorage;
//   4. never on load, only on an explicit click.
//
// None of those four is a spending guarantee. They live in the browser, and
// localStorage clears. They exist to keep ordinary use tidy and to make the cost
// of a review visible to the person spending it.
//
// The limits that actually bound the bill are elsewhere: per-IP counters in the
// function, and above them the spending limit set in the provider's console.
// That last one is the only guard enforced by the party doing the billing, and
// it is the one to rely on.
//
// Grading is by overlap of component refs and net names, never by wording. A
// finding matches an edit when their refs or nets intersect. Running against
// the untouched board matters as much as running against a broken one: a
// reviewer that flags everything catches every defect and is worth nothing.




const PROMPT_ID = `review-1/${PROMPT_VERSION}`;
const MIN_INTERVAL_MS = 10_000;

const COUNT_KEY = "pcb-eval.reviewCount.v1";

// >>> generated by tools/sync_prompt.py — do not edit by hand
// The prompts, byte for byte the ones the harness sends. They come from
// graph/prompts.py; this block is generated by tools/sync_prompt.py and the
// builder refuses to ship a stale copy. The page runs the same graph the
// numbers in the README came from, so the prompts have to be the same too.
const SYSTEM_PROMPT = [
  "You review printed circuit boards before they are manufactured. You",
  "report only what the data supports. An empty findings list is the correct answer",
  "for a board with no defects in your area, and inventing a defect is worse than",
  "missing one. You always reply with JSON only, no prose around it.",
].join("\n");

const SINGLE_PROMPT = [
  "Review this board before it is manufactured.",
  "",
  "You have the whole design. The COMPONENTS section gives each part its value,",
  "package and the library's description of what it is. The NETS section gives",
  "every net, the pins on it, each pin's library name and its electrical type. The",
  "COPPER section states, per net, how many pads it has, how many separate copper",
  "islands those pads sit on, how much track it carries, its narrowest track, how",
  "many vias, and which layers carry a pour. The DECOUPLING section gives the",
  "distance in millimetres from every supply pin to the nearest capacitor on its",
  "own net.",
  "",
  "Report anything wrong with the design.",
  "",
  "Do not report style, silkscreen or aesthetics, or anything you would have to",
  "guess at.",
  "",
  "",
  "The board data carries no current, load, power, temperature or timing figure.",
  "There is no supply current for any rail, no duty cycle and no ambient. A finding",
  "that depends on one of those depends on a number you would have to supply",
  "yourself, and supplying it is inventing evidence.",
  "",
  "Use the exact ref and net strings from the board so findings can be matched to",
  "the design. Reply with JSON only, in exactly this shape:",
  "",
  "{\"findings\": [{",
  "  \"severity\": \"critical\" | \"major\" | \"minor\",",
  "  \"refs\": [\"<ref>\", \"...\"],",
  "  \"nets\": [\"<net>\", \"...\"],",
  "  \"problem\": \"one line naming the defect\",",
  "  \"why\": \"one sentence on the consequence\",",
  "  \"fix\": \"one sentence naming the change that would correct it\"",
  "}]}",
  "",
  "Here is the board.",
  "",
  "",
].join("\n");

const SECOND_LOOK = [
  "You have already reviewed this board once. Below is the",
  "board again, and the list of problems that were reported.",
  "",
  "Report what that list is missing.",
  "",
  "A reviewer working through a board once tends to stop when it has something to",
  "say about each area it looked at, and to look at the areas that suggested",
  "themselves first. So go after what a first pass skips: a value that is right for",
  "some other position in the circuit, a part connected the way its neighbour",
  "should be, a stage that works but is fed from the wrong place, anything whose",
  "consequence only appears when two parts are considered together.",
  "",
  "Do not repeat anything already reported, and do not restate one of those",
  "findings in different words. If the list is complete, report nothing - an empty",
  "list is a real answer and a padded one costs the reader more than it gives.",
  "",
  "Do not report style, silkscreen or aesthetics, or anything you would have to",
  "guess at.",
  "",
  "",
  "The board data carries no current, load, power, temperature or timing figure.",
  "There is no supply current for any rail, no duty cycle and no ambient. A finding",
  "that depends on one of those depends on a number you would have to supply",
  "yourself, and supplying it is inventing evidence.",
  "",
  "Use the exact ref and net strings from the board so findings can be matched to",
  "the design. Reply with JSON only, in exactly this shape:",
  "",
  "{\"findings\": [{",
  "  \"severity\": \"critical\" | \"major\" | \"minor\",",
  "  \"refs\": [\"<ref>\", \"...\"],",
  "  \"nets\": [\"<net>\", \"...\"],",
  "  \"problem\": \"one line naming the defect\",",
  "  \"why\": \"one sentence on the consequence\",",
  "  \"fix\": \"one sentence naming the change that would correct it\"",
  "}]}",
  "",
  "Here is the board.",
  "",
  "",
].join("\n");

/**
 * The one reviewer, given the whole distilled board.
 *
 * Keeps the name the parity tests know it by. What they assert through it is
 * the invariant that matters: the page sends the same prompt the flat-prompt
 * detector sends, so the README's comparison is a statement about this page.
 */
function buildPrompt(distilled) {
  return SINGLE_PROMPT + distilled;
}

/**
 * The second look: the board again, plus the first pass's own findings.
 *
 * What it is shown is the reviewer's own output and nothing else - never the
 * rule findings, never a defect list. A second pass told where the
 * deterministic layer already looked is a second pass being handed the answer.
 */

  const gap = String.fromCharCode(10);

// ------------------------------------------------------------------- limits

// Everything below is mirrored in module memory as well as in localStorage.
// Storage can be missing or throw — a private window, blocked site data, an
// embedder — and when it did, the counter, the interval and the cache all read
// back empty, so three of the four limits stopped refusing anything: three
// clicks in one second made three live calls for the same untouched board.
// Memory alone does not survive a reload; storage does. Together they hold.
const memory = new Map();

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw !== null) return JSON.parse(raw);
  } catch {
    // fall through to the in-memory copy
  }
  return memory.has(key) ? memory.get(key) : fallback;
}

function writeJSON(key, value) {
  memory.set(key, value);
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    // Kept in memory only. The limits still hold for this page view; they just
    // reset when it is reloaded.
  }
}


/**
 * How many reviews this browser has run.
 *
 * Kept because the count is worth having, not because anything is refused when
 * it grows: the page used to stop after a fixed number per browser, which
 * punished the person exploring their own board hardest. What remains is the
 * cooldown, and that is not a quota - it stops a held-down button from
 * hammering a service that is already failing.
 */
const budget = {
  used() {
    return Number(readJSON(COUNT_KEY, 0)) || 0;
  },
  spend() {
    writeJSON(COUNT_KEY, this.used() + 1);
  },
};

// The interval lives in localStorage rather than in a module variable, so a
// reload does not hand the viewer a fresh ten seconds — and so two open copies
// of the page share one clock.
const LAST_KEY = "pcb-eval.lastReview.v1";

function coolingDownMs() {
  const last = Number(readJSON(LAST_KEY, 0)) || 0;
  return Math.max(0, Math.min(MIN_INTERVAL_MS, MIN_INTERVAL_MS - (Date.now() - last)));
}

// -------------------------------------------------------------------- grading

const norm = (value) => String(value || "").trim().toUpperCase().replace(/^\//, "");

/**
 * Match findings to edits by overlap of refs and nets, never by wording.
 *
 * `expected` is a list of {id, title, refs, nets} taken from what was actually
 * edited, so this grades a preset and a hand-made edit the same way.
 */
function grade(findings, expected) {
  const caught = [];
  const missed = [];
  const claimed = new Set();

  for (const want of expected) {
    const refs = new Set((want.refs || []).map(norm));
    const nets = new Set((want.nets || []).map(norm));
    const hit = findings.findIndex((finding, i) => {
      if (claimed.has(i)) return false;
      const fRefs = (finding.refs || []).map(norm);
      const fNets = (finding.nets || []).map(norm);
      return fRefs.some((r) => refs.has(r)) || fNets.some((n) => nets.has(n));
    });
    if (hit >= 0) {
      claimed.add(hit);
      caught.push({ expected: want, finding: findings[hit] });
    } else {
      missed.push(want);
    }
  }
  const other = findings.filter((_, i) => !claimed.has(i));
  return { caught, missed, other };
}

// --------------------------------------------------------------------- the call

/**
 * The review goes through a serverless function that holds the API key, so no
 * key reaches the browser and no visitor needs an account of their own.
 *
 * Same shape as the capability this replaces — a prompt in, parsed JSON out —
 * so runGraph never learns where the answer came from. The proxy does not
 * stream, so `onText` never fires and the panel holds its waiting state for the
 * whole call rather than filling in as it goes.
 */
async function getSample() {
  if (typeof window === "undefined" || typeof fetch !== "function") return null;
  return {
    json: async (prompt, opts = {}) => {
      let res;
      try {
        res = await fetch("/api/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
          signal: opts.signal,
        });
      } catch (e) {
        const err = new Error("The review service could not be reached.");
        err.code = e && e.name === "AbortError" ? "cancelled" : "upstream_error";
        throw err;
      }
      const body = await res.json().catch(() => null);
      if (!res.ok || !body || body.error) {
        const err = new Error(
          (body && body.message) || `Review failed (HTTP ${res.status}).`
        );
        err.code = (body && body.code) || "upstream_error";
        throw err;
      }
      return body.result;
    },
  };
}

/**
 * The one place the page asks the model anything.
 *
 * Everything that talks to the service comes through here - the review graph
 * and the datasheet agent both - so there is a single point where an error
 * becomes a `ReviewUnavailable` with a code the interface can turn into copy,
 * and a single place to change when the calling convention does.
 *
 * `tests.run 10` counts the call sites and expects exactly one. The rule it is
 * really enforcing is that the page never calls on load: a visitor who opens it
 * to look at a board has not asked for anything to be spent. Both callers here
 * are started by something a person did - pressing the button, dropping a PDF
 * on a part - which is the rule, and one choke point is how it stays checkable.
 */
async function askModel(sample, prompt, opts = {}) {
  try {
    return await sample.json(prompt, {
      modelTier: "default",
      cache: true,
      onText: opts.onText,
      signal: opts.signal,
    });
  } catch (error) {
    throw new ReviewUnavailable(error?.code || "upstream_error", error?.message || String(error));
  }
}

class ReviewUnavailable extends Error {
  constructor(code, message) {
    super(message);
    this.code = code;
  }
}

/**
 * Review the board as it stands.
 *
 * Returns {findings, cached, hash, tokens}. Throws ReviewUnavailable with a
 * code the caller turns into copy: `cooldown`, `capped`, `unavailable`, or one
 * of the capability's own codes.
 */
/**
 * Review the board as it stands, by running the graph.
 *
 * The four limits are enforced here, once per review — not once per model call.
 * A review is four calls, or eight when the gate loops, and the viewer pays for
 * all of them, which is the reason the cap is small.
 */
async function review(sample, board, { onStep, signal } = {}) {
  const hash = await boardHash(board);
  // No cache. Reviewing the same board twice used to replay the first answer,
  // which is defensible while a call is being paid for by the page and is not
  // what anyone pressing the button a second time is asking for - a reviewer
  // that returns the same words is not evidence that the words were right, and
  // this model does not return the same words twice anyway.

  if (!sample) throw new ReviewUnavailable("unavailable", "The review service is not reachable.");
  const cooling = coolingDownMs();
  if (cooling > 0) {
    throw new ReviewUnavailable("cooldown", `Another review in ${Math.ceil(cooling / 1000)}s.`);
  }
  // The cooldown starts now, so a failing service cannot be hammered. The
  // session count is spent only once a review actually completes: the server
  // enforces the limits that matter, and charging a visitor for the server's
  // own outage would lock them out for something they did not do.
  writeJSON(LAST_KEY, Date.now());

  const ask = (prompt, opts = {}) => askModel(sample, prompt, opts);

  const result = await runGraph(board, ask, { onStep, signal });
  budget.spend();
  const verdict = {
    findings: result.findings.map((finding) => ({
      severity: finding.severity,
      source: finding.source,
      refs: finding.refs,
      nets: finding.nets,
      title: finding.title,
      why: finding.why,
      fix: finding.fix,
    })),
    dropped: result.dropped.map((d) => ({ title: d.title, because: d.dropped })),
    rules: result.rules,
    steps: result.steps.map((step) => ({ ...step, stream: "" })),
    passes: result.passes,
    stopped: result.stopped,
    proposed: result.proposed.length,
    prompt: PROMPT_ID,
    at: new Date().toISOString(),
  };
  return { ...verdict, hash };
}

// The page. One Board object, three views of it, an edit log, and a review.
//
// Every edit goes through site/ops.js, which is the same nine operations as
// harness/ops.py. Nothing here reaches into the board directly, so the edit log
// is a complete record and undo is just replaying it backwards.












const $ = (id) => document.getElementById(id);
const clone = (value) => JSON.parse(JSON.stringify(value));

const SAMPLE = JSON.parse($("board-data").textContent);

// The board the page is currently working on, and the one Reset goes back to.
// It starts as the sample and is replaced whole when a project is loaded.
let ORIGINAL = SAMPLE;
let custom = null;

const state = {
  board: clone(SAMPLE),
  log: [],
  view: "routing",
  selection: null,
  sample: null,
  verdict: null,
  reviewError: null,
  focused: null,
  divergence: { stale: [], stranded: [] },
  //: The graph's steps as they happen, so the page can show it running.
  steps: [],
  reviewing: false,
  //: The first half of a pin swap, waiting for the pin to swap it with.
  armed: null,
};

let panzoom = null;
let keptView = null;

// --------------------------------------------------------------------- views

function currentSvg() {
  return $("stage").firstElementChild;
}

function drawView({ keepZoom = true } = {}) {
  const stage = $("stage");
  if (keepZoom && panzoom) keptView = panzoom.view;
  stage.textContent = "";

  // One view: the board with its copper. The schematic and bare-layout views
  // were dropped — a schematic here was KiCad's picture, which cannot be edited
  // and cannot be produced for a board someone uploads, and layout was routing
  // with the interesting half switched off.
  const svg = renderBoard(state.board, { copper: true });
  svg.dataset.view = "board";
  stage.appendChild(svg);

  // The count on the Docs tab comes from what is in memory, so a board whose
  // documents are still being read updates a moment later. Nothing is drawn on
  // the board itself: a mark per part was a second object over the copper that
  // could only ever answer for one part at a time.
  loadDocs(state.board.meta.name).then(renderDocs);
  panzoom = attachPanZoom(svg, {
    onPointerDown: startDrag,
    onTap: (target) => select(target ? describe(target) : null),
  });
  if (keepZoom && keptView && keptView.w) {
    svg.setAttribute(
      "viewBox",
      `${keptView.x} ${keptView.y} ${keptView.w} ${keptView.h}`
    );
  }
  applySelectionToSvg();
  paintMarks();
  return svg;
}

function describe(node) {
  const { kind, ref, id, pad, net } = node.dataset;
  if (kind === "symbol" || kind === "footprint") return { kind: "part", ref };
  if (kind === "pad") return { kind: "pad", ref, pad, net };
  return { kind, id, net };
}

// ------------------------------------------------------------------ dragging

function startDrag(event, target, at) {
  const group = target.closest('[data-kind="footprint"]');
  if (!group) return false;

  const fp = findFootprint(state.board, group.dataset.ref);
  const grab = { dx: fp.x - at.x, dy: fp.y - at.y, x0: fp.x, y0: fp.y, ref: fp.ref };
  let moved = false;
  const svg = currentSvg();

  const move = (moveEvent) => {
    const now = panzoom.toBoard(moveEvent);
    const nx = now.x + grab.dx;
    const ny = now.y + grab.dy;
    if (!moved && Math.hypot(nx - grab.x0, ny - grab.y0) < 0.05) return;
    moved = true;
    // Preview by moving the group; the operation is recorded once, on release,
    // so a drag is one entry in the log rather than two hundred.
    fp.x = nx;
    fp.y = ny;
    group.setAttribute(
      "transform",
      `translate(${nx.toFixed(3)} ${ny.toFixed(3)})` + (fp.rot ? ` rotate(${(-fp.rot).toFixed(3)})` : "")
    );
  };

  const up = () => {
    svg.removeEventListener("pointermove", move);
    svg.removeEventListener("pointerup", up);
    svg.removeEventListener("pointercancel", up);
    const [x, y] = [fp.x, fp.y];
    fp.x = grab.x0;
    fp.y = grab.y0;
    if (moved) record({ op: "move_footprint", args: { ref: grab.ref, x, y } });
    else select({ kind: "part", ref: grab.ref });
  };

  svg.setPointerCapture(event.pointerId);
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerup", up);
  svg.addEventListener("pointercancel", up);
  return true;
}

// -------------------------------------------------------------- edit plumbing

/**
 * Operations that set a value rather than change it by one.
 *
 * Each of these carries the whole new state in its arguments, so a run of them
 * against one target can be collapsed to the last: replaying `rotated to 270`
 * lands where replaying 90, 180, 270 lands. That is what makes the collapse
 * safe to do to the log itself rather than only to the display - the log is the
 * edit list, and it still has to reproduce the board.
 */
const ABSOLUTE = new Set(["set_value", "move_footprint", "rotate_footprint", "move_pin"]);

/** What an edit is about, so two edits to the same thing can be recognised. */
const target = (entry) =>
  `${entry.op}:${entry.args.ref || ""}:${entry.args.pin || ""}`;

function record(edit) {
  try {
    const entry = applyEdit(state.board, edit);
    const last = state.log[state.log.length - 1];
    if (
      last &&
      ABSOLUTE.has(entry.op) &&
      target(last) === target(entry)
    ) {
      // Undo has to reach the state before the run began, not before its last
      // step, so the older entry's record of what it replaced survives and the
      // newer one's is dropped.
      state.log[state.log.length - 1] = {
        ...entry,
        from_net: last.from_net ?? entry.from_net,
        from_value: last.from_value ?? entry.from_value,
        from_xy: last.from_xy ?? entry.from_xy,
        from_rot: last.from_rot ?? entry.from_rot,
      };
    } else {
      state.log.push(entry);
    }
  } catch (error) {
    flash(error.message);
    return false;
  }
  state.verdict = null;
  state.focused = null;
  state.reviewError = null;
  afterChange();
  return true;
}

function afterChange() {
  $("board-stats").textContent = summarise(state.board);
  drawView();
  renderLog();
  renderInspector();
  renderReview();
}

function undoLast() {
  if (!state.log.length) return;
  undo(state.board, state.log);
  state.verdict = null;
  afterChange();
}

function resetBoard() {
  state.board = clone(ORIGINAL);
  state.log = [];
  state.verdict = null;
  state.reviewError = null;
  state.focused = null;
  state.selection = null;
  afterChange();
}

/**
 * Swap in a board read from the visitor's own files.

 */
function loadBoard(board, notes = [], files = null) {
  ORIGINAL = board || SAMPLE;
  custom = board ? { notes, files, name: board.meta.name } : null;
  state.board = clone(ORIGINAL);
  state.log = [];
  state.verdict = null;
  state.reviewError = null;
  state.focused = null;
  state.selection = null;

function renderSource() {
  const panel = $("source");
  const stats = state.board.layout;
  // Both labels come from the board that is loaded. The sample used to be

  $("board-id").textContent = custom ? custom.name : "";

  if (!custom) {
    panel.innerHTML = `<p class="muted">${escapeHtml(summarise(state.board))}</p>`;
  } else {
    panel.innerHTML = `

// ------------------------------------------------------------------ selection

function select(selection) {
  state.armed = null;
  state.selection = selection;
  applySelectionToSvg();
  renderInspector();
}

function applySelectionToSvg() {
  const svg = currentSvg();
  if (!svg) return;
  for (const node of svg.querySelectorAll(".selected")) node.classList.remove("selected");
  const sel = state.selection;
  if (!sel) {
    highlightNets(svg, []);
    return;
  }
  let nets = [];
  if (sel.kind === "part") {
    for (const node of svg.querySelectorAll(`[data-ref="${cssEscape(sel.ref)}"]`)) {
      node.classList.add("selected");
    }
    nets = netsOf(sel.ref);
  } else if (sel.kind === "pad") {
    for (const node of svg.querySelectorAll(
      `[data-ref="${cssEscape(sel.ref)}"][data-pad="${cssEscape(sel.pad)}"]`
    )) {
      node.classList.add("selected");
    }
    nets = [sel.net];
  } else {
    for (const node of svg.querySelectorAll(`[data-id="${cssEscape(sel.id)}"]`)) {
      node.classList.add("selected");
    }
    nets = [sel.net];
  }
  highlightNets(svg, nets);
}

const cssEscape = (value) => String(value).replace(/["\\]/g, "\\$&");

function netsOf(ref) {
  const out = [];
  for (const net of state.board.nets) {
    if (net.nodes.some((n) => n.ref === ref)) out.push(net.name);
  }
  return out;
}

function pinsOf(ref) {
  const out = [];
  for (const net of state.board.nets) {
    for (const node of net.nodes) {
      if (node.ref === ref) out.push({ ...node, net: net.name });
    }
  }
  return out.sort((a, b) => (a.pin.length - b.pin.length) || (a.pin < b.pin ? -1 : 1));
}
