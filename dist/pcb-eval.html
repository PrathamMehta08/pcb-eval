    const [, zone] = byId(board.layout.zones, zone_id, "zone");
    const nowOff = !zone.disabled;
    if (nowOff) zone.disabled = true;
    else delete zone.disabled;
    return {
      op: "toggle_zone",
      args: { zone_id },
      disabled: nowOff,
      label: `${nowOff ? "removed" : "restored"} ${zone.net || "unnamed"} pour on ${zone.layer}`,
    };
  },
};

const UNDOS = {
  move_pin(board, entry) {
    const { ref, pin } = entry.args;
    const [net, node] = findNode(board, ref, pin);
    const home = findNet(board, entry.from_net);
    if (!home) throw new OpError(`net ${entry.from_net} vanished; cannot undo`);
    net.nodes.splice(net.nodes.indexOf(node), 1);
    home.nodes.splice(entry.from_index ?? home.nodes.length, 0, node);
    if (entry.created_net && net.nodes.length === 0) {
      board.nets.splice(board.nets.indexOf(net), 1);
    }
  },
  swap_pins(board, entry) {
    OPS.swap_pins(board, entry.args); // a swap is its own inverse
  },
  set_value(board, entry) {
    findComponent(board, entry.args.ref).value = entry.from_value;
  },
  move_footprint(board, entry) {
    const fp = findFootprint(board, entry.args.ref);
    [fp.x, fp.y] = entry.from_xy;
  },
  rotate_footprint(board, entry) {
    findFootprint(board, entry.args.ref).rot = entry.from_rot;
  },
  delete_track(board, entry) {
    board.layout.tracks.splice(entry.index, 0, entry.track);
  },
  set_track_width(board, entry) {
    const [, track] = byId(board.layout.tracks, entry.args.track_id, "track");
    track.width = entry.from_width;
  },
  delete_via(board, entry) {
    board.layout.vias.splice(entry.index, 0, entry.via);
  },
  toggle_zone(board, entry) {
    OPS.toggle_zone(board, entry.args); // a toggle is its own inverse
  },
};

function applyEdit(board, edit) {
  const fn = OPS[edit.op];
  if (!fn) throw new OpError(`unknown operation ${edit.op}`);
  return fn(board, edit.args || {});
}

function applyEdits(board, edits) {
  return edits.map((edit) => applyEdit(board, edit));
}

function undo(board, log) {
  if (!log.length) return null;
  const entry = log.pop();
  UNDOS[entry.op](board, entry);
  return entry;
}

// -------------------------------------------------------------------- hashing

// harness/ops.py `round4` is written to match this exactly. Do not change one
// without the other: the board hash is the review cache key.
function round4(value) {
  return Math.round(Number(value) * 1e4) / 1e4;
}

function mod360(deg) {
  return ((Number(deg) % 360) + 360) % 360;
}

function trim(value) {
  return String(Number(value));
}

// The one millimetre format, agreed with harness/ops.py `mm()`. JSON is not a
// usable basis for a cross-language hash — Python writes 61.0 where JavaScript
// writes 61 — but a fixed four-decimal string is identical in both.
function mm(value) {
  let number = Number(value);
  if (Math.abs(number) < 5e-5) number = 0;
  return number.toFixed(4);
}

function canonical(board) {
  const layout = board.layout;
  const lines = [`size ${mm(layout.size.w)} ${mm(layout.size.h)}`];
  const by = (key) => (a, b) => (a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0);

  for (const c of [...board.components].sort(by("ref"))) {
    lines.push(`C ${c.ref} ${c.value} ${c.footprint}`);
  }
  for (const net of [...board.nets].sort(by("name"))) {
    const nodes = net.nodes.map((n) => `${n.ref}.${n.pin}`).sort();
    lines.push(`N ${net.name} ${nodes.join(" ")}`);
  }
  for (const f of [...layout.footprints].sort(by("ref"))) {
    lines.push(`F ${f.ref} ${mm(f.x)} ${mm(f.y)} ${mm(f.rot)} ${f.layer}`);
  }
  for (const t of [...layout.tracks].sort(by("id"))) {
    lines.push(
      `T ${t.id} ${mm(t.x1)} ${mm(t.y1)} ${mm(t.x2)} ${mm(t.y2)} ${mm(t.width)} ${t.layer} ${t.net}`
    );
  }
  for (const v of [...layout.vias].sort(by("id"))) {
    lines.push(`V ${v.id} ${mm(v.x)} ${mm(v.y)} ${mm(v.size)} ${mm(v.drill)} ${v.net}`);
  }
  for (const z of [...layout.zones].sort(by("id"))) {
    lines.push(`Z ${z.id} ${z.net} ${z.layer} ${z.disabled ? "off" : "on"}`);
  }
  return lines.join("\n");
}

// Python sorts strings by code point and so does JavaScript's default `<`, but
// `Array.prototype.sort` on ids like t1, t10, t2 is lexicographic in both, so
// the orders agree. The 16 hex characters match `harness.ops.board_hash`.
async function boardHash(board) {
  const bytes = new TextEncoder().encode(canonical(board));
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)]
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("")
    .slice(0, 16);
}

// ===== site/distill.js ================================================

// Board -> the text a reviewer reads. The mirror of harness/distill.py.
//
// The page has to send the board as the visitor just broke it, so the distiller
// has to run here. tests/fixtures/distill.json pins this against the Python:
// same board, same text, character for character, for the clean board and for
// all seven presets.



const PROMPT_VERSION = "distill-1";

const PACKAGE_TAIL = /^[^:]*:/;
const METRIC_IMPERIAL = /^[RCLD](?:_LED)?_(\d{4})_\d+Metric$/;
const HEADER = /^PinHeader_(\d+x\d+)_P([\d.]+)mm.*$/;
const LIB_BOILERPLATE =
  /(,?\s*script generated[\s\S]*$)|(^Generic connector,\s*)|(\s*\(kicad-library-utils[\s\S]*\)$)/gi;
// What is left of a pin header's description once the boilerplate is gone —
// and the package column already says 1x04hdr1.00mm.
const SAYS_NOTHING = /^single row,\s*\d+x\d+$/i;

const PIN_KIND = {
  power_in: "pwr-in",
  power_out: "pwr-out",
  open_collector: "oc",
  bidirectional: "",
  input: "in",
  output: "out",
  passive: "",
  tri_state: "tri",
  unspecified: "?",
};


/**
 * A rough token count.
 *
 * Not the usual four characters per token: this text is dense mono — net names,
 * designators, columns of numbers — and tokenises much finer. Measured against
 * the Python's tiktoken count on the real board, 5,045 characters come to 2,918
 * tokens, so the divisor is calibrated rather than assumed.
 */
function approxTokens(text) {
  return Math.ceil(text.length / 1.73);
}

function packageName(footprint) {
  let tail = String(footprint || "").replace(PACKAGE_TAIL, "");
  const imperial = tail.match(METRIC_IMPERIAL);
  if (imperial) return imperial[1];
  const header = tail.match(HEADER);
  if (header) return `${header[1]}hdr${header[2]}mm`;
  tail = tail.replace(/_[\d.]+x[\d.]+mm.*$/, "");
  tail = tail.replace(/^MountingHole_/, "M-hole ");
  return tail || "-";
}

function shorten(text, words = 10) {
  const trimmed = String(text || "")
    .replace(LIB_BOILERPLATE, "")
    .replace(/^[\s,]+|[\s,]+$/g, "");
  if (SAYS_NOTHING.test(trimmed)) return "";
  const parts = trimmed.split(/\s+/).filter(Boolean);
  if (parts.length <= words) return parts.join(" ");
  return parts.slice(0, words).join(" ") + "…";
}

function nodeText(node) {
  let fn = node.function || "";
  const suffix = `_${node.pin}`;
  if (fn.endsWith(suffix)) fn = fn.slice(0, -suffix.length);
  if (!fn || fn.toLowerCase() === `pin_${node.pin}`.toLowerCase() || fn === node.pin) fn = "";
  const raw = baseType(node.type);
  const kind = raw in PIN_KIND ? PIN_KIND[raw] : raw;
  const inner = [fn, kind].filter(Boolean).join(",");
  return `${node.ref}.${node.pin}` + (inner ? `(${inner})` : "");
}

// Python sorts tuples; these comparators reproduce the same orders.
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const byRefThenPin = (a, b) => cmp(a.ref, b.ref) || cmp(a.pin, b.pin);
const byDesignator = (a, b) =>
  cmp(a.ref[0], b.ref[0]) || a.ref.length - b.ref.length || cmp(a.ref, b.ref);

function componentsSection(board) {
  const lines = ["COMPONENTS  ref(s), value, package, description"];
  // Keyed on value plus package and insertion-ordered, like the Python's
  // list. The key is never split back apart: a value may contain a space.
  const grouped = new Map();
  for (const comp of [...board.components].sort(byDesignator)) {
    const pkg = packageName(comp.footprint);
    const value = comp.value || "-";
    if (/^(R|C|L|H|TP)/.test(comp.ref)) {
      const key = value + " " + pkg;
      if (!grouped.has(key)) grouped.set(key, { value, pkg, refs: [] });
      grouped.get(key).refs.push(comp.ref);
      continue;
    }
    let row = `${comp.ref} ${value} ${pkg}`;
    const description = shorten(comp.description);
    if (description) row += `  ${description}`;
    lines.push(row);
  }
  for (const group of grouped.values()) {
    lines.push(`${group.refs.join(",")} ${group.value} ${group.pkg}`);
  }
  return lines;
}

function netsSection(board) {
  const lines = [
    "NETS  name: ref.pin(pin name, type). Type is omitted where it is " +
      "passive or bidirectional.",
  ];
  const unconnected = [];
  for (const net of [...board.nets].sort((a, b) => cmp(a.name, b.name))) {
    if (net.name.startsWith("unconnected-")) {
      // Just the pin: see the note in harness/distill.py.
      unconnected.push(...net.nodes.map((n) => `${n.ref}.${n.pin}`));
      continue;
    }
    const nodes = [...net.nodes].sort(byRefThenPin).map(nodeText).join(" ");
    lines.push(`${net.name}: ${nodes}`);
  }
  if (unconnected.length) {
    lines.push(
      "UNCONNECTED pins, each its own net named unconnected-(REF-NAME-PadNUM):"
    );
    lines.push(unconnected.sort().join(" "));
  }
  return lines;
}

const trackLength = (t) => Math.hypot(t.x2 - t.x1, t.y2 - t.y1);

function copperSection(board) {
  const layout = board.layout;
  const groups = islands(board);

  const pads = new Map();
  for (const item of copperItems(board)) {
    if (item.kind === "pad" && item.net) pads.set(item.net, (pads.get(item.net) || 0) + 1);
  }
  const tracks = new Map();
  for (const track of layout.tracks) {
    if (!tracks.has(track.net)) tracks.set(track.net, []);
    tracks.get(track.net).push(track);
  }
  const vias = new Map();
  for (const via of layout.vias) vias.set(via.net, (vias.get(via.net) || 0) + 1);
  const pours = new Map();
  for (const zone of layout.zones) {
    if (zone.disabled) continue;
    if (!pours.has(zone.net)) pours.set(zone.net, []);
    pours.get(zone.net).push(zone.layer);
  }

  const lines = [
    `COPPER  board ${layout.size.w.toFixed(0)} x ${layout.size.h.toFixed(0)} mm, two layers: F.Cu top, B.Cu bottom`,
    "net, pads, copper islands, track mm, narrowest mm, vias, pours",
  ];
  const names = new Set([...pads.keys(), ...tracks.keys(), ...vias.keys(), ...pours.keys()]);
  for (const net of [...names].sort(cmp)) {
    if (!net || net.startsWith("unconnected-")) continue;
    const segs = tracks.get(net) || [];
    const total = segs.reduce((sum, t) => sum + trackLength(t), 0);
    const narrowest = segs.length ? Math.min(...segs.map((t) => t.width)) : 0;
    const islandCount = (groups.get(net) || []).filter((g) =>
      g.some((i) => i.kind === "pad")
    ).length;
    lines.push(
      [
        net,
        String(pads.get(net) || 0),
        String(islandCount),
        segs.length ? total.toFixed(0) : "none",
        segs.length ? narrowest.toFixed(2) : "-",
        String(vias.get(net) || 0),
        pours.has(net) ? [...pours.get(net)].sort(cmp).join("+") : "none",
      ].join(" ")
    );
  }
  return lines;
}

function decouplingSection(board) {
  // How far each supply pin is from the nearest capacitor on its own net. See
  // harness/distill.py for why this replaced a placement section keyed on what
  // had just been edited.
  const layout = board.layout;
  const pads = [];
  for (const fp of layout.footprints) {
    for (const pad of fp.pads) {
      if (!pad.net) continue;
      const [dx, dy] = place(pad.x, pad.y, fp.rot);
      pads.push({ ref: fp.ref, num: pad.num, net: pad.net, x: fp.x + dx, y: fp.y + dy });
    }
  }
  const caps = pads.filter((p) => p.ref.startsWith("C"));

  const rows = [];
  for (const net of board.nets) {
    for (const node of net.nodes) {
      if (!/^[US]\d+$/.test(node.ref)) continue;
      if (!["power_in", "power_out"].includes(baseType(node.type))) continue;
      const here = pads.find((p) => p.ref === node.ref && p.num === node.pin);
      if (!here) continue;
      let best = null;
      for (const cap of caps) {
        if (cap.net !== net.name) continue;
        const distance = Math.hypot(here.x - cap.x, here.y - cap.y);
        if (!best || distance < best[0] || (distance === best[0] && cap.ref < best[1])) {
          best = [distance, cap.ref];
        }
      }
      let fn = node.function || "";
      const suffix = `_${node.pin}`;
      if (fn.endsWith(suffix)) fn = fn.slice(0, -suffix.length);
      const label = `${node.ref}.${node.pin}` + (fn ? `(${fn})` : "");
      rows.push(
        best
          ? `${label} ${net.name} ${best[1]} ${best[0].toFixed(1)}`
          : `${label} ${net.name} none -`
      );
    }
  }
  if (!rows.length) return [];
  return [
    "DECOUPLING  supply pin, its net, the nearest capacitor on that net, mm away",
    ...rows.sort(cmp),
  ];
}

function distill(board) {
  const blocks = [
    [
      `BOARD ${board.meta.name}`,
      `${board.components.length} components, ${board.nets.length} nets, ` +
        `${board.layout.footprints.length} footprints.`,
    ],
    componentsSection(board),
    netsSection(board),
    copperSection(board),
    decouplingSection(board),
  ];
  return blocks
    .filter((block) => block.length)
    .map((block) => block.join("\n"))
    .join("\n\n");
}

// ===== site/packs.js ==================================================

/**
 * The one thing a model is shown about the board, in the browser.
 *
 * V8 has a single reviewer holding the whole board, so there is a single pack.
 * It used to be two - a circuit pack with no geometry and a physical pack with
 * no pin semantics - and the split was removed because five sweeps said it cost
 * recall: a reviewer holding half a board speculates about the other half.
 *
 * ONE DIFFERENCE FROM THE HARNESS, AND IT IS DELIBERATE
 *
 * The harness runs its sweeps offline, so its reviewer pack is the distilled
 * board and nothing else. The page can have more: if someone has attached a
 * datasheet to a part, what was read out of it goes in here. That is the whole
 * point of attaching one, and it is why the page's review can be better than
 * the sweep's on a board whose parts are documented.
 *
 * Both blocks are empty for a board nobody has attached anything to, which is
 * the ordinary state, and then the pack is exactly the distilled board.
 */




const PACK_VERSION = "2";

const join = (blocks) =>
  blocks.filter((b) => b && b.length).map((b) => b.join("\n")).join("\n\n");

/**
 * What the reviewer reads: the board, then whatever its documents state.
 *
 * Nothing here describes what is wrong with the board. The deterministic
 * findings are deliberately absent - naming them told the reviewer which
 * categories to skip and cost more recall than the duplicate findings it saved,
 * and on a seeded board it is the answer.
 */
function reviewerPack(board) {
  return join([
    [distill(board)],
    railBlock(board),
    factsBlock(board),
    passagesBlock(board),
  ]);
}

/**
 * What each supply rail can carry, for every rail on the board.
 *
 * Every rail, not the interesting ones. A section listing only the rails
 * something is wrong with is a section that says which rail is wrong, and on a
 * seeded board that is the answer. Uniform or absent is the rule the whole pack
 * is built on.
 */
function railBlock(board) {
  const rails = railCapacity(board);
  if (!rails.length) return [];
  return [
    "RAIL CAPACITY  narrowest segment per supply rail, at 1 oz copper, outer layer, 10 C rise",
    ...rails.map((r) => `${r.net}: ${r.width_mm} mm carries about ${r.amps} A`),
  ];
}

// ===== site/kicad.js ==================================================

// Read a KiCad project in the browser, with no server and no kicad-cli.
//
// The Python extractor gets its net list from
// `kicad-cli sch export netlist --format kicadxml`, which is not available to a
// page. It does not need to be: every pad in a `.kicad_pcb` already carries
// `(net "NAME")`, `(pinfunction "VBST_6")` and `(pintype "power_in")` — the
// three things that make a net list worth reading. So the nets are derived from
// the copper itself, which is also the more honest source for a tool whose
// whole argument is that the copper is what matters.
//
// The one thing the board cannot supply is designators. A footprint's
// `Reference` property holds the *silkscreen* label, and on the board this
// project was built from, eleven of fifty-three say things like `LIN REG` and
// `BUCK`. The real designator lives in the schematic, and the two are joined on
// the UUID each footprint carries as `(path "/<uuid>")`. That is why an upload
// wants both files.
//
// Everything here mirrors extract/sexpr.py, extract/layout.py and
// extract/schematic.py, and produces the same Board shape those do.

// ------------------------------------------------------------------ s-expr

/** A string that was quoted in the source, so `"1"` is not the atom `1`. */
class Str extends String {}

function tokenize(text) {
  const out = [];
  const n = text.length;
  let i = 0;
  while (i < n) {
    const c = text[i];
    if (c === " " || c === "\t" || c === "\r" || c === "\n") {
      i += 1;
    } else if (c === "(" || c === ")") {
      out.push(c);
      i += 1;
    } else if (c === '"') {
      i += 1;
      let s = "";
      while (i < n) {
        const ch = text[i];
        if (ch === "\\" && i + 1 < n) {
          const next = text[i + 1];
          s += next === "n" ? "\n" : next === "t" ? "\t" : next === "r" ? "\r" : next;
          i += 2;
        } else if (ch === '"') {
          i += 1;
          break;
        } else {
          s += ch;
          i += 1;
        }
      }
      out.push(new Str(s));
    } else {
      const start = i;
      while (i < n && !" \t\r\n()".includes(text[i])) i += 1;
      out.push(text.slice(start, i));
    }
  }
  return out;
}

function parseSexpr(text) {
  const stack = [];
  let root = null;
  for (const token of tokenize(text)) {
    if (token === "(") {
      const node = [];
      if (stack.length) stack[stack.length - 1].push(node);
      stack.push(node);
    } else if (token === ")") {
      if (!stack.length) throw new Error("closes a list that was never opened");
      const node = stack.pop();
      if (!stack.length) {
        if (root) throw new Error("more than one top-level form");
        root = node;
      }
    } else if (stack.length) {
      stack[stack.length - 1].push(token);
    } else {
      throw new Error(`atom ${token} outside any list`);
    }
  }
  if (stack.length) throw new Error(`${stack.length} list(s) left open`);
  if (!root) throw new Error("empty file");
  return root;
}

const sxTag = (node) =>
  Array.isArray(node) && node.length && typeof node[0] === "string" && !(node[0] instanceof Str)
    ? node[0]
    : "";

function* sxChildren(node, name) {
  if (!Array.isArray(node)) return;
  for (let i = 1; i < node.length; i++) if (sxTag(node[i]) === name) yield node[i];
}

function sxChild(node, name) {
  for (const found of sxChildren(node, name)) return found;
  return null;
}

function sxValue(node, name, index = 1, fallback = null) {
  const found = sxChild(node, name);
  if (!found || found.length <= index) return fallback;
  return found[index];
}

const sxNum = (v, fallback = 0) => {
  const parsed = Number(v);
  return Number.isFinite(parsed) ? parsed : fallback;
};

const sxStr = (v) => (v === null || v === undefined ? "" : String(v));

// ------------------------------------------------------------------ geometry

function sxAt(node, fallback = [0, 0, 0]) {
  const found = sxChild(node, "at");
  if (!found) return fallback;
  return [
    found.length > 1 ? sxNum(found[1]) : fallback[0],
    found.length > 2 ? sxNum(found[2]) : fallback[1],
    found.length > 3 ? sxNum(found[3]) : 0,
  ];
}

function layersOf(node) {
  const found = sxChild(node, "layers");
  if (!found) {
    const one = sxValue(node, "layer");
    return one === null ? [] : [sxStr(one)];
  }
  return found.slice(1).filter((v) => typeof v === "string" || v instanceof Str).map(sxStr);
}

/** Net names are quoted in KiCad 9+; older files carry an index first. */
function netOf(node) {
  const found = sxChild(node, "net");
  if (!found || found.length < 2) return "";
  for (let i = 1; i < found.length; i++) if (found[i] instanceof Str) return sxStr(found[i]);
  return "";
}

function propertyOf(node, name) {
  for (const prop of sxChildren(node, "property")) {
    if (prop.length > 1 && sxStr(prop[1]) === name) return prop.length > 2 ? sxStr(prop[2]) : "";
  }
  return "";
}

// ------------------------------------------------------------------- the pcb

function parseOutline(doc) {
  const out = [];
  for (let i = 1; i < doc.length; i++) {
    const node = doc[i];
    const t = sxTag(node);
    if (!["gr_line", "gr_arc", "gr_circle", "gr_rect"].includes(t)) continue;
    if (sxStr(sxValue(node, "layer", 1, "")) !== "Edge.Cuts") continue;
    const [sx, sy] = [sxNum(sxValue(node, "start", 1)), sxNum(sxValue(node, "start", 2))];
    const [ex, ey] = [sxNum(sxValue(node, "end", 1)), sxNum(sxValue(node, "end", 2))];
    if (t === "gr_arc") {
      out.push({
        kind: "arc", x1: sx, y1: sy, x2: ex, y2: ey,
        mx: sxNum(sxValue(node, "mid", 1)), my: sxNum(sxValue(node, "mid", 2)),
      });
    } else if (t === "gr_circle") {
      out.push({ kind: "circle", x: sx, y: sy, r: Math.hypot(ex - sx, ey - sy) });
    } else if (t === "gr_rect") {
      out.push({ kind: "rect", x1: sx, y1: sy, x2: ex, y2: ey });
    } else {
      out.push({ kind: "line", x1: sx, y1: sy, x2: ex, y2: ey });
    }
  }
  return out;
}

function outlineBox(outline) {
  if (!outline.length) throw new Error("the board has no Edge.Cuts outline");
  const xs = [];
  const ys = [];
  for (const item of outline) {
    if (item.kind === "circle") {
      xs.push(item.x - item.r, item.x + item.r);
      ys.push(item.y - item.r, item.y + item.r);
      continue;
    }
    xs.push(item.x1, item.x2);
    ys.push(item.y1, item.y2);
    if (item.kind === "arc") {
      xs.push(item.mx);
      ys.push(item.my);
    }
  }
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

function padsOf(fp) {
  const pads = [];
  for (const pad of sxChildren(fp, "pad")) {
    const [x, y, rot] = sxAt(pad);
    pads.push({
      num: pad.length > 1 ? sxStr(pad[1]) : "",
      kind: pad.length > 2 ? sxStr(pad[2]) : "",
      shape: pad.length > 3 ? sxStr(pad[3]) : "",
      x, y, rot,
      w: sxNum(sxValue(pad, "size", 1)),
      h: sxNum(sxValue(pad, "size", 2)),
      drill: sxChild(pad, "drill") ? sxNum(sxValue(pad, "drill", 1)) : 0,
      layers: layersOf(pad),
      net: netOf(pad),
      function: sxStr(sxValue(pad, "pinfunction", 1, "")),
      type: sxStr(sxValue(pad, "pintype", 1, "")),
    });
  }
  return pads;
}

const DRAWN_LAYERS = ["F.SilkS", "B.SilkS", "F.Fab", "B.Fab"];

function graphicsOf(fp) {
  const out = [];
  for (let i = 1; i < fp.length; i++) {
    const node = fp[i];
    const t = sxTag(node);
    if (!["fp_line", "fp_arc", "fp_circle", "fp_rect", "fp_poly"].includes(t)) continue;
    const layer = sxStr(sxValue(node, "layer", 1, ""));
    if (!DRAWN_LAYERS.includes(layer)) continue;
    if (t === "fp_poly") {
      const pts = sxChild(node, "pts");
      if (!pts) continue;
      out.push({
        kind: "poly", layer,
        pts: [...sxChildren(pts, "xy")].map((p) => [sxNum(p[1]), sxNum(p[2])]),
      });
      continue;
    }
    const item = {
      kind: t.slice(3), layer,
      x1: sxNum(sxValue(node, "start", 1)), y1: sxNum(sxValue(node, "start", 2)),
      x2: sxNum(sxValue(node, "end", 1)), y2: sxNum(sxValue(node, "end", 2)),
    };
    if (t === "fp_arc") {
      item.mx = sxNum(sxValue(node, "mid", 1));
      item.my = sxNum(sxValue(node, "mid", 2));
    }
    if (t === "fp_circle") item.r = Math.hypot(item.x2 - item.x1, item.y2 - item.y1);
    out.push(item);
  }
  return out;
}

function parsePcb(text) {
  const doc = parseSexpr(text);
  if (sxTag(doc) !== "kicad_pcb") throw new Error("this is not a .kicad_pcb file");

  const outline = parseOutline(doc);
  const [minX, minY, maxX, maxY] = outlineBox(outline);

  const footprints = [...sxChildren(doc, "footprint")].map((fp) => {
    const [x, y, rot] = sxAt(fp);
    return {
      uuid: sxStr(sxValue(fp, "path", 1, "")).replace(/^\//, ""),
      fp_uuid: sxStr(sxValue(fp, "uuid", 1, "")),
      library: fp.length > 1 ? sxStr(fp[1]) : "",
      silk: propertyOf(fp, "Reference"),
      value: propertyOf(fp, "Value"),
      datasheet: propertyOf(fp, "Datasheet"),
      description: propertyOf(fp, "Description") || sxStr(sxValue(fp, "descr", 1, "")),
      x, y, rot,
      layer: sxStr(sxValue(fp, "layer", 1, "F.Cu")).startsWith("B") ? "B" : "F",
      pads: padsOf(fp),
      graphics: graphicsOf(fp),
    };
  });

  const tracks = [...sxChildren(doc, "segment")].map((seg) => ({
    x1: sxNum(sxValue(seg, "start", 1)), y1: sxNum(sxValue(seg, "start", 2)),
    x2: sxNum(sxValue(seg, "end", 1)), y2: sxNum(sxValue(seg, "end", 2)),
    width: sxNum(sxValue(seg, "width", 1)),
    layer: sxStr(sxValue(seg, "layer", 1, "")),
    net: netOf(seg),
  }));

  const vias = [...sxChildren(doc, "via")].map((via) => {
    const [x, y] = sxAt(via);
    return {
      x, y,
      size: sxNum(sxValue(via, "size", 1)),
      drill: sxNum(sxValue(via, "drill", 1)),
      layers: layersOf(via),
      net: netOf(via),
    };
  });

  const zones = [...sxChildren(doc, "zone")].map((zone) => {
    const outlinePts = sxChild(sxChild(zone, "polygon") || [], "pts");
    const layers = layersOf(zone);
    return {
      name: sxStr(sxValue(zone, "name", 1, "")),
      net: netOf(zone),
      layer: layers[0] || "",
      layers,
      priority: Math.round(sxNum(sxValue(zone, "priority", 1, 0))),
      polygon: outlinePts ? [...sxChildren(outlinePts, "xy")].map((p) => [sxNum(p[1]), sxNum(p[2])]) : [],
      filled: [...sxChildren(zone, "filled_polygon")]
        .map((fill) => {
          const pts = sxChild(fill, "pts");
          return pts
            ? {
                layer: sxStr(sxValue(fill, "layer", 1, "")),
                pts: [...sxChildren(pts, "xy")].map((p) => [sxNum(p[1]), sxNum(p[2])]),
              }
            : null;
        })
        .filter(Boolean),
    };
  });

  const layout = {
    origin: { x: q4(minX), y: q4(minY) },
    size: { w: q4(maxX - minX), h: q4(maxY - minY) },
    outline, footprints, tracks, vias, zones,
  };
  reorigin(layout, minX, minY);
  return layout;
}

const q4 = (v) => Math.round(v * 1e4) / 1e4;

/** Re-origin everything to the outline's minimum, once, as the Python does. */
function reorigin(layout, ox, oy) {
  for (const item of layout.outline) {
    if (item.kind === "circle") {
      item.x -= ox;
      item.y -= oy;
      continue;
    }
    item.x1 -= ox; item.y1 -= oy; item.x2 -= ox; item.y2 -= oy;
    if (item.kind === "arc") { item.mx -= ox; item.my -= oy; }
  }
  for (const fp of layout.footprints) { fp.x -= ox; fp.y -= oy; }
  for (const t of layout.tracks) { t.x1 -= ox; t.y1 -= oy; t.x2 -= ox; t.y2 -= oy; }
  for (const v of layout.vias) { v.x -= ox; v.y -= oy; }
  for (const z of layout.zones) {
    z.polygon = z.polygon.map(([x, y]) => [x - ox, y - oy]);
    for (const fill of z.filled) fill.pts = fill.pts.map(([x, y]) => [x - ox, y - oy]);
  }
}

// -------------------------------------------------------------- the schematic

const PAPER = { A4: [297, 210], A3: [420, 297], A2: [594, 420], A: [279.4, 215.9], B: [431.8, 279.4] };

function libBox(sym) {
  const xs = [];
  const ys = [];
  const visit = (node) => {
    for (let i = 1; i < node.length; i++) {
      const item = node[i];
      if (!Array.isArray(item)) continue;
      const t = sxTag(item);
      if (t === "rectangle") {
        xs.push(sxNum(sxValue(item, "start", 1)), sxNum(sxValue(item, "end", 1)));
        ys.push(sxNum(sxValue(item, "start", 2)), sxNum(sxValue(item, "end", 2)));
      } else if (t === "polyline" || t === "bezier") {
        const pts = sxChild(item, "pts");
        for (const p of sxChildren(pts || [], "xy")) { xs.push(sxNum(p[1])); ys.push(sxNum(p[2])); }
      } else if (t === "circle") {
        const [cx, cy] = [sxNum(sxValue(item, "center", 1)), sxNum(sxValue(item, "center", 2))];
        const r = sxNum(sxValue(item, "radius", 1));
        xs.push(cx - r, cx + r);
        ys.push(cy - r, cy + r);
      } else if (t === "arc") {
        for (const key of ["start", "mid", "end"]) {
          xs.push(sxNum(sxValue(item, key, 1)));
          ys.push(sxNum(sxValue(item, key, 2)));
        }
      } else if (t === "pin") {
        xs.push(sxNum(sxValue(item, "at", 1)));
        ys.push(sxNum(sxValue(item, "at", 2)));
      } else if (t === "symbol") {
        visit(item);
      }
    }
  };
  visit(sym);
  if (!xs.length) return [-2.54, -2.54, 2.54, 2.54];
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

/** Library frame (Y up) to sheet frame (Y down), with rotation and mirror. */
function toSheet(x, y, deg, mirror) {
  if (mirror === "x") y = -y;
  else if (mirror === "y") x = -x;
  const a = (deg * Math.PI) / 180;
  return [x * Math.cos(a) - y * Math.sin(a), -(x * Math.sin(a) + y * Math.cos(a))];
}

function parseSchematic(text) {
  const doc = parseSexpr(text);
  if (sxTag(doc) !== "kicad_sch") throw new Error("this is not a .kicad_sch file");

  const lib = new Map();
  for (const sym of sxChildren(sxChild(doc, "lib_symbols") || [], "symbol")) {
    if (sym.length > 1) lib.set(sxStr(sym[1]), libBox(sym));
  }

  const symbols = [];
  for (const sym of sxChildren(doc, "symbol")) {
    const ref = propertyOf(sym, "Reference");
    if (!ref || ref.startsWith("#")) continue; // power and ground flags
    const [x, y, rot] = sxAt(sym);
    const mirror = sxStr(sxValue(sym, "mirror", 1, ""));
    const libId = sxStr(sxValue(sym, "lib_id", 1, ""));
    const [bx0, by0, bx1, by1] = lib.get(libId) || [-2.54, -2.54, 2.54, 2.54];
    const corners = [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]].map(([cx, cy]) =>
      toSheet(cx, cy, rot, mirror)
    );
    const cxs = corners.map((c) => c[0]);
    const cys = corners.map((c) => c[1]);
    symbols.push({
      ref,
      uuid: sxStr(sxValue(sym, "uuid", 1, "")),
      lib_id: libId,
      value: propertyOf(sym, "Value"),
      datasheet: propertyOf(sym, "Datasheet"),
      description: propertyOf(sym, "Description"),
      footprint: propertyOf(sym, "Footprint"),
      x: q4(x), y: q4(y), rot,
      bbox: [
        q4(x + Math.min(...cxs)), q4(y + Math.min(...cys)),
        q4(x + Math.max(...cxs)), q4(y + Math.max(...cys)),
      ],
    });
  }

  const paper = sxStr(sxValue(doc, "paper", 1, "A4")) || "A4";
  const [width, height] = PAPER[paper] || PAPER.A4;
  return { paper, width, height, symbols };
}

// -------------------------------------------------------------- put together

const refKey = (ref) => {
  const head = ref.replace(/\d+$/, "");
  const tail = ref.slice(head.length);
  return [head, tail ? Number(tail) : 0];
};

const byRef = (a, b) => {
  const [ah, an] = refKey(a.ref);
  const [bh, bn] = refKey(b.ref);
  return ah < bh ? -1 : ah > bh ? 1 : an - bn;
};

/**
 * Nets, straight off the copper.
 *
 * A pad carries its net, the chip's own name for the pin and the pin's
 * electrical type — everything the distiller and the rule checks read out of
 * the kicadxml export, without needing the export.
 */
function netsFromPads(footprints) {
  const nets = new Map();
  for (const fp of footprints) {
    for (const pad of fp.pads) {
      if (!pad.net || !fp.ref) continue;
      if (!nets.has(pad.net)) nets.set(pad.net, []);
      const nodes = nets.get(pad.net);
      // A part can carry the same pad number more than once — a thermal tab, a
      // split pad. One net list node is enough.
      if (nodes.some((n) => n.ref === fp.ref && n.pin === pad.num)) continue;
      nodes.push({ ref: fp.ref, pin: pad.num, function: pad.function, type: pad.type });
    }
  }
  return [...nets.entries()]
    .map(([name, nodes], i) => ({
      name,
      code: i + 1,
      nodes: nodes.sort((a, b) => byRef(a, b) || (a.pin < b.pin ? -1 : 1)),
    }))
    .sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

class BoardError extends Error {}

/**
 * A Board from a `.kicad_pcb` and, when there is one, its `.kicad_sch`.
 *
 * Without the schematic the designators come from the footprints' `Reference`
 * property, which is the silkscreen label — usually right, sometimes `BUCK`.
 * `joined` says which happened so the page can be honest about it.
 */
function buildBoard({ name, pcbText, schText }) {
  const layout = parsePcb(pcbText);
  if (!layout.footprints.length) throw new BoardError("no footprints in this board");

  const schematic = schText ? parseSchematic(schText) : null;
  const byUuid = new Map((schematic?.symbols || []).map((s) => [s.uuid, s]));

  let joined = 0;
  for (const fp of layout.footprints) {
    const sym = byUuid.get(fp.uuid);
    if (sym) {
      fp.ref = sym.ref;
      joined += 1;
    } else {
      fp.ref = fp.silk;
    }
  }
  const unnamed = layout.footprints.filter((f) => !f.ref);
  if (unnamed.length === layout.footprints.length) {
    throw new BoardError("no footprint has a reference, so nothing can be identified");
  }
  layout.footprints.sort(byRef);

  const components = layout.footprints
    .filter((fp) => fp.ref)
    .map((fp) => {
      const sym = byUuid.get(fp.uuid);
      return {
        ref: fp.ref,
        value: sym?.value || fp.value || "",
        footprint: fp.library,
        description: sym?.description || fp.description || "",
        datasheet: sym?.datasheet || fp.datasheet || "",
        uuid: fp.uuid || fp.fp_uuid,
        ...(sym ? { sheet: { x: sym.x, y: sym.y, bbox: sym.bbox } } : {}),
      };
    })
    .sort(byRef);

  layout.tracks.forEach((t, i) => (t.id = `t${i}`));
  layout.vias.forEach((v, i) => (v.id = `v${i}`));
  layout.zones.forEach((z, i) => (z.id = `z${i}`));

  return {
    meta: {
      name,
      source: "uploaded",
      sheet: schematic
        ? { paper: schematic.paper, width: schematic.width, height: schematic.height }
        : { paper: "A4", width: 297, height: 210 },
      joined,
      hasSchematic: Boolean(schematic),
    },
    components,
    nets: netsFromPads(layout.footprints),
    layout,
  };
}

/** A one-line summary for the page to show after a load. */
function summarise(board) {
  const l = board.layout;
  const pads = l.footprints.reduce((n, f) => n + f.pads.length, 0);
  return (
    `${board.components.length} parts · ${board.nets.length} nets · ${pads} pads · ` +
    `${l.tracks.length} tracks · ${l.vias.length} vias · ${l.zones.length} pours · ` +
    `${l.size.w.toFixed(0)}×${l.size.h.toFixed(0)} mm`
  );
}

// ===== site/upload.js =================================================

// Load a KiCad project from the visitor's own machine.
//
// Nothing leaves the browser and nothing is asked of any API: the files are
// read with `File.text()` and parsed by site/kicad.js. A folder drop, a folder
// picker and a plain multi-file selection all end up in the same place.
//
// Two files matter. The `.kicad_pcb` is the board. The `.kicad_sch` is asked for
// because a footprint's `Reference` property is its *silkscreen* label — on the
// sample board eleven of the fifty-three say things like `LIN REG` — and the
// real designator only comes from joining the two on their shared UUID. The
// board loads without it, and says so.


const MAX_BYTES = 40 * 1024 * 1024;

/** Pick the board and schematic out of whatever was dropped. */
function choose(files) {
  const all = [...files];
  const pcbs = all.filter((f) => f.name.toLowerCase().endsWith(".kicad_pcb"));
  const schs = all.filter((f) => f.name.toLowerCase().endsWith(".kicad_sch"));
  if (!pcbs.length) return { error: "No .kicad_pcb in there. Drop the project folder, or the board file itself." };

  // A project folder can hold backups and a .history directory; the shallowest
  // path is the real one, and the largest schematic is the root sheet.
  const depth = (f) => (f.webkitRelativePath || f.name).split("/").length;
  const pcb = pcbs.sort((a, b) => depth(a) - depth(b) || b.size - a.size)[0];
  const stem = pcb.name.replace(/\.kicad_pcb$/i, "");
  const sch =
    schs.find((f) => f.name.replace(/\.kicad_sch$/i, "") === stem) ||
    schs.sort((a, b) => depth(a) - depth(b) || b.size - a.size)[0] ||
    null;

  if (pcb.size > MAX_BYTES) {
    return { error: `${pcb.name} is ${(pcb.size / 1e6).toFixed(0)} MB, which is more than this page will read.` };
  }
  return { pcb, sch, name: stem };
}

/** Read and parse. Returns {board, notes} or throws with something readable. */
async function load(files) {
  const picked = choose(files);
  if (picked.error) throw new Error(picked.error);

  const [pcbText, schText] = await Promise.all([
    picked.pcb.text(),
    picked.sch ? picked.sch.text() : Promise.resolve(null),
  ]);

  let board;
  try {
    board = buildBoard({ name: picked.name, pcbText, schText });
  } catch (error) {
    throw new Error(`${picked.pcb.name} could not be read: ${error.message}`);
  }

  const notes = [];
  if (!picked.sch) {
    notes.push(
      "No .kicad_sch came with it, so the part names are the silkscreen labels " +
        "off the board. Those are usually the designators and sometimes not."
    );
  } else if (board.meta.joined < board.layout.footprints.length) {
    notes.push(
      `${board.meta.joined} of ${board.layout.footprints.length} footprints matched a ` +
        "symbol in the schematic; the rest fell back to their silkscreen label."
    );
  }
  return { board, notes, files: { pcb: picked.pcb.name, sch: picked.sch?.name || null } };
}

/**
 * Wire up a file input and a drop target.
 *
 * `onBoard(board, notes, files)` is called on success, `onError(message)` when
 * the files are not a board this can read.
 */
function attachUpload({ input, dropZone, onBoard, onError, onBusy }) {
  const handle = async (files) => {
    if (!files || !files.length) return;
    onBusy?.(true);
    try {
      const result = await load(files);
      onBoard(result.board, result.notes, result.files);
    } catch (error) {
      onError(error.message || String(error));
    } finally {
      onBusy?.(false);
    }
  };

  input.addEventListener("change", () => {
    handle(input.files);
    input.value = ""; // so choosing the same folder twice fires again
  });

  if (!dropZone) return;
  const stop = (event) => {
    event.preventDefault();
    event.stopPropagation();
  };
  for (const type of ["dragenter", "dragover"]) {
    dropZone.addEventListener(type, (event) => {
      stop(event);
      event.dataTransfer.dropEffect = "copy";
      dropZone.classList.add("dropping");
    });
  }
  for (const type of ["dragleave", "dragend"]) {
    dropZone.addEventListener(type, (event) => {
      stop(event);
      if (event.target === dropZone) dropZone.classList.remove("dropping");
    });
  }
  dropZone.addEventListener("drop", async (event) => {
    stop(event);
    dropZone.classList.remove("dropping");
    handle(await filesFrom(event.dataTransfer));
  });
}

/** Every file in a drop, walking into folders where the browser allows it. */
async function filesFrom(transfer) {
  const entries = [...(transfer.items || [])]
    .map((item) => (item.webkitGetAsEntry ? item.webkitGetAsEntry() : null))
    .filter(Boolean);
  if (!entries.length) return [...(transfer.files || [])];

  const out = [];
  const walk = async (entry, path) => {
    if (entry.isFile) {
      const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
      // Keep the path so `choose` can prefer the shallowest board.
      Object.defineProperty(file, "webkitRelativePath", { value: path + entry.name });
      out.push(file);
      return;
    }
    if (!entry.isDirectory) return;
    // Skip KiCad's own backup and autosave folders, which hold older boards.
    if (/^(\.history|.*-backups)$/i.test(entry.name)) return;
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
      if (!batch.length) break;
      for (const child of batch) await walk(child, path + entry.name + "/");
    }
  };
  for (const entry of entries) await walk(entry, "");
  return out;
}

// ===== site/rag.js ====================================================

/**
 * Retrieval over documentation somebody attached to a part.
 *
 * A datasheet is 30 to 100 pages. Six researched parts on one board is a few
 * hundred thousand tokens, and the reviewer needs about two thousand of it. The
 * job of this module is to pick which two thousand.
 *
 * WHY BM25 AND NOT EMBEDDINGS
 *
 * The obvious move is to embed every passage and rank by cosine distance. It is
 * the wrong tool here, for four reasons that are all about this project rather
 * than about retrieval in general.
 *
 * The queries are rare exact tokens. VBST, RthetaJA, UVLO, 0.1uF. Lexical
 * scoring is at its strongest on exactly those, because a term in one chunk of
 * four hundred outweighs a term in three hundred and eighty of them. Embeddings
 * smooth rare tokens toward their neighbours, which is the opposite of what you
 * want when VBST and VBAT must not be confused.
 *
 * A scored sweep may not touch the network, and it is stamped with hashes so it
 * can be reproduced. An embedding call in the retrieval path breaks both.
 *
 * It has to run in the browser, on a board someone just dropped on the page,
 * with no server. A local embedding model does not.
 *
 * And when retrieval returns the wrong passage you can read the reason. A
 * vector store gives you a number.
 *
 * WHAT BM25 IS
 *
 * Three ideas. Rare terms count more, which is the idf term. A term repeated
 * ten times is not ten times the evidence, so term frequency saturates, which
 * is k1. A long passage should not win by being long, so length is normalised
 * against the collection average, which is b. That is the whole algorithm.
 *
 * DETERMINISM
 *
 * Scores are rounded before sorting and ties break on page then index. Two
 * chunks that score alike must not swap places between one run and the next, or
 * between this file and the Python beside it - the passages go into a prompt,
 * and the prompt is a cache key.
 */

/** BM25's two knobs, at the values the literature settled on. */
const K1 = 1.2;
const B = 0.75;

/** Chunk size in words, and how much neighbouring chunks share. */
const CHUNK_WORDS = 350;
const OVERLAP_WORDS = 50;

/** Scores are compared at this precision, so float noise cannot reorder them. */
const PRECISION = 6;

/**
 * Symbols a datasheet uses that a keyboard does not. Indexed both ways, so
 * someone who typed "theta" finds a page that printed the Greek letter.
 */
const TRANSLITERATE = [
  [/θ/g, "theta"],
  [/µ|μ/g, "u"],
  [/Ω/g, "ohm"],
  [/°/g, "deg"],
];

/**
 * Words that mean the same thing to a datasheet and different things to a
 * tokenizer. Hand-written and inspectable on purpose: a model could generate a
 * longer table, and then nobody could say why a retrieval missed.
 */
const EXPANSIONS = {
  theta: ["thermal", "resistance", "junction", "ambient", "rthetaja"],
  thermal: ["theta", "rthetaja", "junction", "dissipation"],
  bootstrap: ["vbst", "boot", "capacitor"],
  enable: ["en", "uvlo", "threshold", "shutdown"],
  input: ["vin", "supply", "operating", "range"],
  output: ["vout", "regulation"],
  maximum: ["absolute", "ratings", "max"],
  decoupling: ["bypass", "capacitor", "placement"],
};

/**
 * Split text into terms without destroying the ones that matter.
 *
 * A tokenizer that splits on every non-letter turns 0.1uF into "0", "1", "uf"
 * and 4.5V into "4", "5v", which is how a retrieval that looks correct returns
 * the revision history. Dots, signs and slashes are kept inside a token and
 * trimmed only from its ends.
 */
function terms(text) {
  let source = String(text || "").toLowerCase();
  for (const [pattern, plain] of TRANSLITERATE) source = source.replace(pattern, plain);
  const out = [];
  for (const raw of source.split(/[^a-z0-9.\-+_/]+/)) {
    const token = raw.replace(/^[.\-+_/]+/, "").replace(/[.\-+_/]+$/, "");
    if (token.length > 1) out.push(token);
  }
  return out;
}

/**
 * A best guess at which section a passage came from.
 *
 * Datasheet headings are short and title-case, and sit at the start of what
 * follows them. This is a label for whoever reads the citation, not something a
 * check depends on, so a wrong guess costs nothing.
 */
function heading(words) {
  const head = words.slice(0, 8).join(" ");
  const match = /^([A-Z][A-Za-z ]{3,40}?)(?=\s+[A-Z]?[a-z]|\s*$)/.exec(head);
  return match ? match[1].trim() : "";
}

/**
 * Cut a document into passages, never across a page boundary.
 *
 * Page boundaries are hard limits because the page number is the provenance: a
 * quote spanning two pages cannot be cited to either. Inside a page the split is
 * by word count with an overlap, so a parameter table straddling a boundary
 * survives whole in one of the two chunks.
 *
 * `pages` is one string per page, which is what a PDF extractor gives and what
 * pasted text degenerates to - a single page.
 */
/**
 * Pages that match every query and answer none of them.
 *
 * A table of contents names every section in the document, so it scores against
 * any query built out of section names - which is what a standing question like
 * "absolute maximum ratings" is. One came back as the third best passage about
 * an MCU: a row of dot leaders and page numbers. No amount of term weighting
 * fixes it, because the terms really are in there.
 *
 * The test is the dot leader and nothing else. The obvious alternative - that a
 * contents page is short on letters and long on punctuation - also describes a
 * parameter table, and a parameter table is the single most valuable page in a
 * datasheet. Better to keep a contents page nobody formatted with dots than to
 * silently drop the absolute maximum ratings.
 *
 * The dots may be spaced. A PDF extractor pulls a leader out as ". . . . . ."
 * as often as "......", depending on how the run was laid out, and the first
 * version of this only matched the second - which is not the one that was in
 * the document that prompted it.
 */
function isNavigation(text) {
  return /(\.\s*){4,}/.test(text);
}

function chunk(pages, { part = "", source = "" } = {}) {
  const out = [];
  const step = Math.max(1, CHUNK_WORDS - OVERLAP_WORDS);
  pages.forEach((text, i) => {
    if (isNavigation(text)) return;
    const words = String(text || "").split(/\s+/).filter(Boolean);
    if (!words.length) return;
    for (let at = 0; at < words.length; at += step) {
      const slice = words.slice(at, at + CHUNK_WORDS);
      if (!slice.length) break;
      out.push({
        part,
        source,
        page: i + 1,
        index: out.length,
        text: slice.join(" "),
        section: heading(slice),
      });
      if (at + CHUNK_WORDS >= words.length) break;
    }
  });
  return out;
}

/**
 * A BM25 index over one part's documentation.
 *
 * The collection is that part's own chunks rather than every part's, because
 * idf should mean "rare in this document". A term common in a regulator
 * datasheet is not thereby common in an MCU's.
 */
function index(chunks) {
  const docs = chunks.map((c) => {
    const words = terms(c.text);
    const freq = new Map();
    for (const t of words) freq.set(t, (freq.get(t) || 0) + 1);
    return { chunk: c, freq, length: words.length };
  });
  const seen = new Map();
  for (const doc of docs) {
    for (const term of doc.freq.keys()) seen.set(term, (seen.get(term) || 0) + 1);
  }
  const total = docs.length || 1;
  const avg = docs.reduce((sum, d) => sum + d.length, 0) / total;
  const idf = new Map();
  for (const [term, n] of seen) {
    // The 1 inside the log keeps idf positive for a term that appears in every
    // chunk, so a ubiquitous term contributes nothing rather than contributing
    // backwards and pushing the passages that contain it below the ones that
    // do not.
    idf.set(term, Math.log(1 + (total - n + 0.5) / (n + 0.5)));
  }
  return { docs, idf, avg: avg || 1, size: docs.length };
}

/** Expand a query with the hand-written synonyms, originals first. */
function expand(wanted) {
  const out = [...wanted];
  for (const term of wanted) {
    for (const extra of EXPANSIONS[term] || []) {
      if (!out.includes(extra)) out.push(extra);
    }
  }
  return out;
}

/**
 * The top `k` passages for a query, best first.
 *
 * A chunk matching nothing scores zero and is dropped rather than ranked last.
 * Padding a pack with irrelevant text is worse than a shorter pack: every line
 * of it is a line the reviewer might reason from.
 */
function search(idx, query, k = 3) {
  const wanted = expand(terms(query));
  const scored = [];
  for (const doc of idx.docs) {
    let score = 0;
    for (const term of wanted) {
      const f = doc.freq.get(term);
      if (!f) continue;
      const norm = f + K1 * (1 - B + (B * doc.length) / idx.avg);
      score += (idx.idf.get(term) || 0) * ((f * (K1 + 1)) / norm);
    }
    if (score <= 0) continue;
    scored.push({ ...doc.chunk, score: Number(score.toFixed(PRECISION)) });
  }
  scored.sort((a, b) => b.score - a.score || a.page - b.page || a.index - b.index);
  return scored.slice(0, k);
}

/**
 * The query for one part, built from the board and nothing else.
 *
 * This is a boundary, not a convenience. Built from the deterministic findings
 * instead, retrieval would fetch the passage describing the seeded defect and
 * the pack would quote it - the same leak the checks block was rewritten to
 * close, arriving by a different route. It reads the part, its value, its
 * package and the nets its pins sit on: all things true of the board whether or
 * not anything is wrong with it.
 */
function queryFor(board, ref, pins = []) {
  const comp = board.components.find((c) => c.ref === ref);
  if (!comp) return "";
  const nets = [...new Set(pins.map((p) => p.net).filter(Boolean))];
  const functions = [...new Set(pins.map((p) => p.name || p.function).filter(Boolean))];
  return [
    comp.value || "",
    comp.description || "",
    (comp.footprint || "").split(":").pop() || "",
    ...functions,
    ...nets.map((n) => n.replace(/^\//, "")),
    // Standing questions, identical for every part on every board.
    "absolute maximum ratings input voltage range thermal resistance",
    "required external components enable threshold",
  ]
    .filter(Boolean)
    .join(" ");
}

// ===== site/datasheet_agent.js ========================================

/**
 * The datasheet agent: a model reads the document, and the document checks it.
 *
 * This replaces a table of regular expressions, and it replaces it because the
 * regexes were quietly wrong. Asked about a ULN2003A they reported an output
 * current of 2002 A - the "2002" of a neighbouring part number with the "A" of
 * "ULN2002A" - and the failure is not a missing word boundary but the approach.
 * A pattern matches shapes. "A number, then an A" is the shape of an ampere
 * rating and also the shape of half a part number, half a table index and half
 * a revision code, and every one of those will appear within forty characters
 * of the words "output current" in some datasheet somewhere.
 *
 * A model reading the sentence knows which is which. What it does not do
 * reliably is stay inside the document, so the document is what checks it.
 *
 * HOW A FACT IS ADMITTED
 *
 * The agent must return a verbatim quote for every value. That quote is then
 * looked for in the pages it was supposedly read from, whitespace-normalised,
 * and a fact whose quote is not there is dropped - not flagged, dropped. The
 * value has to appear inside its own quote too, so "45 C/W" cannot be supported
 * by a sentence with no 45 in it. Neither check asks a model anything: they are
 * string comparisons against the source, which is the only part of this that
 * cannot be talked into agreeing.
 *
 * That is the whole design. The model is allowed to be the thing that
 * understands the sentence, and is not allowed to be the thing that decides
 * whether the sentence exists.
 *
 * WHAT IT IS SHOWN
 *
 * Not the document. Sixty pages is more than the context is worth spending and
 * most of it is packaging drawings, so BM25 picks the passages for each
 * parameter and the agent sees those. Retrieval choosing badly costs a missing
 * fact, which is the safe direction: a fact that was never extracted leaves its
 * check gated, and a gated check reports as unassessed rather than as passing.
 */


const AGENT_VERSION = "1";

/**
 * What to ask about, and what a plausible answer looks like.
 *
 * The bounds are not a second opinion on the datasheet - they are a bound on
 * the extraction. A junction temperature of 2002 degrees is not a reading a
 * document supports, it is a misread, and the cheapest place to catch a misread
 * is against the order of magnitude every part of this kind shares.
 */
const WANTED = [
  {
    name: "vin_range_v",
    label: "Input voltage range",
    ask: "the supply or input voltage range the part operates over",
    query: "input supply voltage range operating conditions minimum maximum V",
    unit: "V",
    range: [0.5, 1000],
    enables: "rail_within_input_range",
  },
  {
    name: "max_junction_c",
    label: "Maximum junction temperature",
    ask: "the maximum junction temperature",
    query: "maximum junction temperature TJ absolute ratings degrees C",
    unit: "°C",
    range: [50, 250],
    enables: "junction_temp",
  },
  {
    name: "theta_ja",
    label: "Junction-to-ambient",
    ask: "the junction-to-ambient thermal resistance for this package",
    query: "thermal resistance junction to ambient RthJA theta JA C/W package",
    unit: "°C/W",
    range: [0.5, 1000],
    enables: "junction_temp",
  },
  {
    name: "output_current_a",
    label: "Output current",
    ask: "the rated or maximum output current per channel",
    query: "output current rating per channel maximum continuous A mA",
    unit: "A",
    range: [0.0001, 500],
    enables: null,
  },
  {
    name: "required_external_part",
    label: "Required external part",
    ask:
      "any external component the datasheet says must be fitted - a bootstrap " +
      "capacitor, a pull-up on an enable pin, a compensation network",
    query: "connect capacitor between pin required external components bootstrap enable pull-up",
    unit: "",
    range: null,
    // A regulator wants an input capacitor and an output capacitor and a catch
    // diode and an inductor. Keeping the first and discarding the rest reported
    // one of four requirements as though it were the requirement.
    many: true,
    enables: "required_external_part",
  },
];

/**
 * The passages the agent is shown, one set per parameter.
 *
 * Each parameter gets its own query, because a single query for everything
 * returns the passage that is vaguely about all of them - which is usually the
 * contents page, and contents pages are already dropped for that reason.
 */
function evidenceFor(pages, source = "document", part = "") {
  const idx = index(chunk(pages, { source }));
  const seen = new Map();
  for (const want of WANTED) {
    // The part number goes into every query. One document often covers a whole
    // family - an LM2576 and an LM2576HV differ by twenty volts of input range
    // and share a datasheet - so a passage that names the exact part is the one
    // worth reading, and BM25 ranks a rare exact token like "LM2576HVS" highly
    // when it is in the query at all.
    for (const hit of search(idx, `${part} ${want.query}`.trim(), 2)) {
      const key = `${hit.page}:${hit.index}`;
      if (!seen.has(key)) seen.set(key, hit);
    }
  }
  return [...seen.values()].sort((a, b) => a.page - b.page || a.index - b.index);
}

const PROMPT_HEAD = [
  "You are reading one component datasheet and reporting what it states.",
  "",
  "You are given passages from the document, each with the page it came from.",
  "Report only what these passages actually say. You are not being asked what",
  "is typical for this kind of part, and a value you supply from experience is",
  "worse than no value: every fact you return is checked against the passages",
  "and dropped if its quote is not found in them, so an invented fact costs the",
  "reader a parameter and buys nothing.",
  "",
  "Report nothing for a parameter the passages do not state. That is the",
  "expected answer for most parameters in most documents.",
  "",
  "ONE DOCUMENT, SEVERAL PARTS",
  "",
  "A datasheet usually covers a family, and the members differ. An LM2576 and",
  "an LM2576HV share a document and not an input voltage range. Report the row",
  "for the exact part named below, and put what that row applies to in",
  "`applies_to` - the part number, the package, the temperature range, whatever",
  "the table says it is conditioned on. If the passages state a value only for",
  "a different member of the family, report nothing for that parameter: a",
  "neighbour's number is worse than no number, because it looks like an answer.",
  "",
  "Some parameters have more than one answer - a regulator needs an input",
  "capacitor and an output capacitor and a catch diode. Report each as its own",
  "entry rather than choosing between them.",
  "",
  "WHAT TO LOOK FOR",
];

const PROMPT_TAIL = [
  "",
  "ANSWER",
  "",
  "JSON only, no prose:",
  "",
  '{"facts": [{"name": "<one of the names above>", "value": <number or string>,',
  '  "unit": "<the unit as printed>", "page": <page number>,',
  '  "applies_to": "<the part number or condition this row is for, if the passage says>",',
  '  "quote": "<the words from the passage that state it, copied exactly>"}]}',
  "",
  "The quote must be copied character for character from a passage above. Do",
  "not tidy it, join it to another line, or write out what it means. A table",
  "row is a quote. If you cannot copy a quote that states the value, leave the",
  "parameter out.",
];

/** The prompt for one part's document. */
function agentPrompt(part, value, evidence) {
  const lines = [
    ...PROMPT_HEAD,
    ...WANTED.map((w) => `- ${w.name}: ${w.ask}${w.many ? " (may have several)" : ""}`),
    "",
    `THE PART  ${value || part} — the board calls it ${part}`,
    "",
    "PASSAGES",
    "",
  ];
  for (const hit of evidence) {
    lines.push(`[page ${hit.page}] ${hit.text}`);
    lines.push("");
  }
  lines.push(...PROMPT_TAIL);
  return lines.join("\n");
}

/** Whitespace and case are not evidence, so neither decides a comparison. */
const flatten = (text) =>
  String(text || "")
    .toLowerCase()
    .replace(/[‐-―−]/g, "-")
    .replace(/\s+/g, " ")
    .trim();

/** The numbers in a string, so a value can be checked against its own quote. */
const numbersIn = (text) =>
  (String(text).match(/-?\d+(?:\.\d+)?/g) || []).map(Number);

/**
 * Keep the facts the document supports, and say why each of the rest went.
 *
 * Four gates, none of which asks a model anything. The quote has to be in the
 * document. The value has to be in the quote. The parameter has to be one that
 * was asked for. And a number has to be the right order of magnitude for the
 * quantity it claims to be, which is what catches a part number read as an
 * ampere rating.
 */
function verifyFacts(answer, pages) {
  const haystack = flatten(pages.join(" "));
  const wanted = new Map(WANTED.map((w) => [w.name, w]));
  const kept = {};
  const dropped = [];

  for (const raw of (answer && answer.facts) || []) {
    if (!raw || typeof raw !== "object") continue;
    const spec = wanted.get(String(raw.name));
    const quote = String(raw.quote || "").trim();
    const why = (reason) => dropped.push({ name: raw.name, quote, reason });

    if (!spec) {
      why("not a parameter that was asked for");
      continue;
    }
    if (quote.length < 8) {
      why("no quote");
      continue;
    }
    if (!haystack.includes(flatten(quote))) {
      why("the quote is not in the document");
      continue;
    }
    // A parameter that declares a range is a number, and it has to arrive as
    // one. "42.6 32.4" is two columns of a table read as a single answer, and
    // it used to survive: it is not a clean number, so it fell through to the
    // string branch and skipped both the value-in-quote check and the range
    // check on its way to being displayed as a thermal resistance.
    const wantsNumber = Boolean(spec.range);
    const single = /^-?\d+(?:\.\d+)?$/.test(String(raw.value).trim());
    if (wantsNumber) {
      if (!single) {
        why(`${JSON.stringify(raw.value)} is not a single number`);
        continue;
      }
      const value = Number(raw.value);
      if (!numbersIn(quote).includes(value)) {
        why("the value does not appear in its own quote");
        continue;
      }
      if (value < spec.range[0] || value > spec.range[1]) {
        why(`${value} is outside the range a ${spec.label.toLowerCase()} takes`);
        continue;
      }
    }
    if (kept[spec.name] && !spec.many) continue;
    const fact = {
      label: spec.label,
      value: wantsNumber ? Number(raw.value) : String(raw.value),
      unit: String(raw.unit || spec.unit || ""),
      shown: wantsNumber
        ? `${Number(raw.value)}${spec.unit ? ` ${spec.unit}` : ""}`
        : String(raw.value),
      page: Number(raw.page) || null,
      quote: quote.slice(0, 240),
      // Which member of the family, or which operating condition, this row is
      // for. A datasheet that covers an LM2576 and an LM2576HV states an input
      // range twice, and a value with no condition beside it is a value nobody
      // can tell was the right one.
      applies_to: String(raw.applies_to || "").slice(0, 80),
      enables: spec.enables,
    };
    if (spec.many) {
      kept[spec.name] = [...(kept[spec.name] || []), fact];
      if (kept[spec.name].length > 4) kept[spec.name].length = 4;
    } else {
      kept[spec.name] = fact;
    }
  }
  return { facts: kept, dropped };
}

/**
 * Read one part's document. Runs before any review, once per document.
 *
 * `ask(prompt)` is the only thing this needs from outside - the same call the
 * review makes. A failure returns no facts rather than throwing: a document
 * that could not be read leaves its checks gated, which is the state the board
 * was already in, and is a much better outcome than refusing the attachment.
 */
const readings = new Map();

/** A cheap stable key for a document's text, so the same file is read once. */
function fingerprint(pages) {
  const text = pages.join("\n");
  let h = 5381;
  for (let i = 0; i < text.length; i += 1) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
  return `${text.length}:${h.toString(36)}`;
}

async function readDatasheet(ask, { part, value, pages }) {
  // The same PDF attached to three parts gave three different answers - 60 V,
  // 40 V and 63 V for one input range - because the agent was asked three
  // times and a model asked twice does not answer twice the same way. It is a
  // property of the document, so it is read once per document and the answer is
  // shared. That is also two calls cheaper.
  const seen = fingerprint(pages);
  if (readings.has(seen)) return readings.get(seen);

  const evidence = evidenceFor(pages, part, value);
  if (!evidence.length) return { facts: {}, dropped: [], evidence: 0 };
  let answer = null;
  try {
    answer = await ask(agentPrompt(part, value, evidence));
  } catch {
    // Not remembered: a document that could not be read this time is worth
    // trying again, and caching the failure would make one dropped connection
    // permanent for as long as the page is open.
    return { facts: {}, dropped: [], evidence: evidence.length, failed: true };
  }
  const { facts, dropped } = verifyFacts(answer, pages);
  const result = { facts, dropped, evidence: evidence.length };
  readings.set(seen, result);
  return result;
}

// ===== site/docs.js ===================================================

/**
 * The documentation somebody attached to a part, and where it is kept.
 *
 * The harness fetches a datasheet, caches the PDF and reads it. The page cannot:
 * no server, and a board someone just dropped on it must not need a vendor CDN
 * to be reviewed. So the page accepts the document instead - dropped in, or
 * pasted as text - extracts what it can, and keeps it in the browser.
 *
 * WHERE IT LIVES
 *
 * IndexedDB, not localStorage. The extracted text of a sixty-page datasheet is
 * a couple of hundred kilobytes and localStorage is a five-megabyte budget
 * shared with everything else the page stores; four datasheets would fill it and
 * the failure mode is a thrown quota error in the middle of an attach.
 *
 * Only the extracted text is stored, never the PDF. Text is what retrieval
 * reads, it is a tenth of the size, and a document nobody can re-download from
 * here is not worth the space.
 *
 * WHY THERE IS A SYNCHRONOUS CACHE IN FRONT OF IT
 *
 * IndexedDB is asynchronous and pack building is not. Rather than colour every
 * caller async for a store that holds a handful of small records, the documents
 * for the open board are read into memory once when the board loads and after
 * every attach. Everything downstream reads the cache.
 */



const DB = "pcb-eval";
const STORE = "docs";
const VERSION = 1;

/** board name -> ref -> {name, pages, addedAt}. Filled by `loadDocs`. */
const attached = new Map();

/** ref -> built BM25 index. Dropped whenever that part's document changes. */
const indexes = new Map();

function open() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") return reject(new Error("no indexedDB"));
    const req = indexedDB.open(DB, VERSION);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE)) {
        req.result.createObjectStore(STORE, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function transact(mode, run) {
  return open().then(
    (db) =>
      new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, mode);
        const out = run(tx.objectStore(STORE));
        tx.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
        tx.onerror = () => reject(tx.error);
      })
  );
}

const keyOf = (boardName, ref) => `${boardName}::${ref}`;

/**
 * Read this board's documents into memory. Called when a board loads.
 *
 * A browser with IndexedDB blocked - a private window, or site data turned off -
 * resolves to an empty board rather than failing. Nothing here is load-bearing:
 * no attached document is the ordinary state, and the review runs without one.
 */
async function loadDocs(boardName) {
  const board = new Map();
  attached.set(boardName, board);
  indexes.clear();
  try {
    const rows = await transact("readonly", (store) => store.getAll());
    for (const row of rows || []) {
      if (row.board === boardName) board.set(row.ref, row);
    }
  } catch {
    /* storage unavailable. The page works without it. */
  }
  return board;
}

/** Every document attached to this board, keyed by ref. */
function docsFor(boardName) {
  return attached.get(boardName) || new Map();
}

/** The document attached to one part, or null. */
function docFor(boardName, ref) {
  return docsFor(boardName).get(ref) || null;
}

/** Store a document against a part, replacing whatever was there. */
async function attach(boardName, ref, { name, pages }) {
  const record = {
    key: keyOf(boardName, ref),
    board: boardName,
    ref,
    name: String(name || "document"),
    pages: (pages || []).map((p) => String(p || "")),
    // Filled in by the datasheet agent, which runs after the file is stored
    // rather than before: reading is a model call over a network, and a drop
    // that waits on one feels broken even when it is working.
    facts: {},
    dropped: [],
    read: "pending",
    addedAt: Date.now(),
  };
  docsFor(boardName).set(ref, record);
  indexes.delete(record.key);
  try {
    await transact("readwrite", (store) => store.put(record));
  } catch {
    /* it stays in memory for this session, which is better than refusing. */
  }
  return record;
}

/** Record what the agent read out of a document, against that document. */
async function setFacts(boardName, ref, { facts, dropped, failed }) {
  const record = docFor(boardName, ref);
  if (!record) return null;
  Object.assign(record, {
    facts: facts || {},
    dropped: dropped || [],
    read: failed ? "failed" : "read",
  });
  try {
    await transact("readwrite", (store) => store.put(record));
  } catch {
    /* it stays in memory for this session, which is better than losing it. */
  }
  return record;
}

/** Forget the document attached to a part. */
async function detach(boardName, ref) {
  docsFor(boardName).delete(ref);
  indexes.delete(keyOf(boardName, ref));
  try {
    await transact("readwrite", (store) => store.delete(keyOf(boardName, ref)));
  } catch {
    /* nothing to do: it is already gone from memory. */
  }
}

/** The BM25 index over one part's document, built once and kept. */
function indexFor(boardName, ref) {
  const key = keyOf(boardName, ref);
  if (indexes.has(key)) return indexes.get(key);
  const doc = docFor(boardName, ref);
  if (!doc) return null;
  const built = index(chunk(doc.pages, { part: ref, source: doc.name }));
  indexes.set(key, built);
  return built;
}

/** How many passages a part's document was cut into. */
function chunkCount(boardName, ref) {
  return indexFor(boardName, ref)?.size || 0;
}

/**
 * The passages worth showing a reviewer about one part.
 *
 * The query comes from `queryFor`, which reads the board and never the
 * findings. That is the whole reason retrieval is safe to put in a pack.
 */
function passagesFor(board, ref, pins, k = 3) {
  const idx = indexFor(board.meta.name, ref);
  if (!idx) return [];
  return search(idx, queryFor(board, ref, pins), k);
}

/**
 * Extract one string per page from a PDF.
 *
 * pdf.js is fetched from the CDN the moment a PDF is actually dropped, never on
 * page load: a visitor who only wants to look at a board should not pay for a
 * parser they will not use, and the page has to keep working when the CDN is
 * unreachable. If it cannot load, the caller is told to paste text instead,
 * which is a real answer rather than a broken button.
 */
async function pagesOfPdf(file) {
  const pdfjs = await loadPdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjs.getDocument({ data }).promise;
  const pages = [];
  for (let n = 1; n <= doc.numPages; n += 1) {
    const content = await (await doc.getPage(n)).getTextContent();
    pages.push(content.items.map((i) => i.str).join(" ").replace(/\s+/g, " ").trim());
  }
  return pages;
}

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174";

let pending = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pending) return pending;
  pending = new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = `${PDFJS}/pdf.min.js`;
    tag.onload = () => {
      if (!window.pdfjsLib) return reject(new Error("pdf.js loaded but defined nothing"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS}/pdf.worker.min.js`;
      resolve(window.pdfjsLib);
    };
    tag.onerror = () => reject(new Error("could not reach the PDF reader"));
    document.head.appendChild(tag);
  });
  return pending;
}

/**
 * The retrieved passages, as a pack section.
 *
 * Verbatim, with the page they came from, because a reviewer that paraphrases a
 * datasheet cannot be checked and one that quotes it can. Three passages per
 * part is the budget: a pack is a prompt, and a prompt that recites a datasheet
 * has spent its room on text the reviewer was going to skim.
 *
 * Absent for a board nobody has attached anything to, which is the ordinary
 * state and not a defect.
 */
/**
 * The parameters a reviewer is given, and where each was read.
 *
 * Only facts the document was checked against reach this: the agent's answer is
 * matched back to the pages it was shown, and anything whose quote is not there
 * never becomes a fact at all. So the quote beside each value is not a claim
 * about the datasheet, it is a substring of it.
 */
function factsBlock(board) {
  const docs = docsFor(board.meta.name);
  const lines = ["DATASHEET PARAMETERS  read from the attached documents, quoted"];
  for (const ref of [...docs.keys()].sort()) {
    for (const [key, value] of Object.entries(docs.get(ref).facts || {})) {
      for (const fact of Array.isArray(value) ? value : [value]) {
        const where = fact.applies_to ? `, ${fact.applies_to}` : "";
        lines.push(`${ref} ${key}: ${fact.shown} (p${fact.page}${where}) "${fact.quote}"`);
      }
    }
  }
  return lines.length > 1 ? lines : [];
}

/**
 * Parameters read out of one part's document, for the reader rather than the
 * reviewer. Low-confidence readings are kept here and marked, because someone
 * checking the extraction needs to see the ones it is unsure about most of all.
 */
function factsOf(boardName, ref) {
  return docFor(boardName, ref)?.facts || {};
}

/**
 * Every fact as one flat list, because some parameters have several answers.
 *
 * A regulator needs an input capacitor and an output capacitor and a catch
 * diode, so `required_external_part` holds a list where the others hold a
 * value. Everything that displays them wants the same shape, and building that
 * shape in each of them is how one of them ends up showing "[object Object]".
 */
function factsList(boardName, ref) {
  return Object.entries(factsOf(boardName, ref)).flatMap(([name, value]) =>
    (Array.isArray(value) ? value : [value]).map((fact) => ({ name, ...fact }))
  );
}

function passagesBlock(board) {
  const docs = docsFor(board.meta.name);
  if (!docs.size) return [];
  const pins = pinsByRef(board);
  const lines = ["RETRIEVED DOCUMENTATION  verbatim, from documents attached to this board"];
  for (const ref of [...docs.keys()].sort()) {
    for (const hit of passagesFor(board, ref, pins.get(ref) || [], 3)) {
      const where = [`${hit.source} p${hit.page}`, hit.section].filter(Boolean).join(", ");
      lines.push(`${ref} (${where}): ${hit.text}`);
    }
  }
  return lines.length > 1 ? lines : [];
}

/**
 * Rated output current per part, for the ampacity check.
 *
 * Only what a document actually stated and the verifier kept - a value whose
 * quote was found in the pages it came from. No document, no entry, and the
 * check that needs it reports as unassessed rather than guessing a current.
 */
function ratedCurrents(board) {
  const out = {};
  for (const [ref, doc] of docsFor(board.meta.name)) {
    const fact = (doc.facts || {}).output_current_a;
    if (fact && typeof fact.value === "number") out[ref] = fact.value;
  }
  return out;
}

// ===== site/datasheets.js =============================================

/**
 * Datasheet facts the person reviewing supplies, because the page cannot fetch.
 *
 * The harness has a research layer: it downloads a datasheet, caches it, and
 * pulls parameters out with the page it found them on. The page cannot do any
 * of that. It has no server, the artifact CSP blocks the fetch, and a board
 * someone just dropped on it must not need a vendor CDN to be reviewed.
 *
 * So the browser asks instead. A component that would be researched and has no
 * facts wears a warning; one with facts wears a check; everything else - the
 * passives, the connectors, the mounting holes - wears nothing, because a
 * datasheet for a 10k resistor answers no question worth asking.
 *
 * WHAT COUNTS AS A FACT
 *
 * The same shape the harness extracts, minus the provenance it cannot have.
 * Every field is optional and an empty store is the normal state: an absent
 * fact means the check that needs it is skipped, exactly as it does in the
 * harness, and never means a default.
 *
 * Stored per board name in localStorage, so the work of typing in a part's
 * input range is not lost on reload. Storage can throw - a private window, or
 * a browser told to block site data - so every access is guarded and the page
 * works with none of it.
 */



/** Descriptions that mark a part as active silicon. Mirrors harness/research.py. */
const SIGNIFICANT =
  /regulat|converter|\bMCU\b|microcontroller|driver|sensor|transceiver|memory|flash|eeprom|\bADC\b|\bDAC\b|\bPHY\b|amplifier|comparator|reference|oscillator|controller|switch mode|step-down|step-up|LDO/i;
const POWER_TYPES = new Set(["power_in", "power_out", "open_collector", "tri_state"]);
const NEVER_RESEARCHED = /^(R|C|L|FB|TP|H|Y)\d/;

/**
 * Which parts are worth a datasheet, and why. First rule that matches wins.
 *
 * The same triage the harness runs, so the badges on the board agree with what
 * a scored review would actually research.
 *
 * Every clause answers one question: does the netlist already say what this
 * part does? For a resistor it does, and the value is the whole story. For a
 * part number it does not, and the document is the only place the answer lives.
 * So each clause names a property meaning "not deducible from the netlist" - the
