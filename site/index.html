<title>PCB Eval</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;450;500&display=swap">
<style>
/* --------------------------------------------------------------- tokens ---
   Dark first: this is an instrument, and copper only reads on a dark ground.
   The chrome follows the viewer's theme; the board well does not, the same way
   a photograph or a map does not invert. Every colour is declared here before
   any media query or [data-theme] block redefines it. */
:root {
  --ground: #08090c;
  --panel: #0d0f14;
  --raised: #12151c;
  --line: #1d212b;
  --line-soft: #14171f;
  --ink: #e6eae7;
  --ink-mid: #9aa3a9;
  --ink-dim: #6d757d;
  --mint: #4fd39a;
  --mint-ink: #08090c;
  --crit: #ff7061;
  --warn: #e9b657;
  --focus: #4fd39a;

  /* The board well and everything drawn in it. Theme-independent. */
  --well: #06090b;
  --substrate: #0a1310;
  --edge: #cbb98a;
  --f-cu: #c8564a;
  --b-cu: #4f83c6;
  --pad: #dcae52;
  --hole: #06090b;
  --via: #97a3ae;
  --silk: #b3bfb8;
  --label: #7f9089;

  --radius: 3px;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f2f3f1;
    --panel: #ffffff;
    --raised: #f7f8f6;
    --line: #dfe3df;
    --line-soft: #ebeeea;
    --ink: #14171a;
    --ink-mid: #4e565c;
    --ink-dim: #767e85;
    --mint: #0d8f63;
    --mint-ink: #ffffff;
    --crit: #c0392b;
    --warn: #a2740f;
    --focus: #0d8f63;
  }
}
:root[data-theme="light"] {
  --ground: #f2f3f1;
  --panel: #ffffff;
  --raised: #f7f8f6;
  --line: #dfe3df;
  --line-soft: #ebeeea;
  --ink: #14171a;
  --ink-mid: #4e565c;
  --ink-dim: #767e85;
  --mint: #0d8f63;
  --mint-ink: #ffffff;
  --crit: #c0392b;
  --warn: #a2740f;
  --focus: #0d8f63;
}

* { box-sizing: border-box; }
/* The artifact wrapper's reset carries this; repeating it keeps the file
   self-sufficient, and `display: flex` on a floating overlay beats the user
   agent's [hidden] rule without it. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
/* Form controls do not inherit type. Without this the layer chips and every
   field render in the user agent's own font while the page around them is in
   Inter, which is the sort of difference you see before you can name it. */
button, input, select, textarea { font-family: inherit; font-size: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ----------------------------------------------------------------- shell --- */
.app { display: flex; flex-direction: column; height: 100vh; min-height: 560px; }

header {
  display: flex; align-items: baseline; gap: 20px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex: none;
}
.brand {
  font-family: var(--mono); font-weight: 600; font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase;
}
.brand em { color: var(--mint); font-style: normal; }
.board-id {
  font-family: var(--mono); color: var(--ink-dim); font-size: 11px;
  letter-spacing: .04em;
}
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; padding: 5px 12px; cursor: pointer;
  background: none; border: 1px solid transparent; color: var(--ink-dim);
  border-radius: var(--radius);
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--mint); border-color: var(--line); background: var(--raised); }
.stats {
  font-family: var(--mono); font-size: 11px; color: var(--ink-dim);
  font-variant-numeric: tabular-nums; margin-left: 20px;
}

main { display: flex; flex: 1; min-height: 0; }

/* -------------------------------------------------------------- viewport --- */
.viewport { position: relative; flex: 1; min-width: 0; background: var(--well); }
#stage { position: absolute; inset: 0; }
.board-svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.board-svg.panning { cursor: grabbing; }

.overlay-tl, .overlay-br {
  position: absolute; display: flex; gap: 6px; align-items: center;
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
}
.overlay-tl { left: 12px; bottom: 12px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.overlay-br { right: 12px; bottom: 12px; color: #56626a; }
/* Below about 560px the two rows of chips would sit on top of each other. */
@media (max-width: 560px) {
  .overlay-tl { bottom: 44px; }
  .overlay-br span { display: none; }
}
.chip {
  padding: 3px 8px; cursor: pointer; text-transform: uppercase;
  background: rgba(10, 14, 18, .82); color: #c3ccd2;
  border: 1px solid #232a31; border-radius: var(--radius);
}
.chip::before {
  content: ""; display: inline-block; width: 7px; height: 7px;
  margin-right: 6px; vertical-align: 0; border-radius: 50%;
  background: var(--dot, #97a3ae);
}
.chip[data-layer="f-cu"] { --dot: var(--f-cu); }
.chip[data-layer="b-cu"] { --dot: var(--b-cu); }
.chip[data-layer="silk"] { --dot: var(--silk); }
.chip[data-layer="labels"] { --dot: var(--label); }
.chip.off { color: #5c666d; }
.chip.off::before { background: #333b42; }

/* ------------------------------------------------------------ review view ---
   The review used to happen entirely in a panel at the bottom of the rail, so
   pressing the button changed nothing where anyone was looking. It gets the
   stage now: the board stays underneath, in whichever view the finding belongs
   in, and the report sits over it. */
.tab-review[data-state="none"] { opacity: .55; }
.tab-review[data-state="running"] { color: var(--warn); border-color: var(--line); }
.tab-review[data-state="done"]::after {
  content: attr(data-count); margin-left: 6px; font-size: 9px;
  padding: 0 5px; border-radius: 8px; vertical-align: 1px;
  background: var(--crit); color: #120706;
}

/* The well behind it is dark in both themes, so this panel does not follow the
   page palette — it is furniture on the board, like the layer chips. */
#review-overlay {
  position: absolute; right: 12px; top: 12px; bottom: 12px;
  width: clamp(340px, 34vw, 560px);
  max-width: calc(100% - 24px); display: flex; flex-direction: column;
  background: rgba(10, 12, 16, .93); border: 1px solid var(--line);
  border-radius: 5px; overflow: hidden;
  backdrop-filter: blur(3px);
}
.ro-head {
  padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none;
}
.ro-head h3 {
  margin: 0 0 8px; font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: #c3ccd2;
}
.ro-score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ro-score div {
  padding: 6px 8px; border-radius: var(--radius); background: rgba(255,255,255,.04);
  border: 1px solid var(--line);
}
.ro-score b {
  display: block; font-family: var(--mono); font-size: 17px; line-height: 1.1;
  color: #9aa3a9; font-variant-numeric: tabular-nums;
}
.ro-score span {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: #79828b;
}
.ro-score .good { border-color: var(--mint); } .ro-score .good b { color: var(--mint); }
.ro-score .bad { border-color: var(--crit); } .ro-score .bad b { color: var(--crit); }
.ro-score .warn { border-color: var(--warn); } .ro-score .warn b { color: var(--warn); }

.ro-list { overflow-y: auto; flex: 1; }
.ro-item .bullet { max-width: 68ch; }
.ro-said, .ro-role { max-width: 72ch; }
.ro-item {
  display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
  padding: 10px 14px; background: none; border: 0;
  border-bottom: 1px solid var(--line-soft); border-left: 2px solid transparent;
  font: inherit;
}
.ro-item:hover { background: rgba(255,255,255,.03); }
.ro-item.on { background: rgba(255,255,255,.06); border-left-color: var(--mint); }
.ro-item.sev-critical { border-left-color: var(--crit); }
.ro-item.sev-major { border-left-color: var(--warn); }
.ro-item.on.sev-critical, .ro-item.on.sev-major { border-left-color: var(--mint); }
.ro-item .bullet {
  display: block; font-size: 12.5px; color: #9aa3a9; margin-bottom: 4px;
  padding-left: 58px; text-indent: -58px;
}
.ro-item .bullet:first-child { color: #e6eae7; }
.ro-item .bullet em {
  display: inline-block; width: 54px; margin-right: 4px; text-indent: 0;
  font-family: var(--mono); font-size: 9px; font-style: normal;
  letter-spacing: .1em; text-transform: uppercase; color: #6d757d;
  vertical-align: 1px;
}
.ro-item .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ro-item code {
  font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 2px;
  background: rgba(255,255,255,.06); color: #b6bfc5;
}
.ro-item .where {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--mint); margin-top: 6px; display: block;
}
.ro-foot {
  padding: 10px 14px; border-top: 1px solid var(--line); flex: none;
  font-size: 11.5px; color: #79828b;
}
/* The graph, running. `measured` steps ask no model anything, and that is the
   distinction the whole page is about, so it is the one thing coloured. */
.ro-step {
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  border-left: 2px solid var(--line);
}
.ro-step.measured { border-left-color: var(--mint); background: rgba(79, 211, 154, .04); }
.ro-step.looping { border-left-color: var(--warn); }
.ro-step.running { background: rgba(233, 182, 87, .06); }
.ro-step-head {
  display: flex; align-items: center; gap: 7px; font-family: var(--mono);
  font-size: 12px; color: #e6eae7;
}
.ro-step.measured .ro-step-head b { color: var(--mint); }
.ro-step.looping .ro-step-head b { color: var(--warn); }
.ro-pass, .ro-tag {
  font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
  color: #6d757d; border: 1px solid var(--line); padding: 0 5px; border-radius: 8px;
}
.ro-tag { color: var(--mint); border-color: rgba(79, 211, 154, .35); }
.ro-role { display: block; margin-top: 3px; font-size: 11.5px; color: #79828b; }
.ro-said { display: block; margin-top: 5px; font-size: 12px; color: #b6bfc5; }
.ro-said code { font-family: var(--mono); color: var(--mint); }
.ro-step.looping .ro-said code { color: var(--warn); }
.ro-rule {
  display: block; margin-top: 4px; padding-left: 9px; font-size: 11.5px;
  color: #9aa3a9; border-left: 1px solid var(--line);
}
.ro-rule.dropped { color: var(--warn); }

.ro-graph { border-top: 1px solid var(--line); flex: none; max-height: 45%; overflow-y: auto; }
.ro-graph summary {
  padding: 9px 14px; cursor: pointer; font-family: var(--mono); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: #79828b;
}
.ro-graph summary:hover { color: #e6eae7; }

.ro-empty { padding: 22px 16px; text-align: center; }
.ro-empty p { color: #9aa3a9; font-size: 12.5px; margin: 0 0 14px; }
.ro-running { display: flex; align-items: center; gap: 9px; color: var(--warn); font-family: var(--mono); font-size: 12px; }
.ro-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warn);
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .ro-dot { animation: none; opacity: .8 } }
.ro-stream {
  margin: 10px 0 0; font-family: var(--mono); font-size: 10px; line-height: 1.5;
  color: #6d757d; max-height: 160px; overflow: hidden; white-space: pre-wrap;
}

@media (max-width: 760px) {
  #review-overlay { left: 12px; width: auto; }
}

#flash {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  padding: 7px 14px; border-radius: var(--radius); font-family: var(--mono);
  font-size: 11px; background: var(--crit); color: #120706;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
#flash.on { opacity: 1; }

/* ------------------------------------------------------------ board paint --- */
.substrate { fill: var(--substrate); }
.edge { fill: none; stroke: var(--edge); stroke-width: .16; opacity: .8; }

.zone { stroke: none; }
.zone.f-cu { fill: var(--f-cu); opacity: .17; }
.zone.b-cu { fill: var(--b-cu); opacity: .15; }
.track { stroke-linecap: round; }
.track.f-cu { stroke: var(--f-cu); }
.track.b-cu { stroke: var(--b-cu); }
.pad { fill: var(--pad); stroke: none; }
.pad-hole { fill: #2c3238; }
.drill, .via-drill { fill: var(--hole); }
.via { fill: var(--via); }
/* Round caps so a zero-length silkscreen line — four of them on this board,
   which is how KiCad draws a dot — is a dot rather than nothing. */
.fp-silk { fill: none; stroke: var(--silk); stroke-width: .1; opacity: .5; stroke-linecap: round; }
/* Transparent, but it takes the pointer: the whole part is a grab target. */
.fp-body { fill: transparent; stroke: none; }
.ref-label {
  fill: var(--label); font-family: var(--mono); font-size: .95px;
  letter-spacing: .02px; pointer-events: none; user-select: none;
}

.hide-f-cu .f-cu, .hide-b-cu .b-cu { display: none; }
.hide-silk .fp-silk { display: none; }
.hide-labels .ref-label { display: none; }

/* Selection and net highlighting. Dimming the rest reads better than lighting
   one thing up, because a net is a shape spread across the whole board. */
.footprint.selected .pad { stroke: var(--mint); stroke-width: .09; }
.pad.selected, .via.selected { stroke: var(--mint); stroke-width: .12; }
.track.selected { stroke: var(--mint); }
.zone.selected { stroke: var(--mint); stroke-width: .12; opacity: .3; }
.board-svg:has(.net-lit) .track:not(.net-lit),
.board-svg:has(.net-lit) .zone:not(.net-lit),
.board-svg:has(.net-lit) .via:not(.net-lit) { opacity: .12; }
.board-svg:has(.net-lit) .pad:not(.net-lit) { opacity: .3; }

.mark { fill: none; stroke: var(--crit); stroke-width: .25; }
.mark-edit { stroke: var(--mint); stroke-dasharray: .9 .6; }

/* Where the board stops agreeing with itself. A schematic edit changes the net
   list and nothing else, so this is the only place it becomes visible. */
.stale-pad { fill: none; stroke: var(--warn); stroke-width: .16; }
.ratsnest {
  stroke: var(--warn); stroke-width: .12; stroke-dasharray: .6 .4;
  fill: none; opacity: .95;
}
.stranded { fill: none; stroke: var(--crit); stroke-width: .16; opacity: .9; }
.footprint { cursor: move; }

/* ------------------------------------------------------- footprint detail ---
   The board view answers "where is this part". At board scale a 0402 is four
   pixels, so it cannot answer "what does this pad look like". This does. */
.fp-view {
  display: flex; align-items: center; justify-content: center;
  margin: 10px 0 12px; padding: 10px; min-height: 84px;
  background: var(--well); border: 1px solid var(--line);
  border-radius: var(--radius);
}
.fp-svg { max-width: 100%; height: auto; }
.fp-fab { fill: none; stroke: #4a5560; stroke-width: .05; }
.fp-silk { fill: none; stroke: var(--silk); stroke-width: .06; opacity: .55; }
.fp-copper { fill: var(--pad); }
.fp-np_thru_hole .fp-copper { fill: #55606a; }
.fp-drill { fill: var(--hole); }
.fp-num {
  fill: #17202a; font-family: var(--mono); font-weight: 600;
  text-anchor: middle; dominant-baseline: central; pointer-events: none;
}
.fp-np_thru_hole + .fp-num { fill: #aab4bd; }

/* ------------------------------------------------------------- inspector --- */
.facts dt { color: var(--ink-dim); }
.eyebrow .count {
  margin-left: 6px; padding: 0 5px; border-radius: 7px; font-size: 9px;
  color: var(--ink-dim); background: var(--raised); border: 1px solid var(--line);
}
.field-pair { display: flex; gap: 10px; }
.field-pair .field { flex: 1; min-width: 0; margin: 6px 0; }
/* A 78px label is right when the fields are stacked and every label lines up.
   Inside a pair it is half the space, and the value ends up jammed against the
   next label, so here the label takes only the room its own words need. */
.field-pair .field span { width: auto; }
.pin-filter {
  width: 100%; margin: 0 0 6px; padding: 5px 8px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.pins .fn {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
  width: 58px; flex: none; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
kbd {
  font-family: var(--mono); font-size: 10px; padding: 0 4px;
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 3px; background: var(--raised); color: var(--ink-mid);
}

/* ---------------------------------------------------------------- dialog ---
   Attaching a document means reading what came back out of it, and the rail is
   300px of a column that already holds four panels. */
.modal-back {
  position: fixed; inset: 0; z-index: 40; display: flex;
  align-items: center; justify-content: center; padding: 24px;
  background: rgba(4, 6, 9, .72);
}
.modal {
  width: min(680px, 100%); max-height: min(760px, 100%);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
}
.modal-head {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.modal-head h3 {
  margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
}
.modal-head h3 em { font-style: normal; color: var(--mint); margin-left: 8px; }
.icon {
  margin-left: auto; width: 26px; height: 26px; line-height: 1; font-size: 18px;
  cursor: pointer; color: var(--ink-dim); background: none;
  border: 1px solid transparent; border-radius: var(--radius);
}
.icon:hover { color: var(--ink); border-color: var(--line); }
.modal-body { padding: 16px 18px 18px; overflow-y: auto; }
.modal-body h4 {
  margin: 20px 0 8px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
}
.modal-body h4:first-child { margin-top: 0; }
.dm-why { margin: 0 0 4px; font-size: 12px; color: var(--ink-mid); }
.dm-note { margin: 0 0 10px; font-size: 11.5px; color: var(--ink-dim); max-width: 62ch; }
.dm-or { margin: 12px 0 6px; font-size: 11px; color: var(--ink-dim); }

.dm-drop {
  display: flex; flex-direction: column; gap: 4px; cursor: pointer;
  padding: 22px 18px; text-align: center; border-radius: var(--radius);
  border: 1px dashed var(--line); background: var(--raised);
}
.dm-drop.over { border-color: var(--mint); background: rgba(79, 211, 154, .07); }
.dm-drop b { font-size: 12.5px; font-weight: 500; }
.dm-drop span { font-size: 11.5px; color: var(--ink-dim); }
.dm-drop input { display: none; }

.dm-file {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: var(--radius); background: var(--raised);
  border-left: 2px solid var(--mint);
}
.dm-name { font-size: 12.5px; }
.dm-meta {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-dim); font-variant-numeric: tabular-nums;
}

.dm-facts { list-style: none; margin: 14px 0 0; padding: 0; }
.dm-facts li {
  display: grid; grid-template-columns: 1fr auto; gap: 1px 10px;
  padding: 8px 0; border-top: 1px solid var(--line-soft);
}
.dm-label { font-size: 12px; color: var(--ink-mid); }
.dm-value {
  grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: 12px;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.dm-page {
  grid-column: 2; font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-dim); text-align: right;
}
.dm-quote {
  grid-column: 1 / -1; font-size: 11px; color: var(--ink-dim);
  line-height: 1.5; margin-top: 3px;
}
.dm-facts li.unsure .dm-value { color: var(--warn); }
.dm-none { margin: 14px 0 0; font-size: 12px; color: var(--ink-dim); }

.dm-hit {
  display: block; margin: 0 0 8px; padding: 9px 11px;
  border-radius: var(--radius); background: var(--raised);
  border-left: 2px solid var(--line);
}
.dm-cite {
  display: block; font-family: var(--mono); font-size: 10px;
  letter-spacing: .06em; color: var(--mint); margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.dm-text { display: block; font-size: 12px; color: var(--ink-mid); line-height: 1.55; }

.modal-body textarea {
  width: 100%; resize: vertical; font-family: var(--mono); font-size: 11.5px;
  padding: 8px 10px; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.btn.primary-ghost { color: var(--mint); border-color: rgba(79, 211, 154, .4); }

/* ------------------------------------------------------- datasheet badges ---
   Only on parts a review would research. A tick over every resistor would be
   forty ticks saying nothing. */
/* An outline on the part itself. Every badge drawn beside a part was a second
   object competing with the copper and losing; the thing being described is
   the part, so the mark is the part's own outline. Nothing is drawn once a
   document is attached, so a fully documented board is a quiet one. */
.ds-badge { cursor: pointer; }
.ds-ring {
  fill: none; stroke: var(--warn); stroke-width: .12; stroke-dasharray: .5 .32;
  opacity: .85; pointer-events: stroke;
}
.ds-badge:hover .ds-ring { stroke: var(--ink); opacity: 1; }
.hide-datasheets .datasheet-marks { display: none; }

/* ------------------------------------------------------ datasheet, inspector */
.ds-panel { margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius);
  background: var(--raised); border-left: 2px solid var(--line); }
.ds-panel.have { border-left-color: var(--mint); }
.ds-panel.missing { border-left-color: var(--warn); }
.ds-panel h4 { margin: 0 0 4px; font-family: var(--mono); font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.ds-why { margin: 0 0 8px; font-size: 11.5px; color: var(--ink-dim); }
.ds-field { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.ds-field span { font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-dim); width: 92px; flex: none; }
.ds-field input { flex: 1; }

/* ------------------------------------------------------------------ rail --- */
.rail {
  width: clamp(424px, 28vw, 510px); flex: none; overflow-y: auto;
  background: var(--panel);
  border-left: 1px solid var(--line);
}
.panel { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
.panel > h3 {
  margin: 0 0 10px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
  display: flex; justify-content: space-between; align-items: baseline;
}
.panel > h3 span { color: var(--mint); letter-spacing: .06em; }
.lede { margin: 0; color: var(--ink-mid); max-width: 60ch; }
.lede b { color: var(--ink); font-weight: 500; }
.lede-link { color: var(--mint); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.muted { color: var(--ink-dim); margin: 0; }
.hint { color: var(--ink-dim); font-size: 12px; margin: 10px 0 0; }
.eyebrow {
  margin: 12px 0 5px; font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
}

.btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  padding: 6px 11px; cursor: pointer; border-radius: var(--radius);
  background: var(--raised); color: var(--ink); border: 1px solid var(--line);
}
.btn:hover:not(:disabled) { border-color: var(--ink-dim); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger:hover:not(:disabled) { border-color: var(--crit); color: var(--crit); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.primary {
  width: 100%; font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  padding: 9px; cursor: pointer; border-radius: var(--radius);
  background: var(--mint); color: var(--mint-ink); border: 1px solid var(--mint);
  font-weight: 600;
}
.primary:disabled { opacity: .45; cursor: default; }

/* --------------------------------------------------------- inspector bits --- */
.ins-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.ins-head .ref {
  font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--ink);
}
.ins-head .val { font-family: var(--mono); font-size: 12px; color: var(--mint); }
.desc { margin: 0 0 10px; color: var(--ink-mid); font-size: 12px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 12px; }
.facts dt {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim); align-self: center;
}
.facts dd {
  margin: 0; font-family: var(--mono); font-size: 11.5px;
  font-variant-numeric: tabular-nums; color: var(--ink);
}

.field { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.field span {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim); width: 78px; flex: none;
}
input, select {
  font-family: var(--mono); font-size: 11.5px; padding: 5px 7px; width: 100%;
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
}

/* One line per pin, in a rail wide enough for one. Three table columns in a
   374px rail gave the net 180px, so every name past "unconnected-(U2-P" was
   cut - and the clipped half is the half that tells one from another. The
   answer was a wider rail, not a second line. */
.pins { list-style: none; margin: 0; padding: 0; }
.pins li {
  display: flex; align-items: center; gap: 7px;
  padding: 3px 0; border-bottom: 1px solid var(--line-soft);
}
.pins li:last-child { border-bottom: 0; }
.pins li > b {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--ink-mid); min-width: 18px; text-align: right; flex: none;
}
.pins .net-pick { flex: 1; min-width: 0; }

.swap {
  font-family: var(--mono); font-size: 12px; line-height: 1; cursor: pointer;
  padding: 4px 6px; margin-left: 4px; border-radius: var(--radius);
  background: var(--raised); color: var(--ink-dim); border: 1px solid var(--line);
}
.swap:hover { color: var(--ink); }
.swap.armed { color: var(--mint-ink); background: var(--mint); border-color: var(--mint); }
.armed-hint { color: var(--mint); }

.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.loaded { margin: 0 0 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-mid); }
.loaded b { color: var(--mint); display: block; font-size: 12.5px; margin-bottom: 2px; }
.load-error {
  margin: 0 0 6px; padding: 8px 10px; border-radius: var(--radius);
  background: var(--raised); border-left: 2px solid var(--crit);
  color: var(--ink-mid); font-size: 12.5px;
}
#stage.loading { opacity: .5; }
#stage.dropping::after {
  content: "Drop the KiCad project"; position: absolute; inset: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
  color: var(--mint); border: 2px dashed var(--mint); border-radius: 6px;
  background: rgba(8, 9, 12, .72); pointer-events: none;
}

.preset {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 8px 10px; margin-bottom: 4px; border-radius: var(--radius);
  background: var(--raised); border: 1px solid var(--line-soft); color: inherit;
}
.preset:hover { border-color: var(--line); }
.preset.on { border-color: var(--mint); }
.preset-title {
  display: block; font-family: var(--mono); font-size: 11.5px; color: var(--ink);
}
.preset-why {
  display: block; margin-top: 3px; font-size: 11.5px; color: var(--ink-dim);
  line-height: 1.45;
}

.divergence-note {
  margin: 0 0 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
  color: var(--ink-mid); background: var(--raised);
  border-left: 2px solid var(--warn); border-radius: var(--radius);
}
.divergence-note b { color: var(--warn); font-family: var(--mono); }

#log { list-style: none; margin: 0; padding: 0; }
#log li {
  font-family: var(--mono); font-size: 11px; color: var(--ink-mid);
  padding: 3px 0 3px 10px; border-left: 2px solid var(--line);
}
#log li.muted { border-left-color: transparent; padding-left: 0; }

/* ---------------------------------------------------------------- review --- */
#review-stream {
  margin: 10px 0 0; padding: 8px; max-height: 120px; overflow: hidden;
  font-family: var(--mono); font-size: 10px; line-height: 1.4; color: var(--ink-dim);
  background: var(--raised); border-radius: var(--radius); white-space: pre-wrap;
  word-break: break-word;
}
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; }
.score-cell {
  padding: 8px 10px; border-radius: var(--radius); background: var(--raised);
  border: 1px solid var(--line-soft);
}
.score-cell b {
  display: block; font-family: var(--mono); font-size: 20px; font-weight: 600;
  line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink-dim);
}
.score-cell span {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim);
}
.score-cell.good { border-color: var(--mint); }
.score-cell.good b { color: var(--mint); }
.score-cell.bad { border-color: var(--crit); }
.score-cell.bad b { color: var(--crit); }
.score-cell.warn { border-color: var(--warn); }
.score-cell.warn b { color: var(--warn); }
.cached { margin: 6px 0 0; font-size: 11.5px; color: var(--ink-dim); }

.review-error {
  margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius);
  background: var(--raised); border-left: 2px solid var(--crit);
}
.review-error-code {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--crit);
}
.review-error p { margin: 4px 0 0; color: var(--ink-mid); font-size: 12.5px; }

.findings { list-style: none; margin: 0; padding: 0; }
.findings li {
  padding: 7px 0 7px 10px; border-left: 2px solid var(--line);
  border-bottom: 1px solid var(--line-soft);
}
.findings li:last-child { border-bottom: none; }
.findings li.sev-critical { border-left-color: var(--crit); }
.findings li.sev-major { border-left-color: var(--warn); }
.findings li.missed { border-left-color: var(--crit); }
.finding {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; padding: 0; color: inherit; font: inherit;
}
.finding:hover .bullet:first-child { color: var(--mint); }
.findings li.focused { background: var(--raised); }
.findings li.focused .bullet:first-child { color: var(--mint); }
.findings .bullet {
  display: block; font-size: 12.5px; color: var(--ink-mid); margin-bottom: 3px;
  padding-left: 58px; text-indent: -58px;
}
.findings .bullet:first-child { color: var(--ink); }
.findings .bullet em {
  display: inline-block; width: 54px; margin-right: 4px; text-indent: 0;
  font-family: var(--mono); font-size: 9px; font-style: normal;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim);
  vertical-align: 1px;
}
.findings .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.findings code {
  font-family: var(--mono); font-size: 10px; padding: 1px 5px;
  background: var(--raised); color: var(--ink-dim); border-radius: 2px;
}
#budget {
  margin: 10px 0 0; font-family: var(--mono); font-size: 10px;
  letter-spacing: .06em; color: var(--ink-dim);
}

@media (max-width: 900px) {
  .app { height: auto; }
  main { flex-direction: column; }
  .viewport { height: 62vh; min-height: 340px; }
  .rail { width: auto; border-left: none; border-top: 1px solid var(--line); }
  header { flex-wrap: wrap; gap: 10px 14px; }
  .stats { margin-left: 0; width: 100%; }
}
</style>

<div class="app">
  <header>
    <div class="brand">PCB<em>·</em>EVAL</div>
    <div class="board-id" id="board-id"></div>
    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" data-view="routing" aria-selected="true">Board</button>
      <button class="tab tab-review" role="tab" id="tab-review" data-view="review"
              aria-selected="false">Review</button>
    </nav>
    <div class="stats" id="board-stats"></div>
  </header>

  <main>
    <section class="viewport">
      <div id="stage"></div>
      <div class="overlay-tl" id="layer-chips">
        <button class="chip" data-layer="f-cu">F.Cu</button>
        <button class="chip" data-layer="b-cu">B.Cu</button>
        <button class="chip" data-layer="silk">Silk</button>
        <button class="chip" data-layer="labels">Refs</button>
        <button class="chip" data-layer="datasheets">Datasheets</button>
      </div>
      <div class="overlay-br">
        <button class="chip" id="fit">Fit</button>
        <span>scroll to zoom · drag to pan</span>
      </div>
      <div id="review-overlay" hidden></div>
      <div id="flash" role="status" aria-live="polite"></div>
    </section>

    <aside class="rail">
      <section class="panel">
        <h3>Board</h3>
        <div id="source"></div>
        <div class="row" style="margin-top:10px">
          <label class="btn file">
            Open KiCad project folder
            <input type="file" id="file-input" multiple webkitdirectory directory
                   accept=".kicad_pcb,.kicad_sch">
          </label>
        </div>

      </section>

      <section class="panel">
        <h3>Inspector</h3>
        <div id="inspector"></div>
      </section>

      <section class="panel">
        <h3>Edits <span id="log-count">none</span></h3>
        <p class="divergence-note" id="divergence" hidden></p>
        <ul id="log"></ul>
        <div class="row">
          <button class="btn" id="undo" disabled>Undo</button>
          <button class="btn" id="reset" disabled>Reset board</button>
        </div>
      </section>

      <section class="panel">
        <h3>Review</h3>
        <button class="primary" id="go" hidden>Review this board</button>
        <pre id="review-stream" hidden></pre>
        <div id="review"></div>
        <p id="budget"></p>
      </section>
    </aside>
  </main>
</div>
